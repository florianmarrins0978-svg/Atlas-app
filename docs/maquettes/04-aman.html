<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — dans l'esprit d'Aman</title>
</head>
<body>
<style>
  :root{ --fond:#efece6; --encre:#221f1a; --gris:#8b8478; --trait:rgba(34,31,26,.14); --bronze:#8a7452; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --fond:#171613; --encre:#e9e5dc; --gris:#8a867c; --trait:rgba(233,229,220,.16); --bronze:#b39b72; }
  }
  :root[data-theme="dark"]{ --fond:#171613; --encre:#e9e5dc; --gris:#8a867c; --trait:rgba(233,229,220,.16); --bronze:#b39b72; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--encre);
       font:16px/1.65 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;padding:48px 20px 76px}
  .page{max-width:1180px;margin:0 auto}
  .intro{max-width:58ch;margin:0 auto 52px;text-align:center}
  .intro .sur{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--bronze);margin:0 0 16px}
  .intro h1{font:400 30px/1.25 ui-serif,Georgia,"Iowan Old Style",serif;margin:0 0 14px;letter-spacing:-.01em}
  .intro p{margin:0;color:var(--gris);font-size:15px}
  .duo{display:flex;flex-wrap:wrap;gap:60px;justify-content:center;align-items:flex-start}
  .prop{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:390px}
  .legende{text-align:center}
  .legende h2{margin:0 0 6px;font:400 11px/1 ui-sans-serif,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze)}
  .legende p{margin:0;font-size:13.6px;color:var(--gris);line-height:1.6}

  .tel{width:390px;max-width:100%;border-radius:44px;padding:11px;background:#cfccc4;
       box-shadow:0 1px 3px rgba(20,18,14,.16),0 36px 78px rgba(20,18,14,.24)}
  .ecran{overflow:hidden;border-radius:34px;height:800px;display:flex;flex-direction:column;
         background:var(--e-fond);color:var(--e-encre);
         font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .serif{font-family:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .caps{text-transform:uppercase;letter-spacing:.28em;font-size:9.5px;font-weight:500}

  /* ── En-tête : le nom seul, centré, souligné d'un cheveu ──────────────── */
  .enseigne{padding:26px 0 18px;text-align:center;font-size:11px;letter-spacing:.52em;font-weight:400}
  .regle{height:1px;background:var(--e-trait)}

  /* ── Le titre ─────────────────────────────────────────────────────────── */
  .titre{padding:44px 26px 0}
  .titre .salut{margin:0;color:var(--e-gris)}
  .titre h1{margin:16px 0 0;font-size:41px;line-height:1.02;font-weight:400;letter-spacing:-.018em}
  .titre .compte{margin:18px 0 0;color:var(--e-gris)}

  /* ── L'action : un rectangle, un cheveu, rien de plus ─────────────────── */
  .action{display:block;margin:34px 26px 0;padding:17px 0;text-align:center;text-decoration:none;
          color:inherit;border:1px solid var(--e-trait-fort)}

  /* ── L'index ──────────────────────────────────────────────────────────── */
  .rubrique{margin:44px 26px 0;padding-bottom:14px;border-bottom:1px solid var(--e-trait);color:var(--e-gris)}
  .liste{padding:0 26px;overflow:hidden}
  .rang{display:grid;grid-template-columns:1fr auto;gap:0 16px;padding:22px 0;
        border-bottom:1px solid var(--e-trait);text-decoration:none;color:inherit}
  .etat{grid-column:1;color:var(--e-gris)}
  .etat.attend{color:var(--e-bronze)}
  .quand{grid-column:2;grid-row:1;text-align:right;color:var(--e-gris)}
  .nom{grid-column:1;margin:10px 0 0;font-size:22px;line-height:1.14;font-weight:400}
  .lieu{grid-column:1;margin:5px 0 0;font-size:12.5px;color:var(--e-gris)}
  .cpt{grid-column:2;grid-row:3;align-self:end;text-align:right;color:var(--e-gris)}

  /* ── Le pied ──────────────────────────────────────────────────────────── */
  .bas{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--e-trait);
       padding:18px 14px 30px}
  .bas a{text-align:center;text-decoration:none;color:var(--e-gris);padding-bottom:8px}
  .bas a.on{color:var(--e-encre);box-shadow:inset 0 -1px 0 var(--e-bronze)}

  .jour{--e-fond:#f0ede7;--e-encre:#221f1a;--e-gris:#8b8478;--e-bronze:#8a7452;
        --e-trait:rgba(34,31,26,.13);--e-trait-fort:rgba(34,31,26,.28)}
  .nuit{--e-fond:#171613;--e-encre:#e9e5dc;--e-gris:#8a867c;--e-bronze:#b39b72;
        --e-trait:rgba(233,229,220,.15);--e-trait-fort:rgba(233,229,220,.32)}
</style>

<div class="page">
  <div class="intro">
    <p class="sur">D’après Aman</p>
    <h1>Ce que j’ai emprunté, et ce que j’ai laissé</h1>
    <p>Ivoire chaud, encre presque noire, une serif claire et de grandes capitales très espacées. Aucun coin arrondi, aucune ombre, aucun aplat : le seul « bouton » est un rectangle cerné d’un cheveu. Ce qui tient la page, c’est le vide.</p>
  </div>

  <div class="duo" id="duo"></div>
</div>

<template id="modele">
  <div class="prop">
    <div class="tel"><div class="ecran">
      <div class="enseigne">ATLAS</div>
      <div class="regle"></div>

      <div class="titre">
        <p class="salut caps">Bonjour Florian</p>
        <h1 class="serif">Vos chantiers</h1>
        <p class="compte caps num">Quatre en cours</p>
      </div>

      <a class="action caps" href="#">Nouveau chantier</a>

      <p class="rubrique caps">En cours</p>

      <div class="liste">
        <a class="rang" href="#">
          <span class="etat caps">Brouillon</span>
          <span class="quand caps num">26 juil.</span>
          <p class="nom serif">Pose de clôture</p>
          <p class="lieu">2 route de Vertou, Vertou</p>
          <span class="cpt caps num">Sans photo</span>
        </a>
        <a class="rang" href="#">
          <span class="etat caps">À vérifier</span>
          <span class="quand caps num">24 juil.</span>
          <p class="nom serif">Rénovation salle de bain</p>
          <p class="lieu">12 rue des Lilas, Nantes</p>
          <span class="cpt caps num">6 photos</span>
        </a>
        <a class="rang" href="#">
          <span class="etat caps attend">Devis retourné</span>
          <span class="quand caps num">22 juil.</span>
          <p class="nom serif">Terrasse bois</p>
          <p class="lieu">5 allée des Tilleuls, Nantes</p>
          <span class="cpt caps num">3 photos</span>
        </a>
      </div>

      <nav class="bas">
        <a class="on caps" href="#">Chantiers</a>
        <a class="caps" href="#">Planning</a>
        <a class="caps" href="#">Terminés</a>
        <a class="caps" href="#">Réglages</a>
      </nav>
    </div></div>
    <div class="legende">
      <h2></h2>
      <p></p>
    </div>
  </div>
</template>

<script>
  // Le même écran, deux fois : seules les couleurs changent. Le gabarit est
  // cloné pour qu'aucune mesure ne puisse diverger entre les deux versions.
  const versions = [
    {
      classe: "jour",
      titre: "Ivoire",
      texte: "Le registre exact d’Aman : ivoire chaud, encre presque noire, un bronze mat qui n’apparaît que deux fois. Lisible en plein soleil, sur un chantier.",
    },
    {
      classe: "nuit",
      titre: "Nuit",
      texte: "La même grammaire en négatif. Aman s’en sert pour ses pages de destination ; ici les cheveux deviennent des traits de lumière et l’écran gagne en gravité.",
    },
  ];

  const duo = document.getElementById("duo");
  const modele = document.getElementById("modele");
  for (const v of versions) {
    const noeud = modele.content.cloneNode(true);
    noeud.querySelector(".ecran").classList.add(v.classe);
    noeud.querySelector(".legende h2").textContent = v.titre;
    noeud.querySelector(".legende p").textContent = v.texte;
    duo.appendChild(noeud);
  }
</script>
</body>
</html>
