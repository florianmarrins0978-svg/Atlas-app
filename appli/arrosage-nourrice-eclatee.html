<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La nourrice éclatée</title>
<!--
  MAQUETTE, RIEN N'EST CODÉ (CLAUDE.md §3 bis). Sa demande du 17 octobre 2026 :
  « une vue éclatée, mais bien alignée, vraiment comme si on ouvrait un regard
  et qu'on regardait la clarinette ».

  LE MODÈLE VALIDÉ, la nourrice de 3 voies à électrovannes MM — sa réponse du
  18 octobre 2026 : « parfait, c'est exactement ça ; lorsqu'on est sur des
  électrovannes MM, c'est ce schéma-là », sur le montage Dura qu'il a envoyé
  (mon-irrigation.com, Montage-clarinette-dura.png) :
  1. en haut, la clarinette FERMÉE : le coude MF à gauche, le coude Dura FF à
     droite (« en haut à droite, ce qu'il faut, c'est un coude femelle ») ;
  2. à gauche, l'arrivée : mamelon réduit, vanne 3/4" FF, mamelon réduit, union
     MF, raccord Plasson femelle 25 x 3/4", PEHD 25 ;
  3. sous chaque voie : électrovanne, union MF, raccord Plasson femelle 25 x
     3/4", PEHD 25 (« pas de mamelon entre l'électrovanne et la clarinette ») ;
  4. l'arrivée à gauche, puis les voies 1, 2, 3 de gauche à droite.

  LES AUTRES TAILLES (1, 2, 4, 5, 6 voies) appliquent ce même modèle à la
  clarinette de leur fiche du 17 août : la place du té 1" MMF (fiches de 2 et
  6 voies, avant le coude FF) et la nourrice d'une voie (les deux coudes
  vissés l'un dans l'autre), proposées, validées par lui le 18 octobre 2026 :
  « tout ce que tu as fait est bon, je valide ».

  LE GOUTTE-À-GOUTTE, validé par lui le même jour (« c'est exactement ça ») :
  sur une voie de goutte-à-goutte, mamelon MM 1", électrovanne FF, mamelon
  réduit (1" en haut), régulateur FF 3/4", mamelon réduit (3/4" en haut), puis
  union, raccord femelle, PEHD ; ces voies sont les dernières, à droite. La photo
  du régulateur (Rain Bird PSI 3/4") sert en attendant les siennes.

  LES PIÈCES ET LEURS NOMBRES SONT CEUX DE SA FICHE (CATALOGUE.nourrices[n]),
  lus dans le calcul empaqueté (arrosage-schema-calcul.js) ; les photos sont
  celles qu'il a validées (arrosage-photos/). Chaque photo est détourée, posée
  sur l'axe où elle se visse, et tournée de l'angle exact qui met ses deux bouts
  de vissage l'un sous l'autre (« les taraudés en face des taraudés »).
-->
<style>
[data-charte="origine"]{--atlas-cream:#f5f3ee;--atlas-card:#faf9f5;--atlas-ink:#1c1c1a;--atlas-inkSoft:#4a4a44;--atlas-muted:#8a8578;--atlas-or:#B98B47;--atlas-line:rgba(28,28,26,0.12);--atlas-alerte:#9C3B2E;--atlas-rustTint:#ece9e1}
[data-charte="nuit"]{--atlas-cream:#101210;--atlas-card:#1a1d19;--atlas-ink:#e9e8de;--atlas-inkSoft:#c1c2b6;--atlas-muted:#84887b;--atlas-or:#B98B47;--atlas-line:rgba(233,232,222,0.12);--atlas-alerte:#cd6456;--atlas-rustTint:#1f211e}
  *{box-sizing:border-box}
  html{background:var(--atlas-rustTint)}
  body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--atlas-ink);background:var(--atlas-rustTint)}
  .entete{max-width:430px;margin:0 auto;padding:18px 16px 6px}
  .entete h1{margin:0;font:400 24px/1.15 Georgia,"Times New Roman",serif}
  .entete p{margin:6px 0 0;font-size:13.5px;color:var(--atlas-inkSoft)}
  .entete select{margin-top:10px;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--atlas-line);background:var(--atlas-card);color:var(--atlas-ink)}
  .ecran{max-width:430px;margin:10px auto 0;background:var(--atlas-cream);padding:14px 16px 70px;min-height:100vh}
  .caps{display:block;margin:0;font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--atlas-or)}
  .voies{display:flex;gap:6px;margin-top:10px}
  .voies button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--atlas-line);background:var(--atlas-card);color:var(--atlas-ink);font-size:15px;cursor:pointer}
  .voies button[aria-pressed="true"]{background:var(--atlas-ink);border-color:var(--atlas-ink);color:var(--atlas-card)}
  .voies button:focus-visible{outline:2px solid var(--atlas-or);outline-offset:2px}
  h2{margin:16px 0 0;font:400 21px/1.2 Georgia,"Times New Roman",serif}
  .sous{margin:4px 0 0;font-size:13.5px;color:var(--atlas-muted)}

  /* LE REGARD OUVERT : une seule image, chaque pièce sur l'axe où elle se visse. */
  .regard{position:relative;margin-top:14px;border-radius:16px;background:#ffffff;padding:8px 0;box-shadow:inset 0 0 0 1px var(--atlas-line);overflow:hidden}
  .regard canvas{display:block;width:358px;max-width:100%;margin:0 auto}
  .legende{margin:12px 0 0;padding:0;list-style:none;columns:2;column-gap:14px;font-size:12.5px;color:var(--atlas-inkSoft)}
  .legende li{display:flex;gap:6px;break-inside:avoid;padding:2px 0}
  .legende b{flex:none;width:17px;height:17px;border-radius:50%;background:var(--atlas-ink);color:var(--atlas-card);font-size:10px;line-height:17px;text-align:center}
  .note{margin:14px 0 0;font-size:13.5px;color:var(--atlas-inkSoft)}
  .note b{color:var(--atlas-alerte);font-weight:600}
  /* Le bac : les pièces de la fiche qui n'ont pas de place dans le regard. */
  .bac{margin-top:18px}
  .bac h3{margin:0;font-size:14px;font-weight:600}
  .bac .sous{margin-top:2px}
  .rangee{display:flex;flex-wrap:wrap;gap:12px 8px;margin-top:10px;border-radius:14px;background:var(--atlas-card);padding:14px 10px}
  .p{display:flex;flex-direction:column;align-items:center;width:72px;min-width:0;text-align:center}
  .p .ph{display:flex;align-items:center;justify-content:center;width:100%;max-width:64px;aspect-ratio:1}
  .p .ph img{max-width:100%;max-height:100%;object-fit:contain}
  .p .n{margin-top:4px;font-size:10.5px;line-height:1.25;color:var(--atlas-inkSoft)}
  .vide{border:1.5px dashed var(--atlas-line);border-radius:10px;font-size:10px;color:var(--atlas-muted)}
</style>
<body data-charte="origine">
<div class="entete">
  <h1>La nourrice éclatée</h1>
  <p>Planche à part, rien n’est codé. Le regard ouvert, chaque pièce sous celle où elle se visse.</p>
  <select id="charte" aria-label="Charte"><option value="origine">Origine</option><option value="nuit">Nuit</option></select>
</div>
<main class="ecran">
  <span class="caps">Combien de voies</span>
  <div class="voies" role="group" aria-label="Nombre de voies">
    <button type="button" data-voies="1">1</button><button type="button" data-voies="2">2</button>
    <button type="button" data-voies="3">3</button><button type="button" data-voies="4">4</button>
    <button type="button" data-voies="5">5</button><button type="button" data-voies="6">6</button>
  </div>
  <span class="caps" style="margin-top:14px">Dont en goutte-à-goutte</span>
  <div class="voies" id="goutte" role="group" aria-label="Voies de goutte-à-goutte"></div>
  <h2 id="titre"></h2>
  <p class="sous" id="sous-titre"></p>
  <div class="regard"><canvas id="dessin" width="358" height="420" role="img" aria-label="La nourrice, pièce par pièce"></canvas></div>
  <ol class="legende" id="legende"></ol>
  <p class="note" id="note"></p>

  <div class="bac">
    <h3>Les autres pièces de la fiche</h3>
    <p class="sous">Elles ne se vissent pas sur la nourrice.</p>
    <div class="rangee" id="bac"></div>
  </div>
</main>

<script src="arrosage-schema-calcul.js"></script>
<script>
(function () {
  var CAT = window.CALCUL.CATALOGUE;
  var PHOTOS = {
    "coude-mf": "coude-mf.jpg", "coude-ff": "coude-ff.png",
    "clarinette-2v": "clarinette-2v.jpg", "clarinette-3v": "clarinette-3v.jpg", "clarinette-4v": "clarinette-4v.jpg",
    "te-mmf": "te-mmf.jpg", "electrovanne-100dv": "electrovanne-100dv.jpg", "mamelon": "mamelon.jpg",
    "vanne-purge": "vanne-purge.jpg", "union": "union-ff.jpg", "raccord-male25": "raccord-male25.jpg", "pehd": "pehd.jpg",
    "regard-rect12": "regard-rect12.jpg", "regard-rg17106": "regard-rg17106.jpg", "regard-jumbo5": "regard-jumbo5.jpg",
    "regard-jumbo6": "regard-jumbo6.jpg", "prog-1": "prog-1.jpg", "prog-2": "prog-2.jpg", "prog-4": "prog-4.jpg",
    "prog-6": "prog-6.jpg", "pile-9v": "pile-9v.jpg", "connexion": "connexion.jpg",
    "electrovanne-100dv-ff": "electrovanne-100dv-ff.png", "mamelon-droit-1": "mamelon-droit-1.jpg", "regulateur-ff34": "regulateur-ff34.jpg"
  };
  var $ = function (id) { return document.getElementById(id); };
  var texte = function (s) { var e = document.createElement("span"); e.textContent = s; return e.innerHTML; };
  var nom = function (ref) { var p = CAT.piece(ref); return p ? (p.marque ? p.marque + " " : "") + p.nom : ref; };
  $("charte").onchange = function () { document.body.dataset.charte = this.value; };

  // LES FORMES, relevées sur ses photos validées détourées (en fraction de la photo).
  // Le haut : h, la hauteur dessinée ; les axes où la pièce se visse.
  //   coude MF : branche verticale à 26 % de sa largeur, bras horizontal à 23 % de sa hauteur ;
  //   coude FF, en miroir : branche verticale à 73 %, bras horizontal à 30 % ;
  //   té MMF, retourné : branche descendante à 52 %, passage horizontal à 23 % ;
  //   clarinettes : leurs sorties, et l'axe du tube.
  var HAUT = {
    "coude-mf":      { h: 46, vertical: 0.259, horizontal: 0.226 },
    "coude-ff":      { h: 52, vertical: 0.732, horizontal: 0.295, miroir: true },
    "te-mmf":        { h: 44, vertical: 0.52, horizontal: 0.225, demi: true },
    "clarinette-2v": { w: 150, sorties: [0.307, 0.778], tube: 0.338 },
    "clarinette-3v": { w: 220, sorties: [0.21, 0.535, 0.85], tube: 0.336 },
    "clarinette-4v": { w: 296, sorties: [0.16, 0.40, 0.64, 0.88], tube: 0.345 }
  };
  // Les pièces des colonnes : a, le bout du haut ; b, le bout du bas ; L, la
  // longueur dessinée de a à b. La photo est tournée pour mettre b sous a.
  var COLONNE = {
    "mamelon":            { a: [0.491, 0.02], b: [0.504, 0.98], L: 28 },
    "mamelon-demi":       { a: [0.504, 0.98], b: [0.491, 0.02], L: 28, src: "mamelon" },
    // Retournée, sa demande du 18 octobre 2026 : la vis de purge en haut, la poignée rouge à gauche.
    "vanne-purge":        { a: [0.606, 0.714], b: [0.033, 0.857], L: 40 },
    "union":              { a: [0.092, 0.717], b: [0.935, 0.253], L: 46 },
    "raccord-male25":     { a: [0.092, 0.66], b: [0.931, 0.326], L: 40 },
    "pehd":               { a: [0, 0.509], b: [1, 0.509], L: 44 },
    "electrovanne-100dv": { a: [0.037, 0.776], b: [0.982, 0.912], L: 50 },
    // La voie de goutte-à-goutte : électrovanne FF, régulateur, mamelons.
    "electrovanne-100dv-ff": { a: [0.26, 0.733], b: [0.983, 0.564], L: 50 },
    "mamelon-droit-1":    { a: [0.478, 0.02], b: [0.51, 0.98], L: 26 },
    "regulateur-ff34":    { a: [0.493, 0.02], b: [0.484, 0.98], L: 44 }
  };

  var images = {};
  function charger(ref) {
    return new Promise(function (ok) {
      if (!PHOTOS[ref]) return ok(null);
      var img = new Image(); img.onload = function () { ok(detourer(img)); }; img.onerror = function () { ok(null); };
      img.src = "arrosage-photos/" + PHOTOS[ref];
    });
  }
  // Détourer : garder le rectangle où la pièce n'est pas blanche.
  function detourer(img) {
    var c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    var g = c.getContext("2d"); g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, c.width, c.height).data, x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (var y = 0; y < c.height; y += 2) for (var x = 0; x < c.width; x += 2) {
      var i = (y * c.width + x) * 4;
      if (d[i + 3] > 20 && (d[i] < 225 || d[i + 1] < 225 || d[i + 2] < 225)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    var k = document.createElement("canvas"); k.width = x1 - x0 + 1; k.height = y1 - y0 + 1;
    k.getContext("2d").drawImage(c, x0, y0, k.width, k.height, 0, 0, k.width, k.height);
    return k;
  }
  function taille(ref) {
    var f = HAUT[ref], im = images[ref];
    if (!im) return { w: f.w || 40, h: f.h || 40 };
    if (f.w) return { w: f.w, h: f.w * im.height / im.width };
    return { w: f.h * im.width / im.height, h: f.h };
  }

  var fiche, reste, poses, ordre;
  function pris(ref) { if (reste[ref] > 0) reste[ref]--; }
  function numero(ref) { var i = ordre.indexOf(ref); if (i < 0) { ordre.push(ref); i = ordre.length - 1; } return i + 1; }
  function haut(ref, x, y) { var t = taille(ref); poses.push({ haut: true, ref: ref, x: x, y: y, w: t.w, h: t.h }); pris(ref); return t; }
  function colonne(cle, x, y) { var f = COLONNE[cle]; poses.push({ cle: cle, ref: f.src || cle, x: x, y: y }); pris(f.src || cle); return y + f.L; }

  var ECART = 9, W = 358;
  function dessiner(n, nbGoutte) {
    // Sa fiche, modifiée par voie de goutte-à-goutte (sa règle du 17 août,
    // `CATALOGUE.ficheNourrice`) : électrovanne FF, régulateur FF 3/4", mamelons.
    fiche = CAT.ficheNourrice(n, nbGoutte); reste = {}; poses = []; ordre = [];
    fiche.pieces.forEach(function (x) { reste[x.ref] = (reste[x.ref] || 0) + x.q; });
    var clar = ["clarinette-2v", "clarinette-3v", "clarinette-4v"].filter(function (r) { return reste[r]; })[0];
    var avecTe = Boolean(reste["te-mmf"]);

    // Le haut, de gauche à droite : coude MF, clarinette, té, coude FF. Leurs bras
    // horizontaux sur un même axe : celui du tube de la clarinette.
    // La poignée de la vanne retournée dépasse à gauche de son axe : la marge la garde dans le dessin.
    var x = 34, yTop = 12, axe = yTop + (clar ? taille(clar).h * HAUT[clar].tube : 22), axes = [];
    var cg = haut("coude-mf", x, 0); poses[poses.length - 1].y = axe - cg.h * HAUT["coude-mf"].horizontal;
    var xL = x + cg.w * HAUT["coude-mf"].vertical; x += cg.w + ECART;
    if (clar) {
      var cl = haut(clar, x, yTop);
      HAUT[clar].sorties.forEach(function (s) { axes.push(x + s * cl.w); });
      x += cl.w + ECART;
    }
    if (avecTe) {
      var te = haut("te-mmf", x, 0); poses[poses.length - 1].y = axe - te.h * HAUT["te-mmf"].horizontal;
      axes.push(x + te.w * HAUT["te-mmf"].vertical); x += te.w + ECART;
    }
    var cd = haut("coude-ff", x, 0); poses[poses.length - 1].y = axe - cd.h * HAUT["coude-ff"].horizontal;
    axes.push(x + cd.w * HAUT["coude-ff"].vertical);
    var bas = 0; poses.forEach(function (p) { bas = Math.max(bas, p.y + p.h); }); bas += ECART;

    // L'arrivée, à gauche, de haut en bas.
    var y = colonne("mamelon-demi", xL, bas) + ECART;
    y = colonne("vanne-purge", xL, y) + ECART;
    y = colonne("mamelon", xL, y) + ECART;
    y = colonne("union", xL, y) + ECART;
    y = colonne("raccord-male25", xL, y) + ECART;
    var fin = colonne("pehd", xL, y), finArrivee = fin, etiquettes = [[xL, fin + 28, "Arrivée"], [xL, fin + 41, "d’eau"]];
    // Les voies, numérotées de gauche à droite après l'arrivée.
    axes.forEach(function (xv, i) {
      // Les voies de goutte-à-goutte sont les dernières, à droite (validé le 18 octobre 2026).
      var goutte = i >= axes.length - nbGoutte, yv = bas;
      if (goutte) {
        // L'ordre qu'il a validé : mamelon MM 1", électrovanne FF, mamelon réduit (1" en
        // haut), régulateur FF 3/4", mamelon réduit (3/4" en haut), puis la suite
        // de toute voie.
        yv = colonne("mamelon-droit-1", xv, yv) + ECART;
        yv = colonne("electrovanne-100dv-ff", xv, yv) + ECART;
        yv = colonne("mamelon-demi", xv, yv) + ECART;
        yv = colonne("regulateur-ff34", xv, yv) + ECART;
        yv = colonne("mamelon", xv, yv) + ECART;
      } else {
        yv = colonne("electrovanne-100dv", xv, yv) + ECART;
      }
      yv = colonne("union", xv, yv) + ECART;
      yv = colonne("raccord-male25", xv, yv) + ECART;
      yv = colonne("pehd", xv, yv);
      etiquettes.push([xv, yv, "Voie " + (i + 1)]);
      if (goutte) etiquettes.push([xv, yv + 13, "goutte-à-goutte"]);
      fin = Math.max(fin, yv);
    });
    fin = Math.max(fin, finArrivee + 41);

    // La largeur : la bobine de la dernière électrovanne déborde à droite de son axe.
    var largeur = Math.max(x + cd.w, axes[axes.length - 1] + 70) + 8;
    var k = Math.min(1, W / largeur), H = (fin + 46) * k, c = $("dessin"), r = window.devicePixelRatio || 1;
    c.width = W * r; c.height = H * r; c.style.height = H + "px";
    var g = c.getContext("2d"); g.setTransform(r, 0, 0, r, 0, 0);
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
    g.setTransform(r * k, 0, 0, r * k, (W - largeur * k) / 2 * r, 0);
    poses.forEach(function (p) {
      var im = images[p.ref];
      if (p.haut) {
        var f = HAUT[p.ref];
        if (im) {
          g.save(); g.translate(p.x + p.w / 2, p.y + p.h / 2);
          if (f.demi) g.rotate(Math.PI);
          if (f.miroir) g.scale(-1, 1);
          // En « multiplier », le blanc d'une photo disparaît : une pièce ne cache plus sa voisine.
          g.globalCompositeOperation = "multiply"; g.drawImage(im, -p.w / 2, -p.h / 2, p.w, p.h); g.restore();
        }
        badge(g, numero(p.ref), p.x + p.w + 2, p.y + 5);
        return;
      }
      var fc = COLONNE[p.cle];
      if (im) {
        var ax = fc.a[0] * im.width, ay = fc.a[1] * im.height, bx = fc.b[0] * im.width, by = fc.b[1] * im.height;
        var s = fc.L / Math.hypot(bx - ax, by - ay), angle = Math.PI / 2 - Math.atan2(by - ay, bx - ax);
        g.save(); g.translate(p.x, p.y); g.rotate(angle); g.scale(s, s);
        g.globalCompositeOperation = "multiply"; g.drawImage(im, -ax, -ay); g.restore();
      }
      badge(g, numero(p.ref), p.x + 24, p.y + fc.L / 2);
    });
    g.globalCompositeOperation = "source-over";
    g.fillStyle = "#4a4a44"; g.font = "11px -apple-system, Segoe UI, sans-serif"; g.textAlign = "center"; g.textBaseline = "top";
    // L'ARRIVÉE D'EAU : le mot en bas, puis une flèche qui monte jusqu'au PEHD
    // (sa demande du 18 octobre 2026). Une flèche qui montre d'où vient l'eau,
    // pas un ornement.
    g.strokeStyle = "#4a4a44"; g.fillStyle = "#4a4a44"; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(xL, finArrivee + 30); g.lineTo(xL, finArrivee + 9); g.stroke();
    g.beginPath(); g.moveTo(xL, finArrivee + 4); g.lineTo(xL - 5, finArrivee + 11); g.lineTo(xL + 5, finArrivee + 11); g.closePath(); g.fill();
    g.fillStyle = "#4a4a44";
    etiquettes.forEach(function (e) { g.fillText(e[2], e[0], e[1] + 6); });

    $("titre").textContent = fiche.nom;
    $("sous-titre").textContent = n + " voie" + (n > 1 ? "s" : "") + ", l’arrivée à gauche, puis les voies de gauche à droite.";
    var NOMS = { "coude-mf": "Coude MF 1\"", "mamelon": "Mamelon réduit MM 1\" x 3/4\"", "vanne-purge": "Vanne 3/4\" FF",
      "pehd": "PEHD Ø25", "raccord-male25": nom("raccord-male25") };
    $("legende").innerHTML = ordre.map(function (ref, i) { return "<li><b>" + (i + 1) + "</b>" + texte(NOMS[ref] || nom(ref)) + "</li>"; }).join("");
    var notes = [];
    $("note").innerHTML = notes.length ? notes.map(texte).join(" ") + " <b>À confirmer.</b>" : "";

    var bac = "";
    Object.keys(reste).forEach(function (ref) {
      for (var i = 0; i < reste[ref]; i++) {
        var photo = PHOTOS[ref] ? '<img src="arrosage-photos/' + PHOTOS[ref] + '" alt="">' : "photo à venir";
        bac += '<div class="p"><span class="ph' + (PHOTOS[ref] ? "" : " vide") + '">' + photo + '</span><span class="n">' +
          texte(nom(ref) + (reste[ref] > 1 ? ", " + (i + 1) + " sur " + reste[ref] : "")) + "</span></div>";
      }
    });
    $("bac").innerHTML = bac;
    document.querySelectorAll("[data-voies]").forEach(function (b) { b.setAttribute("aria-pressed", String(Number(b.dataset.voies) === n)); });
    // Combien de voies de goutte-à-goutte : de 0 à n.
    var gg = "";
    for (var j = 0; j <= n; j++) gg += '<button type="button" data-goutte="' + j + '" aria-pressed="' + (j === nbGoutte) + '">' + (j ? j : "Aucune") + "</button>";
    $("goutte").innerHTML = gg;
  }
  function badge(g, n, x, y) {
    g.globalCompositeOperation = "source-over";
    g.fillStyle = "#1c1c1a"; g.beginPath(); g.arc(x, y, 7, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ffffff"; g.font = "600 9px -apple-system, Segoe UI, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(n), x, y + 0.5);
  }

  var voies = 3, nbGoutte = 0;
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-voies]"), bg = e.target.closest("button[data-goutte]");
    if (b) { voies = Number(b.dataset.voies); nbGoutte = Math.min(nbGoutte, voies); dessiner(voies, nbGoutte); }
    if (bg) { nbGoutte = Number(bg.dataset.goutte); dessiner(voies, nbGoutte); }
  });
  var aCharger = Object.keys(HAUT).concat(Object.keys(COLONNE).map(function (k) { return COLONNE[k].src || k; }));
  Promise.all(aCharger.filter(function (r, i) { return aCharger.indexOf(r) === i; }).map(function (r) {
    return charger(r).then(function (im) { images[r] = im; });
  })).then(function () { dessiner(voies, nbGoutte); });
})();
</script>
</body>
</html>
