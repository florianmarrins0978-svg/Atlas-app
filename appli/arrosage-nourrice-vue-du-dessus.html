<!--
  MAQUETTE, RIEN N'EST CODÉ (CLAUDE.md §3 bis). Sa demande du 21 novembre 2026,
  avec treize photos : « refaire la nourrice d'arrosage vue du dessus avec
  toutes les pièces bien d'équerre, de niveau, dis-moi s'il te manque une
  pièce ». Ce sont les photos de face que TODO.md attendait depuis le
  18 octobre : celles de trois quarts restaient de biais quel que soit l'angle
  (ARCHITECTURE.md §475).

  LE MONTAGE NE CHANGE PAS : c'est celui qu'il a validé le 18 octobre 2026
  (appli/arrosage-nourrice-eclatee.html, src/lib/arrosage/nourrice-eclatee.ts),
  avec les pièces et les nombres de sa fiche (CATALOGUE.nourrices[n]). Seules
  les photos changent, et les fractions qui posent chaque photo sur son axe.
  Le bouton « Avant » remet la planche du 18 octobre, pour comparer AVANT tout
  remplacement dans l'outil (la consigne de TODO.md).

  SES PHOTOS, PRÉPARÉES (appli/arrosage-photos/, suffixe « -dessus ») : le fond et l'ombre
  portée retirés (le PVC est bleuté, l'ombre sur la table est neutre), et
  gardées dans le sens où il les a prises, puisque les listes de pièces les
  montrent aussi. Le dessin les pose : une pièce de colonne tourne de l'angle
  qui met ses deux bouts l'un sous l'autre (un quart pour l'électrovanne FF,
  la vanne et l'union, couchées sur la photo), le coude FF tourne d'un quart
  (quart), le té se retourne en miroir : photographié mâle à gauche, il se
  pose femelle à gauche (le filetage de la clarinette y entre), donc son
  « DURA » se lit à l'envers dans le dessin. Aucune pièce n'est étirée ni
  déformée.

  LES FRACTIONS SONT MESURÉES, PAS RÉGLÉES À L'ŒIL (§475). Le milieu d'un bout
  est la moyenne, ligne par ligne, du milieu entre ses deux bords, sur une
  bande où il est droit ; l'axe passe par ces deux milieux. Deux bouts se
  lisent autrement, parce qu'un bord est caché : le haut de l'électrovanne MM
  par le sommet de l'arc de son filetage (un fil passe devant son bord droit),
  le haut de l'électrovanne FF par son bord gauche plus la demi-largeur de son
  bout du bas (la bobine cache le bord droit ; les deux bouts sont à plat,
  donc de même largeur). Contrôle sur le rendu à 3x : chaque bout à moins
  d'un pixel de l'axe de sa colonne.

  UNE SEULE ÉCHELLE POUR TOUTES LES PIÈCES, sa demande du 21 au soir : « le
  coude en haut à droite, on dirait qu'il est plus gros que la clarinette ;
  essaie de mettre toutes les pièces à la même dimension ». Mesuré sur le
  dessin, les écrous du haut avaient déjà la même taille (74 à 84 px à 3x) ;
  c'étaient les colonnes, gardées aux longueurs du 18 octobre, qui étaient 30 %
  plus petites (l'union sous la clarinette : 57 px d'écrou contre 80). Chaque
  pièce se dessine maintenant à l'échelle de ses repères 1" : un filetage ou un
  tube 1" fait 17,7 px de dessin (le tube de la clarinette 2 voies), un écrou
  union 27 px, le PEHD Ø25 13,3 px, la douille femelle 1" de l'électrovanne FF
  21 px. Les longueurs L des colonnes en sortent (photo mesurée, puis
  L = échelle x distance de ses deux bouts). Le coude FF est ramené de 51,5 à
  49,2 px, son écrou à celui de la clarinette voisine : sur sa photo, son corps
  est presque aussi large que ses écrous, et c'est ce qui le fait paraître plus
  gros. Puis, sa remarque à 6 voies : « le coude de droite et le té, en
  Dura, encore trop gros par rapport à la clarinette et au coude de gauche ».
  Leurs écrous avaient la taille de ceux de la clarinette, mais leur corps
  était plus épais (le filetage du té : 43 px à 3x, contre 38 pour le tube de
  la clarinette et 36 pour le bras du coude MF). Le té passe de 53,5 à 47 px,
  son filetage à l'épaisseur du tube de la clarinette ; le coude FF de 49,2 à
  46, à l'allure du coude de gauche. Et, sa remarque suivante, « les unions
  et la vanne 3/4 paraissent plus petites que les coudes et la clarinette » :
  leurs écrous mesuraient pourtant ceux de la clarinette (80 px contre 82 à
  3x), mais le corps de l'union est plus fin que ses écrous, et la vanne était
  à la taille réelle d'un bout 3/4". L'union passe de 63,1 à 69,5, la vanne de
  36,4 à 42 : c'est son œil sur le dessin entier qui tranche.
  MAL LU, ET CORRIGÉ : par « l'union », il désignait le MAMELON, la pièce qui
  se visse dans l'écrou femelle du coude (il l'a précisé : « en face du coude
  femelle, il est censé se visser dedans, il est trop petit »). Le manchon
  union revient à 63,1, ses écrous à la largeur de ceux des coudes ; le
  mamelon réduit passe de 25,6 à 32,5 (son filetage 1" a l'air d'entrer dans
  l'écrou du coude), le mamelon 1" de 28,6 à 33, la vanne de 42 à 50. Les fils des deux électrovannes ont leur place au-dessus d'elles
  (dessus), et chaque pastille se pose à droite de sa pièce.

  LE RACCORD PLASSON, À PLAT : sa photo du 32 x 1" (appli/arrosage-raccord-a-plat.html,
  son « très bien, c'est comme tu m'as montré »). Le 25 x 1" de la fiche a la
  même forme ; la légende garde le nom de la fiche.

  TOUTES LES PIÈCES À PLAT, sa règle du même soir : couchées, vues de profil,
  leur axe dans le plan de la photo, sans qu'on voie la face d'un bout. Une
  image ne se déforme pas : ni penchée, ni étirée.

  LES CLARINETTES À PLAT (sa demande du même soir, « mets la clarinette 2, 3
  et 4 voies à plat », et « il y a des bouts qui manquent, et à d'autres
  endroits il y en a en trop »). Leurs photos étaient prises d'un peu
  au-dessus : seul le bout de chaque sortie s'y voyait de face (l'anneau et le
  trou). Cette face est RETIRÉE, droite, là où finit le flanc de l'écrou ; rien
  n'est déplacé ni étiré, et le tube, l'écrou union et le filetage étaient
  déjà de profil. Le détourage est refait sur ses photos d'origine : le PVC est
  bleuté, l'ombre neutre ; le bas du tube, du col et de l'écrou union est le
  reflet de leur haut autour de l'axe du tube (ce sont des pièces qui tournent
  autour de lui), parce que leur bas tombe sur l'ombre de contact, où la teinte
  hésite d'un bloc de compression à l'autre. C'est là que le détourage d'avant
  faisait ses crans et ses copeaux. Le tube y gagne son vrai dessous : le
  détourage d'avant en avait rogné une bande. Même échelle qu'avant (w).

  LE MAMELON 1" (la pièce entre le coude ou le té et l'électrovanne FF d'une
  voie de goutte-à-goutte) : la photo trouvée en ligne était de biais. Sa
  demande : « mets-les à plat comme les autres unions ». Il prend sa photo de
  mamelon, celle des autres colonnes (un réduit 1" x 3/4", la même forme), le
  côté 1" en haut ; la légende garde le nom de la fiche. Sa photo de mamelon
  est tenue pour à plat.

  LE GRIS DE VOS PHOTOS, au choix (sa remarque du même soir : « pourquoi tu
  n'utilises pas la photo que je t'ai envoyée ? On a l'impression que celle que
  tu utilises est beaucoup plus claire, comme sous le soleil »). C'est bien sa
  photo : le gris clair qui suit l'éclaircissait de 30 à 80 sur 255. « Gris de
  vos photos » ramène toutes les pièces en PVC gris au même gris, la médiane de
  ses photos (100), avec le même écart. Un seul gris toujours, mais le sien.
  Chaque pièce a sa variante « -naturel » : même détourage, même boîte au pixel
  près, donc mêmes fractions. « Gris clair » reste le choix par défaut tant
  qu'il n'a pas tranché.

  UN SEUL GRIS, CLAIR, pour toutes les pièces en PVC gris (sa demande du même
  soir : « soit toutes grises claires, soit toutes grises foncées ; gris clair,
  ça devrait être plus joli »). Coudes, té, clarinettes, union et mamelon ont
  leur luminosité ramenée par une droite à la même médiane (145) et au même
  écart (70 de p10 à p90), et la même teinte, un gris très légèrement bleuté :
  leurs ombres et leurs reflets restent.

  LE RÉGULATEUR garde la photo d'avant : le sien porte DN 15 (1/2"), la fiche
  dit FF 3/4", entre deux mamelons réduits 1" x 3/4". L'union MF
  de son premier envoi a été remplacée le même soir par sa photo de l'union
  FF, celle de la fiche : posée sur ses deux écrous, son corps ne touche pas
  la table, et l'ombre qui s'y glissait a été coupée par symétrie autour de
  l'axe des écrous (le bord du dessus, net sur le blanc, donne la silhouette).

  SANS NUMÉRO NI NOM, sa demande du même soir : le dessin seul, sans pastilles,
  sans « Voie », sans « Arrivée d'eau » ni sa flèche, et sans la légende.
-->

  var JEUX = { tes: TES, avant: AVANT };

  function charger(chemin) {
    return new Promise(function (ok) {
      var img = new Image(); img.onload = function () { ok(detourer(img)); }; img.onerror = function () { ok(null); };
      img.src = "arrosage-photos/" + chemin;
    });
  }
  // Détourer : garder le rectangle où la pièce n'est pas blanche (la règle de la planche du 18 octobre).
  function detourer(img) {
    var c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    var g = c.getContext("2d"); g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, c.width, c.height).data, x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (var y = 0; y < c.height; y += 2) for (var x = 0; x < c.width; x += 2) {
      var i = (y * c.width + x) * 4;
      if (d[i + 3] > 20 && (d[i] < 225 || d[i + 1] < 225 || d[i + 2] < 225)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    var k = document.createElement("canvas"); k.width = x1 - x0 + 1; k.height = y1 - y0 + 1;
    k.getContext("2d").drawImage(c, x0, y0, k.width, k.height, 0, 0, k.width, k.height);
    return k;
  }
  var images = {};
  // LE GRIS DE SES PHOTOS : chaque pièce en PVC gris a sa variante « -naturel », même détourage,
  // même boîte au pixel près (donc mêmes fractions), le gris ramené à la médiane de ses photos.
  var NATUREL = ["coude-mf-dessus.png", "coude-ff-dessus.png", "te-mmf-dessus.png", "clarinette-2v-dessus.png",
    "clarinette-3v-dessus.png", "clarinette-4v-dessus.png", "union-ff-dessus.png", "mamelon-dessus.png"];
  var gris = "clair";
  function fichier(ref) {
    var f = J.photos[ref];
    return jeu === "tes" && gris === "photos" && NATUREL.indexOf(f) >= 0 ? f.replace("-dessus.png", "-dessus-naturel.png") : f;
  }
  function image(ref) { return images[fichier(ref)]; }
  function taille(ref) {
    var f = J.haut[ref], im = image(ref);
    if (!im) return { w: f.w || 40, h: f.h || 40 };
    // Tournée d'un quart, la photo dessinée a la largeur de sa hauteur.
    var iw = f.quart ? im.height : im.width, ih = f.quart ? im.width : im.height;
    if (f.w) return { w: f.w, h: f.w * ih / iw };
    return { w: f.h * iw / ih, h: f.h };
  }

  var J = TES, jeu = "tes", fiche, reste, poses, ordre;
  function pris(ref) { if (reste[ref] > 0) reste[ref]--; }
  function numero(ref) { var i = ordre.indexOf(ref); if (i < 0) { ordre.push(ref); i = ordre.length - 1; } return i + 1; }
  function haut(ref, x, y) { var t = taille(ref); poses.push({ haut: true, ref: ref, x: x, y: y, w: t.w, h: t.h }); pris(ref); return t; }
  function colonne(cle, x, y) { var f = J.colonne[cle]; if (f.dessus) y += Math.max(0, f.dessus + 3 - ECART); poses.push({ cle: cle, ref: f.src || cle, x: x, y: y, L: f.L }); pris(f.src || cle); return y + f.L; }

  var ECART = 9, W = 358;
  function dessiner(n, nbGoutte) {
    fiche = CAT.ficheNourrice(n, nbGoutte); reste = {}; poses = []; ordre = [];
    fiche.pieces.forEach(function (x) { reste[x.ref] = (reste[x.ref] || 0) + x.q; });
    var clar = ["clarinette-2v", "clarinette-3v", "clarinette-4v"].filter(function (r) { return reste[r]; })[0];
    var avecTe = Boolean(reste["te-mmf"]);
    var H = J.haut;

    // Le haut, de gauche à droite : coude MF, clarinette, té, coude FF, leurs bras sur l'axe du tube.
    var x = 34, yTop = 12, axe = yTop + (clar ? taille(clar).h * H[clar].tube : 22), axes = [];
    var cg = haut("coude-mf", x, 0); poses[poses.length - 1].y = axe - cg.h * H["coude-mf"].horizontal;
    var xL = x + cg.w * H["coude-mf"].vertical; x += cg.w + ECART;
    if (clar) {
      var cl = haut(clar, x, yTop);
      H[clar].sorties.forEach(function (s) { axes.push(x + s * cl.w); });
      x += cl.w + ECART;
    }
    if (avecTe) {
      var te = haut("te-mmf", x, 0); poses[poses.length - 1].y = axe - te.h * H["te-mmf"].horizontal;
      axes.push(x + te.w * H["te-mmf"].vertical); x += te.w + ECART;
    }
    var cd = haut("coude-ff", x, 0); poses[poses.length - 1].y = axe - cd.h * H["coude-ff"].horizontal;
    axes.push(x + cd.w * H["coude-ff"].vertical);
    var bas = 0; poses.forEach(function (p) { bas = Math.max(bas, p.y + p.h); }); bas += ECART;

    // L'arrivée, à gauche, de haut en bas.
    var y = colonne("mamelon-demi", xL, bas) + ECART;
    y = colonne("vanne-purge", xL, y) + ECART;
    y = colonne("mamelon", xL, y) + ECART;
    y = colonne("union", xL, y) + ECART;
    y = colonne("raccord-male25", xL, y) + ECART;
    var fin = colonne("pehd", xL, y), finArrivee = fin, finPieces = fin, etiquettes = [[xL, fin + 28, "Arrivée"], [xL, fin + 41, "d’eau"]];
    axes.forEach(function (xv, i) {
      // Les voies de goutte-à-goutte sont les dernières, à droite (validé le 18 octobre 2026).
      var goutte = i >= axes.length - nbGoutte, yv = bas;
      if (goutte) {
        yv = colonne("mamelon-droit-1", xv, yv) + ECART;
        yv = colonne("electrovanne-100dv-ff", xv, yv) + ECART;
        yv = colonne("mamelon-demi", xv, yv) + ECART;
        yv = colonne("regulateur-ff34", xv, yv) + ECART;
        yv = colonne("mamelon", xv, yv) + ECART;
      } else {
        yv = colonne("electrovanne-100dv", xv, yv) + ECART;
      }
      yv = colonne("union", xv, yv) + ECART;
      yv = colonne("raccord-male25", xv, yv) + ECART;
      yv = colonne("pehd", xv, yv);
      // Deux voies de goutte-à-goutte voisines : leurs libellés se décalent d'une hauteur, sans quoi
      // ils se touchent (comme dans l'outil, nourrice-eclatee.ts).
      var dy = goutte && (i - (axes.length - nbGoutte)) % 2 === 1 ? 26 : 0;
      etiquettes.push([xv, yv + dy, "Voie " + (i + 1)]);
      if (goutte) etiquettes.push([xv, yv + dy + 13, "goutte-à-goutte"]);
      fin = Math.max(fin, yv + dy); finPieces = Math.max(finPieces, yv);
    });
    fin = Math.max(fin, finArrivee + 41);

    // La largeur : la bobine de la dernière électrovanne déborde à droite de son axe.
    var largeur = Math.max(x + cd.w, axes[axes.length - 1] + 70) + 8;
    // Sans numéro ni nom, le dessin s'arrête sous le dernier PEHD : plus de place pour les libellés.
    var k = Math.min(1, W / largeur), Ht = (nu ? finPieces + 12 : fin + 46) * k, c = $("dessin"), r = window.devicePixelRatio || 1;
    c.width = W * r; c.height = Ht * r; c.style.height = Ht + "px";
    var g = c.getContext("2d"); g.setTransform(r, 0, 0, r, 0, 0);
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, Ht);
    var dx = (W - largeur * k) / 2;
    g.setTransform(r * k, 0, 0, r * k, dx * r, 0);
    poses.forEach(function (p) {
      var im = image(p.ref);
      if (p.haut) {
        var f = H[p.ref];
        if (im) {
          g.save(); g.translate(p.x + p.w / 2, p.y + p.h / 2);
          if (f.demi) g.rotate(Math.PI);
          if (f.quart) g.rotate(Math.PI / 2);
          if (f.miroir) g.scale(-1, 1);
          // En « multiplier », le blanc d'une photo disparaît : une pièce ne cache plus sa voisine.
          var dw = f.quart ? p.h : p.w, dh = f.quart ? p.w : p.h;
          g.globalCompositeOperation = "multiply"; g.drawImage(im, -dw / 2, -dh / 2, dw, dh); g.restore();
        }
        numero(p.ref);
        if (!nu) badge(g, numero(p.ref), p.x + p.w + 2, p.y + 5);
        return;
      }
      var fc = J.colonne[p.cle];
      p.droite = 0; p.gauche = 0; p.y0 = p.y; p.y1 = p.y + fc.L;
      if (im) {
        var ax = fc.a[0] * im.width, ay = fc.a[1] * im.height, bx = fc.b[0] * im.width, by = fc.b[1] * im.height;
        var s = fc.L / Math.hypot(bx - ax, by - ay), angle = Math.PI / 2 - Math.atan2(by - ay, bx - ax);
        g.save(); g.translate(p.x, p.y); g.rotate(angle); g.scale(s, s);
        g.globalCompositeOperation = "multiply"; g.drawImage(im, -ax, -ay); g.restore();
        // Ce que la pièce dessinée occupe autour de son axe : les coins de sa photo, tournés.
        [[0, 0], [im.width, 0], [0, im.height], [im.width, im.height]].forEach(function (c) {
          var cx = s * ((c[0] - ax) * Math.cos(angle) - (c[1] - ay) * Math.sin(angle));
          var cy = s * ((c[0] - ax) * Math.sin(angle) + (c[1] - ay) * Math.cos(angle));
          p.droite = Math.max(p.droite, cx); p.gauche = Math.min(p.gauche, cx);
          p.y0 = Math.min(p.y0, p.y + cy); p.y1 = Math.max(p.y1, p.y + cy);
        });
      }
      numero(p.ref);
    });
    // LES PASTILLES DES COLONNES, une fois toutes les pièces posées : à droite de la pièce (à la
    // même échelle que le haut, une électrovanne ou un raccord dépassent les 24 px d'avant), mais
    // jamais sur la pièce de la colonne voisine. À 6 voies de goutte-à-goutte, les électrovannes FF
    // se touchent presque, et la pastille de l'une tombait sur l'autre : elle s'arrête avant.
    if (!nu) poses.forEach(function (p) {
      if (p.haut) return;
      var fc = J.colonne[p.cle], by = p.y + fc.L / 2, bx = p.x + Math.max(24, p.droite + 9);
      poses.forEach(function (q) {
        if (q.haut || q.x <= p.x + 1 || by < q.y0 - 8 || by > q.y1 + 8) return;
        bx = Math.min(bx, q.x + q.gauche - 8);
      });
      badge(g, numero(p.ref), Math.max(bx, p.x + 10), by);
    });
    g.globalCompositeOperation = "source-over";
    // L'ARRIVÉE D'EAU : le mot en bas, puis une flèche qui monte jusqu'au PEHD
    // (sa demande du 18 octobre 2026). Elle montre d'où vient l'eau, elle ne décore pas.
    if (!nu) {
      g.strokeStyle = "#4a4a44"; g.fillStyle = "#4a4a44"; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(xL, finArrivee + 30); g.lineTo(xL, finArrivee + 9); g.stroke();
      g.beginPath(); g.moveTo(xL, finArrivee + 4); g.lineTo(xL - 5, finArrivee + 11); g.lineTo(xL + 5, finArrivee + 11); g.closePath(); g.fill();
      g.font = "11px -apple-system, Segoe UI, sans-serif"; g.textAlign = "center"; g.textBaseline = "top";
      etiquettes.forEach(function (e) { g.fillText(e[2], e[0], e[1] + 6); });
    }
    // Pour le contrôle au rendu : où chaque pièce est posée, en pixels du canvas.
    window.__nourrice = { r: r, k: k, dx: dx, poses: poses, axes: axes, xL: xL, axe: axe, jeu: jeu, gris: gris };

    $("titre").textContent = fiche.nom;
    $("sous-titre").textContent = n + " voie" + (n > 1 ? "s" : "") + ", l’arrivée à gauche, puis les voies de gauche à droite.";
    var NOMS = { "coude-mf": "Coude MF 1\"", "mamelon": "Mamelon réduit MM 1\" x 3/4\"", "vanne-purge": "Vanne 3/4\" FF",
      "pehd": "PEHD Ø25", "raccord-male25": nom("raccord-male25") };
    $("legende").innerHTML = ordre.map(function (ref, i) {
      var avant = jeu === "tes" && TES.aRefaire.indexOf(ref) >= 0;
      return "<li><b>" + (i + 1) + "</b><span>" + texte(NOMS[ref] || nom(ref)) + (avant ? '<span class="avant">photo d’avant</span>' : "") + "</span></li>";
    }).join("");
    $("hors").hidden = jeu !== "tes";
    $("legende").hidden = nu;
    document.querySelectorAll("[data-nu]").forEach(function (b) { b.setAttribute("aria-pressed", String((b.dataset.nu === "1") === nu)); });
    document.querySelectorAll("[data-voies]").forEach(function (b) { b.setAttribute("aria-pressed", String(Number(b.dataset.voies) === n)); });
    document.querySelectorAll("[data-jeu]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.jeu === jeu)); });
    // « Avant » montre les photos d'avant : le gris ne s'y choisit pas, le choix se retire.
    $("gris").hidden = jeu !== "tes";
    document.querySelectorAll("[data-gris]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.gris === gris)); });
    var gg = "";
    for (var j = 0; j <= n; j++) gg += '<button type="button" data-goutte="' + j + '" aria-pressed="' + (j === nbGoutte) + '">' + (j ? j : "Aucune") + "</button>";
    $("goutte").innerHTML = gg;
  }
  function badge(g, n, x, y) {
    g.globalCompositeOperation = "source-over";
    g.fillStyle = "#1c1c1a"; g.beginPath(); g.arc(x, y, 7, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ffffff"; g.font = "600 9px -apple-system, Segoe UI, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(n), x, y + 0.5);
  }

  var voies = 3, nbGoutte = 0, nu = false;
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-voies]"), bg = e.target.closest("button[data-goutte]"), bj = e.target.closest("button[data-jeu]"), bn = e.target.closest("button[data-nu]"), bgr = e.target.closest("button[data-gris]");
    if (bgr) { gris = bgr.dataset.gris; dessiner(voies, nbGoutte); }
    if (bn) { nu = bn.dataset.nu === "1"; dessiner(voies, nbGoutte); }
    if (b) { voies = Number(b.dataset.voies); nbGoutte = Math.min(nbGoutte, voies); dessiner(voies, nbGoutte); }
    if (bg) { nbGoutte = Number(bg.dataset.goutte); dessiner(voies, nbGoutte); }
    if (bj) { jeu = bj.dataset.jeu; J = JEUX[jeu]; dessiner(voies, nbGoutte); }
  });
  var chemins = [];
  [TES, AVANT].forEach(function (j) { Object.keys(j.photos).forEach(function (r) { if (chemins.indexOf(j.photos[r]) < 0) chemins.push(j.photos[r]); }); });
  NATUREL.forEach(function (f) { chemins.push(f.replace("-dessus.png", "-dessus-naturel.png")); });
  Promise.all(chemins.map(function (ch) { return charger(ch).then(function (im) { images[ch] = im; }); }))
    .then(function () { dessiner(voies, nbGoutte); });
})();
</script>
</body>
</html>
