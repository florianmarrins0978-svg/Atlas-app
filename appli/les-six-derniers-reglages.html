<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les six derniers écrans des Réglages — Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  ═══════════════════════════════════════════════════════════════════════════
  LOT 6 — LES SIX DERNIERS ÉCRANS DES RÉGLAGES, 9 septembre 2026
  ═══════════════════════════════════════════════════════════════════════════

  SA CONSIGNE, ET ELLE COMMANDE TOUT : « la plupart des patrons qui vont
  utiliser l'app sont des vieux qui ont du mal à se servir de leur téléphone ;
  il faut que ce soit hyper intuitif et simple » (5 septembre 2026).

  Les six écrans ont été PHOTOGRAPHIÉS avant d'écrire une ligne
  (`scripts/tmp-capture-lot6.mts`), et tout ce qui est montré en « Aujourd'hui »
  est recopié de l'image, jamais de mémoire. C'est la faute qu'il a relevée le
  matin même sur la page de sa cliente.

  | l'écran | mots | ce qui cloche |
  |---|---|---|
  | Atlas IA | 142 | écrit pour un DÉVELOPPEUR — noms de variables compris |
  | Couleurs | 167 | une phrase littéraire par charte, et deux paragraphes |
  | Abonnement | 141 | pour dire « rien à faire ici » |
  | Mes données | 67 | une phrase de juriste, qui annonce une absence |
  | Mot de passe | 44 | deux titres collés, et quatre étiquettes en capitales |
  | Mon compte | 30 | « Mr. », qui n'existe pas en français |

  Les couleurs viennent de `src/lib/design-tokens.ts`, au caractère près.
*/
:root{
  --fond:#f5f3ee; --carte:#faf9f5; --encre:#1c1c1a; --encre-douce:#4a4a44;
  --gris:#8a8578; --pin:#2f3b2f; --papier:#ece9e1; --plein:#7d9a6d;
  --or:#B98B47; --trait:rgba(28,28,26,.12); --filet:rgba(28,28,26,.08);
  --alerte:#9C3B2E; --scene:#e6e3dc;
  --serif:"Playfair Display",ui-serif,Georgia,serif;
  --sans:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
}
body.nuit{
  --fond:#101210; --carte:#1a1d19; --encre:#e9e8de; --encre-douce:#c1c2b6;
  --gris:#84887b; --pin:#8fae86; --papier:#20241f; --plein:#8fae86;
  --or:#c6a15b; --trait:rgba(233,232,222,.12); --filet:rgba(233,232,222,.08);
  --alerte:#c07a56; --scene:#070908;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--scene)}
body{font:16px/1.5 var(--sans);color:var(--encre);-webkit-text-size-adjust:100%;padding:0 0 64px}

.bandeau{background:var(--encre);color:var(--fond);padding:18px 20px;font-size:14px;line-height:1.6}
body.nuit .bandeau{background:#000}
.bandeau b{color:#fff}
body.nuit .bandeau b{color:var(--encre)}

.etats{position:sticky;top:0;z-index:20;background:var(--scene);
       border-bottom:1px solid var(--trait);padding:12px 16px 13px}
.etats .quoi{max-width:860px;margin:0 auto 9px;font:600 10px/1 var(--sans);
             letter-spacing:.2em;text-transform:uppercase;color:var(--gris)}
.etats .rangee{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:7px}
.etats button{border:1px solid var(--trait);background:var(--carte);color:var(--encre-douce);
              border-radius:999px;padding:10px 14px;font:400 13px/1 var(--sans);cursor:pointer;
              min-height:44px;-webkit-tap-highlight-color:transparent}
.etats button[aria-pressed="true"]{background:var(--pin);border-color:var(--pin);color:#faf9f5}
body.nuit .etats button[aria-pressed="true"]{color:#101210}

.tete{max-width:860px;margin:0 auto;padding:26px 20px 0}
.tete h1{margin:0 0 6px;font:500 26px/1.15 var(--serif)}
.tete .idee{margin:0;font-size:14px;line-height:1.6;color:var(--encre-douce)}
.tete .idee b{color:var(--encre)}

.paire{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;
       max-width:900px;margin:24px auto 0;padding:0 20px}
.colonne{width:390px;max-width:100%}
.colonne .nom{margin:0 0 4px;font:500 17px/1.2 var(--serif)}
.colonne .compte{margin:0 0 10px;font-size:12.5px;color:var(--gris)}
.colonne .compte b{color:var(--encre)}
.tel{position:relative;width:390px;max-width:100%;height:600px;border-radius:26px;overflow:hidden;
     box-shadow:0 16px 44px rgba(20,18,14,.22);background:var(--fond)}
.defile{height:100%;overflow-y:auto;padding:24px 24px 40px}

/* ── La grammaire des écrans d'Atlas ──────────────────────────────────── */
h2.titre{margin:14px 0 0;font:400 32px/1.04 var(--serif);letter-spacing:-.018em}
.sur{margin:10px 0 0;font:500 11px/1 var(--sans);letter-spacing:.28em;
     text-transform:uppercase;color:var(--or)}
.inter{margin:26px 0 10px;font:500 11px/1 var(--sans);letter-spacing:.28em;
       text-transform:uppercase;color:var(--encre-douce)}
.chapeau{margin:22px 0 0;font-size:13.5px;line-height:1.6;color:var(--encre-douce)}
.chapeau b{color:var(--encre);font-weight:500}
.note{margin:14px 0 0;font-size:12.5px;line-height:1.6;color:var(--gris)}
.note b{color:var(--encre);font-weight:500}

.rang{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      padding:13px 0;border-bottom:1px solid var(--filet)}
.rang:last-child{border-bottom:0}
.rang .g{min-width:0;flex:1}
.rang .n{display:block;font:400 17px/1.25 var(--serif)}
.rang .d{display:block;margin-top:3px;font-size:13px;line-height:1.5;color:var(--encre-douce)}
.rang .etat{flex:none;font:500 11px/1 var(--sans);letter-spacing:.16em;
            text-transform:uppercase;color:var(--or);padding-top:5px}
.rang .etat.oui{color:var(--plein)}
.rang .etat.non{color:var(--gris)}

.carteia{margin-top:14px;padding:14px 15px;background:var(--carte);
         box-shadow:inset 3px 0 0 var(--encre)}
.carteia .quoi{font-size:12.5px;color:var(--gris)}
.carteia .verdict{margin:4px 0 0;font:600 15px/1.35 var(--sans)}
.carteia .expl{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--encre-douce)}

.champ{padding:12px 0 0;border-bottom:1px solid var(--trait)}
.champ .lib{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--encre-douce)}
.champ .lib.doux{font:400 13px/1 var(--sans);letter-spacing:0;text-transform:none;color:var(--gris)}
.champ .val{display:block;padding:8px 0 10px;font:400 17px/1.3 var(--serif);color:var(--encre)}
.champ .val.vide{color:var(--gris);font-family:var(--sans);font-size:15px}
.oeil{float:right;color:var(--gris)}

.bouton{display:block;width:100%;margin-top:16px;border:0;border-radius:999px;
        background:none;box-shadow:inset 0 0 0 1px var(--trait);color:var(--gris);
        padding:14px;font:400 16px var(--sans);cursor:default}
.bouton.vert{background:var(--plein);color:var(--carte);box-shadow:none}
.duo{display:flex;gap:12px;margin-top:8px}
.duo span{flex:1;border-radius:999px;box-shadow:inset 0 0 0 1px var(--trait);
          padding:13px;text-align:center;font:400 17px var(--serif)}

.charte{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--filet)}
.charte .vignette{flex:none;width:44px;height:36px;border-radius:5px;border:1px solid var(--trait);
                  display:flex;flex-direction:column;justify-content:center;gap:3px;padding:6px}
.charte .vignette i{display:block;height:4px;border-radius:2px;background:var(--encre);opacity:.75}
.charte .vignette i:first-child{width:60%}
.charte .g{min-width:0;flex:1}
.charte .n{font:400 17px/1.2 var(--serif)}
.charte .sombre{margin-left:8px;font:500 10px/1 var(--sans);letter-spacing:.16em;
                text-transform:uppercase;color:var(--or)}
.charte .d{display:block;margin-top:3px;font-size:13px;line-height:1.5;color:var(--encre-douce)}
.charte .rond{flex:none;margin-top:6px;width:18px;height:18px;border-radius:50%;
              box-shadow:inset 0 0 0 1.5px var(--trait)}
.charte .rond.pris{box-shadow:inset 0 0 0 5px var(--or)}

/* Ce qui PART se montre barré : on ne juge pas un retrait qu'on ne voit pas. */
.parti{position:relative;opacity:.45}
.parti::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:1px;background:var(--alerte)}
.neuf{box-shadow:inset 3px 0 0 var(--or);padding-left:11px;margin-left:-14px}

.nav{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--fond);
     border-top:1px solid var(--trait);display:flex;align-items:center;
     justify-content:space-around;font:400 9px var(--sans);letter-spacing:.18em;
     text-transform:uppercase;color:var(--gris)}

.notes{max-width:860px;margin:34px auto 0;padding:0 20px}
.notes .bloc{padding:16px 20px;background:var(--carte);border-left:3px solid var(--or);
             font-size:14px;line-height:1.7;color:var(--encre-douce)}
.notes .bloc + .bloc{margin-top:12px}
.notes b{color:var(--encre)}
.notes ul{margin:8px 0 0;padding-left:18px}
.notes li{margin:0 0 6px}
</style>
</head>
<body>

<div class="bandeau">
  <b>Les six derniers écrans des Réglages.</b> À gauche ce qu'ils affichent aujourd'hui,
  à droite ce que je propose. <b>Rien n'est codé.</b> Dites-moi lesquels je fais —
  « tous » me va très bien.
</div>

<div class="etats">
  <p class="quoi">L'écran</p>
  <div class="rangee">
    <button type="button" data-v="ia" aria-pressed="true">Atlas IA</button>
    <button type="button" data-v="couleurs" aria-pressed="false">Couleurs</button>
    <button type="button" data-v="abonnement" aria-pressed="false">Abonnement</button>
    <button type="button" data-v="donnees" aria-pressed="false">Mes données</button>
    <button type="button" data-v="motdepasse" aria-pressed="false">Mot de passe</button>
    <button type="button" data-v="compte" aria-pressed="false">Mon compte</button>
    <button type="button" id="pole" aria-pressed="false">Voir sur Nuit</button>
  </div>
</div>

<div class="tete">
  <h1 id="nom"></h1>
  <p class="idee" id="idee"></p>
</div>

<div class="paire">
  <div class="colonne">
    <p class="nom">Aujourd'hui</p>
    <p class="compte" id="compteA"></p>
    <div class="tel"><div class="defile" id="avant"></div>
      <div class="nav"><span>Chantiers</span><span>Planning</span><span>Terminés</span><span>Réglages</span></div></div>
  </div>
  <div class="colonne">
    <p class="nom">Ce que je propose</p>
    <p class="compte" id="compteB"></p>
    <div class="tel"><div class="defile" id="apres"></div>
      <div class="nav"><span>Chantiers</span><span>Planning</span><span>Terminés</span><span>Réglages</span></div></div>
  </div>
</div>

<div class="notes" id="notes"></div>

<script>
/*
  UN SEUL JEU DE DONNÉES, DOUZE RENDUS. Chaque écran décrit son AVANT et son
  APRÈS dans la même structure : deux dessins écrits à la main divergeraient au
  premier libellé changé, et la comparaison serait fausse.

  Le compte de mots se MESURE sur le rendu, il ne se recopie pas — un chiffre
  écrit en dur dit vrai la veille (`CLAUDE.md` §4 bis).
*/
/**
 * L’adresse à laquelle on lui écrit — sa demande du 9 septembre 2026 :
 * *« prépare-le, on changera l’adresse le jour où j’aurai créé une pour
 * l’appli »*. Elle vit à UN seul endroit, ici : recopiée à deux, elle
 * divergerait le jour du changement, et l’une des deux enverrait dans le vide.
 */
var ADRESSE_CONTACT = "edennature.contact@gmail.com";

var etat = { vue: "ia", nuit: false };
var avant = document.getElementById("avant");
var apres = document.getElementById("apres");

function ech(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function entete(titre, sur){ return '<h2 class="titre">' + ech(titre) + '</h2><p class="sur">' + ech(sur) + '</p>'; }

/* ─── ATLAS IA ─────────────────────────────────────────────────────────── */
function iaAvant(){
  var cartes = [
    ["Transcription", "Mode déterministe — aucun prestataire branché",
     "Rien ne part chez personne. Les textes rendus sont fabriqués et portent la mention « Transcription simulée », pour qu'on ne les prenne jamais pour vos mots."],
    ["Rédaction", "Mode déterministe — aucun prestataire branché",
     "Rien ne part chez personne. Les informations du chantier sont déduites par de simples règles d'écriture, sans aucun modèle de langage derrière."],
    ["Lecture d'image", "Aucun fournisseur de lecture d'image n'est configuré.",
     "Aucun croquis ne sera lu : l'écran d'arrosage le dit avant de faire photographier."]
  ];
  return entete("Atlas IA", "Réglages") +
    '<p class="inter">Ce que l\'application utilise</p>' +
    cartes.map(function(c){
      return '<div class="carteia"><p class="quoi">' + ech(c[0]) + '</p>' +
        '<p class="verdict">' + ech(c[1]) + '</p>' +
        '<p class="expl">' + ech(c[2]) + '</p></div>';
    }).join("") +
    '<p class="note parti">Poser une clé suffit à brancher le fournisseur correspondant. ' +
    'Les variables TRANSCRIPTION_PROVIDER, LLM_PROVIDER et VISION_PROVIDER ne servent ' +
    'qu\'à forcer un autre choix — par exemple « dev » pour couper l\'IA sans retirer ' +
    'les clés. Sans VISION_PROVIDER, les images vont chez celui qui rédige.</p>';
}
function iaApres(){
  var lignes = [
    ["Écouter vos dictées", "Vous parlez, Atlas écrit", "non"],
    ["Écrire vos devis", "À partir de ce que vous avez dicté", "non"],
    ["Lire vos croquis", "Pour le plan d'arrosage", "non"]
  ];
  return entete("Atlas IA", "Réglages") +
    '<p class="inter">Ce qu\'Atlas sait faire</p>' +
    lignes.map(function(l){
      return '<div class="rang"><span class="g"><span class="n">' + ech(l[0]) + '</span>' +
        '<span class="d">' + ech(l[1]) + '</span></span>' +
        '<span class="etat ' + l[2] + '">' + (l[2] === "oui" ? "Oui" : "Pas encore") + '</span></div>';
    }).join("") +
    '<p class="note neuf">Rien à faire de votre côté : c\'est nous qui le branchons.</p>';
}

/* ─── COULEURS ─────────────────────────────────────────────────────────── */
var CHARTES = [
  ["Origine", "", "Vos couleurs actuelles : gris-vert, or, et le vert pin pour l'action.", "Le gris-vert et l'or.", true],
  ["Brume moderne", "", "Un blanc froid à reflets bleutés, un bleu marine pour l'action, et les titres dans la police du téléphone.", "Blanc froid, bleu marine.", false],
  ["Pierre", "", "Gris légèrement vert, encre presque noire, sauge désaturée.", "Gris pierre, encre noire.", false],
  ["Beurre", "", "Le jaune beurre, très pâle, donne une chaleur qu'aucun crème n'atteint.", "Jaune beurre, très pâle.", false],
  ["Moka", "", "Un moka laiteux, une encre espresso.", "Moka laiteux, encre café.", false],
  ["Soirée", "", "La plus habillée — celle qui ressemble le moins à un outil.", "La plus habillée.", false],
  ["Sylve", "Sombre", "Le vert profond passe du bouton au FOND. Un écran de paysagiste.", "Vert profond au fond.", false],
  ["Nuit", "Sombre", "Noir chaud, laiton doux. La plus spectaculaire — et la moins lisible au soleil.", "Noir chaud, laiton.", false]
];
function charteRang(c, court){
  return '<div class="charte"><span class="vignette"><i></i><i></i></span>' +
    '<span class="g"><span class="n">' + ech(c[0]) + '</span>' +
    (c[1] ? '<span class="sombre">' + ech(c[1]) + '</span>' : "") +
    '<span class="d">' + ech(court ? c[3] : c[2]) + '</span></span>' +
    '<span class="rond' + (c[4] ? " pris" : "") + '"></span></div>';
}
function couleursAvant(){
  return entete("Couleurs", "Moi") +
    '<p class="chapeau">La couleur change <b>toute l\'application</b>, tout de suite. ' +
    'Elle n\'appartient qu\'à vous : vos devis et vos factures gardent leur apparence.</p>' +
    '<p class="inter">Votre charte</p>' +
    CHARTES.map(function(c){ return charteRang(c, false); }).join("") +
    '<p class="note parti">Deux d\'entre elles sont sombres — <b>Nuit</b> et <b>Sylve</b>. ' +
    'Elles se lisent mal en plein soleil : sur un chantier, à midi, l\'écran clair reste le plus sûr.</p>';
}
function couleursApres(){
  return entete("Couleurs", "Moi") +
    '<p class="chapeau neuf">Change toute l\'application. Vos devis et vos factures ne bougent pas.</p>' +
    CHARTES.map(function(c){ return charteRang(c, true); }).join("");
}

/* ─── ABONNEMENT ───────────────────────────────────────────────────────── */
function abonnementAvant(){
  var rangs = [
    ["Formule", "Ce qu'elle comprend, et jusqu'où"],
    ["Moyen de paiement", "La carte qui sera débitée"],
    ["Vos factures Atlas", "Celles que vous recevez, pas celles que vous émettez"]
  ];
  return entete("Abonnement", "Mon entreprise") +
    '<p class="chapeau"><b>Atlas ne vous facture rien aujourd\'hui.</b> Ni le prix ni le contenu ' +
    'de l\'offre ne sont arrêtés — et tant qu\'ils ne le sont pas, cet écran n\'affichera aucun ' +
    'montant : un chiffre inventé sur une page qui parle d\'argent finirait par être cru.</p>' +
    '<div class="parti"><p class="inter">Ce qu\'il y aura ici</p>' +
    rangs.map(function(r){
      return '<div class="rang"><span class="g"><span class="n">' + ech(r[0]) + '</span>' +
        '<span class="d">' + ech(r[1]) + '</span></span><span class="etat">Bientôt</span></div>';
    }).join("") + '</div>' +
    '<p class="note parti"><b>Attention au mot.</b> Ici, « factures » désigne celles qu\'Atlas ' +
    'vous enverrait. Celles de vos clients sont dans « Terminés », et elles ne bougeront jamais d\'ici.</p>' +
    '<p class="note parti">Ce qui bloque n\'est pas du code : il faut choisir une offre et un ' +
    'prestataire de paiement. Ces points sont dans votre document « à faire ».</p>';
}
function abonnementApres(){
  return entete("Abonnement", "Mon entreprise") +
    '<p class="chapeau neuf"><b>Atlas ne vous facture rien.</b> Le jour où ça change, ' +
    'vous serez prévenu ici, et avant.</p>';
}

/* ─── MES DONNÉES ──────────────────────────────────────────────────────── */
function donneesAvant(){
  return entete("Mes données", "Réglages") +
    '<p class="inter">En garder une copie</p>' +
    '<button type="button" class="bouton vert">Télécharger mes données</button>' +
    '<p class="chapeau">Tout ce qu\'Atlas garde pour vous, dans un fichier qui s\'ouvre sans lui.</p>' +
    '<p class="note">Il porte les coordonnées de vos clients : rangez-le comme un dossier client.</p>' +
    '<p class="note parti">L\'effacement de votre compte et le registre des traitements ne se font ' +
    'pas encore depuis l\'application. Les textes qui vous engagent, eux, sont consultables et datés.</p>';
}
function donneesApres(){
  return entete("Mes données", "Réglages") +
    '<p class="inter">En garder une copie</p>' +
    '<button type="button" class="bouton vert">Télécharger mes données</button>' +
    '<p class="chapeau">Tout ce qu\'Atlas garde pour vous, dans un fichier qui s\'ouvre sans lui.</p>' +
    '<p class="note">Il porte les coordonnées de vos clients : rangez-le comme un dossier client.</p>' +
    '<p class="note neuf">Pour effacer votre compte, écrivez à ' +
    '<b>' + ech(ADRESSE_CONTACT) + '</b>.</p>';
}

/* ─── MOT DE PASSE ─────────────────────────────────────────────────────── */
function motdepasseAvant(){
  return entete("Mot de passe", "Moi") +
    '<p class="inter" style="margin-top:12px">Changer de mot de passe</p>' +
    ['Mot de passe actuel','Nouveau mot de passe','Confirmer le nouveau mot de passe'].map(function(l){
      return '<div class="champ"><span class="lib">' + ech(l) + '</span>' +
        '<svg class="oeil" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 12S6 5.8 12 5.8 21.6 12 21.6 12 18 18.2 12 18.2 2.4 12 2.4 12Z"/><circle cx="12" cy="12" r="3.1"/></svg><span class="val">&nbsp;</span></div>';
    }).join("") +
    '<button type="button" class="bouton">Changer mon mot de passe</button>' +
    '<p class="inter">Ouvrir avec Face ID</p>' +
    '<button type="button" class="bouton" style="color:var(--encre)">Enregistrer cet appareil</button>' +
    '<p class="inter">Ailleurs</p>' +
    '<div class="rang"><span class="g"><span class="n">Me déconnecter partout</span></span></div>';
}
function motdepasseApres(){
  // **Il a tranché le 9 septembre : « je préfère celui qu’on a aujourd’hui ».**
  // Ma proposition retirait le titre du bloc et passait les étiquettes en
  // minuscules ; il la refuse, et sa version reste à gauche pour qu’on voie ce
  // qui est écarté. Le seul changement retenu est le SIEN : un point
  // d’interrogation, qui fait du titre une question plutôt qu’une étiquette —
  // exactement comme sur l’écran Équipe, qu’il a retenu le 8 septembre.
  return motdepasseAvant().replace(
    "<p class=\"inter\" style=\"margin-top:12px\">Changer de mot de passe</p>",
    "<p class=\"inter neuf\" style=\"margin-top:12px\">Changer de mot de passe&nbsp;?</p>"
  );
}

/* ─── MON COMPTE ───────────────────────────────────────────────────────── */
function compteEcran(civilites, neuf){
  return entete("Mon compte", "Moi") +
    '<div class="rang" style="border-bottom:0"><span class="g"><span class="n">Compte de démonstration</span></span></div>' +
    '<p class="inter">Qui vous êtes</p>' +
    '<div class="champ"><span class="lib">Civilité</span>' +
    '<div class="duo' + (neuf ? " neuf" : "") + '"><span>' + ech(civilites[0]) + '</span><span>' + ech(civilites[1]) + '</span></div></div>' +
    '<div class="champ"><span class="lib">Prénom</span><span class="val vide">' +
      (neuf ? "Votre prénom" : "&nbsp;") + '</span></div>' +
    '<div class="champ"><span class="lib">Nom</span><span class="val">Compte de démonstration</span></div>' +
    '<div class="champ"><span class="lib">E-mail</span><span class="val">demo@atlas.local</span></div>' +
    '<p class="note">Sert aussi à vous connecter. Pas encore modifiable.</p>';
}

function mots(el){ return (el.innerText || el.textContent || "").split(/\s+/).filter(Boolean).length; }

function rendre(){
  var e = ECRANS[etat.vue];
  document.getElementById("nom").textContent = e.nom;
  document.getElementById("idee").innerHTML = e.idee;
  avant.innerHTML = e.avant();
  apres.innerHTML = e.apres();
  document.getElementById("compteA").innerHTML = "<b>" + mots(avant) + " mots</b>";
  document.getElementById("compteB").innerHTML = "<b>" + mots(apres) + " mots</b>";
  document.getElementById("notes").innerHTML =
    e.notes.map(function(n){ return '<div class="bloc">' + n + "</div>"; }).join("");
}

document.querySelectorAll(".etats button[data-v]").forEach(function(b){
  b.addEventListener("click", function(){
    etat.vue = b.dataset.v;
    document.querySelectorAll(".etats button[data-v]").forEach(function(o){
      o.setAttribute("aria-pressed", String(o === b));
    });
    rendre();
  });
});

var pole = document.getElementById("pole");
pole.addEventListener("click", function(){
  etat.nuit = !etat.nuit;
  document.body.classList.toggle("nuit", etat.nuit);
  pole.setAttribute("aria-pressed", String(etat.nuit));
  pole.textContent = etat.nuit ? "Revenir sur Terre" : "Voir sur Nuit";
});

rendre();
</script>
