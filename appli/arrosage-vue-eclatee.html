<!--
  MAQUETTE, RIEN N'EST CODÉ (CLAUDE.md §3 bis). Sa demande du 17 octobre 2026 :
  « que tu nous fasses un petit schéma avec vraiment juste la photo des pièces
  en isolé […] une vue éclatée, sur un fond blanc, les pièces pas collées les
  unes aux autres, un tout petit peu décalées […] même si le gars il est pas
  bon en arrosage, avec la photo des pièces, il peut dire : ça, ça va là ».
  Et : « dès qu'on enlève une pièce, qu'on en rajoute une, ça se modifie ».

  TOUS LES CHIFFRES SORTENT DU CALCUL, À CHAQUE GESTE : calculerPlan et le
  catalogue de src/lib/arrosage/, empaquetés tels quels le 17 octobre 2026
  dans arrosage-schema-calcul.js (esbuild, aucune ligne réécrite ; il porte
  déjà les sorties du goutte-à-goutte, `sortiesGoutte`). Jardin d'exemple :
  le sien du 23 août (12 × 12 et 8 × 8) et un massif de 20 × 2,40 (80 m de
  tube : deux couronnes de 50 m, une jonction).

  CE QUE LA PLANCHE DÉDUIT, ET QUE L'APPLICATION DEVRA RECEVOIR DU CALCUL :
  la place de chaque té et de chaque coude, tête par tête, lue sur les rangées
  du dessin (`dessin[].points`). Le calcul ne rend que des totaux ; la planche
  les recompte et COMPARE, en bas de page. Codé pour de vrai, c'est le calcul
  qui rendra les positions (§3 : une seule règle).

  CE QUI N'EST PAS CONNU, ET QUI NE S'INVENTE PAS :
  1. l'ordre de montage de la nourrice : sa fiche du 17 août donne les pièces
    et leurs nombres, pas l'ordre. Elles s'écartent ici dans l'ordre de la
    fiche, et la planche le dit ;
  2. les photos : celles qu'il a validées le 17 octobre 2026, plus ses cinq Palaplast
    (appli/arrosage-photos/). Les autres pièces portent un cadre vide et leur
    nom, jusqu'à ce qu'il envoie les siennes.

  LES COULEURS SONT LES JETONS DES CHARTES ; seules celles des réseaux
  viennent du calcul (`couleurs`), comme sur le plan de l'application.
-->

<script>
(function () {
  var C = window.CALCUL, CAT = C.CATALOGUE;
  // Les photos qu'il a validées sur la planche « Photos des pièces » (17 octobre
  // 2026), copiées dans arrosage-photos/ ; une pièce sans photo validée n'en a pas.
  var PHOTOS = {"clarinette-2v":"clarinette-2v.jpg","clarinette-3v":"clarinette-3v.jpg","clarinette-4v":"clarinette-4v.jpg","coude-mf":"coude-mf.jpg","coude-taraude-25-34":"coude-taraude-25-34.jpg","electrovanne-100dv":"electrovanne-100dv.jpg","electrovanne-100dv-ff":"electrovanne-100dv-ff.png","mamelon":"mamelon.png","mamelon-droit-1":"mamelon-droit-1.jpg","OD501":"OD501.jpg","OD502":"OD502.jpg","pile-9v":"pile-9v.jpg","prog-1":"prog-1.jpg","prog-4":"prog-4.jpg","RA2181":"RA2181.jpg","RA3504":"RA3504.jpg","RA5006PC":"RA5006PC.jpg","raccord-male25":"raccord-male25.jpg","regard-rect12":"regard-rect12.jpg","regard-rg17106":"regard-rg17106.jpg","RP403":"RP403.jpg","RT1802":"RT1802.jpg","RT1804":"RT1804.jpg","RT1806":"RT1806.jpg","te-25-25-25":"te-25-25-25.jpg","te-mmf":"te-mmf.jpg","te-taraude-25-34-25":"te-taraude-25-34-25.jpg","UGGCBL23050":"UGGCBL23050.jpg","union":"union.jpg","VAN":"VAN.jpg","vanne-purge":"vanne-purge.jpg","MID6301":"MID6301.png","MID6321":"MID6321.png","MID6341":"MID6341.png","MID6352":"MID6352.png","MID6371":"MID6371.png","te-25-25-25-compteur":"te-25-25-25.jpg","pe25-amenee":"pehd.jpg","pe25-reseau":"pehd.jpg","pebd16":"pebd16.png"};
  var CHARTES = [["origine","Origine"],["brume","Brume"],["pierre","Pierre"],["beurre","Beurre"],["moka","Moka"],["prune","Prune"],["sylve","Sylve"],["nuit","Nuit"]];
  var CATEGORIES = [
    ["raccord PE","Raccords PE"],["electrovanne","Électrovannes"],["regard","Regards"],
    ["programmateur","Programmateurs"],["raccord goutte-à-goutte","Goutte-à-goutte"],
    ["tube PE","Tubes PE"],["robinetterie","Robinetterie"],["électricité","Électricité"]
  ];
  var etat = { sortie: "boucle", retirees: {}, ajoutees: [], ou: "regard", categorie: "raccord PE" };
  var $ = function (id) { return document.getElementById(id); };
  var texte = function (s) { var e = document.createElement("span"); e.textContent = s == null ? "" : String(s); return e.innerHTML; };

  CHARTES.forEach(function (c) { var o = document.createElement("option"); o.value = c[0]; o.textContent = c[1]; $("charte").appendChild(o); });
  $("charte").onchange = function () { document.body.dataset.charte = this.value; };

  function plan() {
    return C.calculerPlan({ seau: 10, temps: 18, pression: 3, compteur: "oui", zones: [
      { id: 1, type: "gazon", nom: "Pelouse arrière", x: 0, y: 0, L: 12, l: 12 },
      { id: 2, type: "gazon", nom: "Pelouse avant", x: 14, y: 0, L: 8, l: 8 },
      { id: 3, type: "massif", nom: "Massif", x: 14, y: 10, L: 20, l: 2.4, sortieGoutte: etat.sortie }
    ] });
  }

  // Le nom d'une référence, tel que la liste du calcul l'écrit.
  function nomDe(ref, materiel) {
    var l = materiel.filter(function (m) { return m.ref === ref; })[0];
    if (l) return l.nom;
    var p = CAT.piece(ref) || CAT.piecesReseau[ref] || CAT.pieceAjoutable(ref);
    return p ? (p.marque ? p.marque + " " : "") + p.nom : ref;
  }

  // Une pièce posée sur le plateau. `cle` est unique : c'est elle qui se retire.
  function piece(cle, ref, nom, detail) {
    var retiree = etat.retirees[cle];
    var photo = PHOTOS[ref]
      ? '<span class="photo"><img src="arrosage-photos/' + PHOTOS[ref] + '" alt=""></span>'
      : '<span class="photo vide">photo à venir</span>';
    return '<button type="button" class="piece' + (retiree ? " retiree" : "") + (cle.indexOf("plus:") === 0 ? " ajoutee" : "") +
      '" data-cle="' + texte(cle) + '" data-ref="' + texte(ref) + '" aria-pressed="' + Boolean(retiree) + '">' + photo +
      '<span class="nom">' + texte(detail || nom) + "</span></button>";
  }

  var compte = {};
  function poser(cle, ref, nom, detail, q, u) {
    // Une pièce de l'amenée ne se compare pas au calcul du réseau : piecesDuPlan l'ajoute à part.
    if (!etat.retirees[cle]) { compte[ref] = compte[ref] || { nom: nom, q: 0, u: u || "u" }; compte[ref].q += q === undefined ? 1 : q; }
    return piece(cle, ref, nom, detail);
  }
  function ajoutees(ou) {
    return etat.ajoutees.filter(function (a) { return a.ou === ou; }).map(function (a) {
      return poser("plus:" + a.n, a.ref, a.nom, "ajoutée", 1);
    }).join("");
  }

  // Les couronnes du tube, et entre deux une jonction MID6301 : les deux nombres
  // sont ceux du calcul (couronnesDuTube), la planche ne fait que les poser.
  function couronnes(i, M) {
    var n = (M.filter(function (m) { return m.ref === "UGGCBL23050"; })[0] || { q: 0 }).q;
    var j = (M.filter(function (m) { return m.ref === "MID6301"; })[0] || { q: 0 }).q;
    var html = "";
    for (var c = 0; c < n; c++) {
      if (c > 0 && c <= j) html += poser("r" + i + ":jonction" + c, "MID6301", nomDe("MID6301", M), "jonction Palaplast Ø16");
      html += poser("r" + i + ":couronne" + c, "UGGCBL23050", nomDe("UGGCBL23050", M), "tube Toro, couronne de 50 m");
    }
    return html;
  }

  function dessiner() {
    var p = plan(), M = p.materiel;
    compte = {};

    // ── Du compteur à la nourrice : le té qui coupe la ligne, puis le Ø25.
    $("amenee").innerHTML =
      poser("am:te", "te-25-25-25-compteur", nomDe("te-25-25-25", M) + ", au compteur", "Té égal au compteur") +
      poser("am:pe", "pe25-amenee", "PEHD Ø25, du compteur à la nourrice", "PEHD Ø25, à mesurer", 0, "ml") +
      ajoutees("amenee");

    // ── Dans le regard : chaque pièce de la fiche, une par une.
    var fiche = CAT.ficheNourrice(p.secteurs.length, p.secteurs.filter(function (s) { return s.famille === "Goutte-à-goutte"; }).length);
    $("titre-nourrice").textContent = fiche ? fiche.nom : "Aucune fiche pour " + p.secteurs.length + " voies";
    var html = "", rang = 0;
    (fiche ? fiche.pieces : []).forEach(function (x) {
      for (var i = 0; i < x.q; i++) {
        rang++;
        var nom = nomDe(x.ref, M);
        html += poser("rg:" + x.ref + ":" + i, x.ref, nom, x.q > 1 ? nom + ", " + (i + 1) + " sur " + x.q : nom).replace('<span class="photo', '<span class="rang">' + rang + '</span><span class="photo');
      }
    });
    $("regard").innerHTML = html + ajoutees("regard");

    // ── Au jardin : un rail par réseau, une rangée de pièces par tête.
    var parReseau = p.secteurs.map(function () { return []; });
    p.dessin.forEach(function (z) {
      if (z.cle === "gaine") return;
      var corps = CAT.corpsDeLaBuse(CAT.buses.filter(function (b) { return b.nom === z.buse; })[0]);
      var rangees = {};
      z.points.forEach(function (t) { var k = t.reseau + ":" + t.y; (rangees[k] = rangees[k] || []).push(t); });
      Object.keys(rangees).forEach(function (k, ir) {
        var r = rangees[k];
        r.forEach(function (t, i) {
          parReseau[t.reseau].push({ zone: z, corps: corps, fin: i === r.length - 1, jonction: i === 0 && ir > 0 });
        });
      });
    });
    var sbeBas = CAT.coudes.filter(function (c) { return c.filetage === "3/4"; })[0];
    var jardin = "";
    p.secteurs.forEach(function (s, i) {
      var c = p.couleurs[i];
      jardin += '<div class="reseau-titre" style="--couleur:' + c + '"><span class="pastille"></span><b>Réseau ' + (i + 1) + "</b><span>" + texte(s.nom) + "</span></div>";
      jardin += '<div class="rail" style="--couleur:' + c + '">';
      jardin += '<div class="tete">' + poser("r" + i + ":pe", "pe25-reseau", "PEHD Ø25", "PEHD Ø25, à mesurer", 0, "ml") + "</div>";
      if (s.famille === "Goutte-à-goutte") {
        jardin += '<div class="tete">' + poser("r" + i + ":coude", "coude-taraude-25-34", nomDe("coude-taraude-25-34", M), "Coude taraudé") +
          (etat.sortie === "ligne"
            ? poser("r" + i + ":coude16", "MID6341", nomDe("MID6341", M), "coude Palaplast Ø16")
            : poser("r" + i + ":te16", "MID6321", nomDe("MID6321", M), "té Palaplast Ø16")) +
          couronnes(i, M) +
          (etat.sortie === "boucle" ? "" : poser("r" + i + ":bouchon", "MID6371", nomDe("MID6371", M), "bouchon Palaplast Ø16")) +
          "</div>";
      }
      parReseau[i].forEach(function (t, j) {
        var k = "r" + i + ":t" + j;
        var raccord = t.fin ? "coude-taraude-25-34" : "te-taraude-25-34-25";
        var sbeHaut = CAT.coudes.filter(function (c) { return c.filetage === t.corps.filetage; })[0];
        if (t.jonction) jardin += '<div class="tete">' + poser(k + ":jonction", "te-25-25-25", nomDe("te-25-25-25", M), "Té égal, rangée suivante") + "</div>";
        jardin += '<div class="tete">' +
          poser(k + ":raccord", raccord, nomDe(raccord, M), t.fin ? "Coude taraudé" : "Té taraudé") +
          poser(k + ":sbeb", sbeBas.ref, sbeBas.nom + ", " + sbeBas.detail, "SBE 3/4\"") +
          poser(k + ":pebd", "pebd16", nomDe("pebd16", M), "PEBD Ø16, 2 m", 2, "ml") +
          poser(k + ":sbeh", sbeHaut.ref, sbeHaut.nom + ", " + sbeHaut.detail, "SBE " + sbeHaut.filetage + "\"") +
          poser(k + ":corps", t.corps.ref, t.corps.nom, t.zone.buse) +
          "</div>";
      });
      jardin += ajoutees("r" + i) + "</div>";
      jardin += '<button class="ajouter" type="button" data-ajouter="r' + i + '">Ajouter une pièce au réseau ' + (i + 1) + "</button>";
    });
    jardin = '<div class="question" role="group" aria-label="Massif">' +
      '<button type="button" data-sortie="ligne" aria-pressed="' + (etat.sortie === "ligne") + '">Massif : une seule ligne</button>' +
      '<button type="button" data-sortie="boucle" aria-pressed="' + (etat.sortie === "boucle") + '">Deux, en boucle</button></div>' + jardin;
    $("jardin").innerHTML = jardin;

    // ── La liste : ce qui est posé sur les plateaux, comparé au calcul.
    var lignes = "", ecarts = 0;
    Object.keys(compte).forEach(function (ref) {
      var e = compte[ref], calcul = M.filter(function (m) { return m.ref === ref; })[0];
      var q = e.u === "ml" ? (e.q ? e.q + " m" : "à mesurer") : e.q + "x";
      var dit = "";
      if (calcul && calcul.q !== e.q && ref !== "pe25-amenee") { dit = "le calcul dit " + calcul.q; ecarts++; }
      lignes += '<div class="ligne"><span class="q">' + q + '</span><span class="n">' + texte(e.nom) + "</span>" + (dit ? '<span class="ecart">' + texte(dit) + "</span>" : "") + "</div>";
    });
    $("liste").innerHTML = lignes;
    var touche = Object.keys(etat.retirees).length + etat.ajoutees.length;
    $("verdict").className = "verdict" + (ecarts && !touche ? " rouge" : "");
    $("verdict").textContent = touche
      ? touche + " changement" + (touche > 1 ? "s" : "") + " à la main. Les écarts avec le calcul sont écrits à droite."
      : ecarts ? "Le schéma ne compte pas comme le calcul : " + ecarts + " pièce" + (ecarts > 1 ? "s" : "") + " à revoir." : "Le schéma et le calcul comptent les mêmes pièces.";
    $("reserves").innerHTML = p.manquants.map(function (r) { return "<li>" + texte(r) + "</li>"; }).join("");
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.cle && b.dataset.ref !== "?") {
      if (b.dataset.cle.indexOf("plus:") === 0) {
        etat.ajoutees = etat.ajoutees.filter(function (a) { return "plus:" + a.n !== b.dataset.cle; });
      } else if (etat.retirees[b.dataset.cle]) delete etat.retirees[b.dataset.cle];
      else etat.retirees[b.dataset.cle] = true;
      dessiner();
    } else if (b.dataset.sortie) { etat.sortie = b.dataset.sortie; dessiner(); }
    else if (b.dataset.ajouter) { etat.ou = b.dataset.ajouter; ouvrir(); }
    else if (b.dataset.categorie) { etat.categorie = b.dataset.categorie; ouvrir(); }
    else if (b.dataset.choisir) {
      var x = CAT.pieceAjoutable(b.dataset.choisir);
      etat.ajoutees.push({ n: Date.now(), ou: etat.ou, ref: x.ref, nom: x.nom });
      $("feuille").hidden = true; dessiner();
    }
  });
  $("fermer").onclick = function () { $("feuille").hidden = true; };

  function ouvrir() {
    $("categories").innerHTML = CATEGORIES.map(function (c) {
      return '<button type="button" data-categorie="' + texte(c[0]) + '" aria-pressed="' + (etat.categorie === c[0]) + '">' + texte(c[1]) + "</button>";
    }).join("");
    $("choix").innerHTML = CAT.piecesAjoutables.filter(function (x) { return x.categorie === etat.categorie; }).slice(0, 40).map(function (x) {
      var v = PHOTOS[x.ref] ? '<span class="vignette pleine"><img src="arrosage-photos/' + PHOTOS[x.ref] + '" alt=""></span>' : '<span class="vignette"></span>';
      return '<button type="button" class="choix" data-choisir="' + texte(x.ref) + '">' + v + "<span>" + texte(x.nom) + "<small>" + texte(x.ref) + "</small></span></button>";
    }).join("");
    $("feuille").hidden = false;
  }

  dessiner();
})();
</script>
</body>
</html>
