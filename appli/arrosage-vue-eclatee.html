<title>Plan d’arrosage : la vue éclatée</title>
<!--
  MAQUETTE, RIEN N'EST CODÉ (CLAUDE.md §3 bis). Sa demande du 17 octobre 2026 :
  « que tu nous fasses un petit schéma avec vraiment juste la photo des pièces
  en isolé […] une vue éclatée, sur un fond blanc, les pièces pas collées les
  unes aux autres, un tout petit peu décalées […] même si le gars il est pas
  bon en arrosage, avec la photo des pièces, il peut dire : ça, ça va là ».
  Et : « dès qu'on enlève une pièce, qu'on en rajoute une, ça se modifie ».

  TOUS LES CHIFFRES SORTENT DU CALCUL, À CHAQUE GESTE : calculerPlan et le
  catalogue de src/lib/arrosage/, empaquetés tels quels le 17 octobre 2026
  dans arrosage-schema-calcul.js (esbuild, aucune ligne réécrite ; il porte
  déjà les sorties du goutte-à-goutte, `sortiesGoutte`). Jardin d'exemple :
  le sien du 23 août (12 × 12 et 8 × 8) et un massif de 20 × 2,40 (80 m de
  tube : deux couronnes de 50 m, une jonction).

  CE QUE LA PLANCHE DÉDUIT, ET QUE L'APPLICATION DEVRA RECEVOIR DU CALCUL :
  la place de chaque té et de chaque coude, tête par tête, lue sur les rangées
  du dessin (`dessin[].points`). Le calcul ne rend que des totaux ; la planche
  les recompte et COMPARE, en bas de page. Codé pour de vrai, c'est le calcul
  qui rendra les positions (§3 : une seule règle).

  CE QUI N'EST PAS CONNU, ET QUI NE S'INVENTE PAS :
  1. l'ordre de montage de la nourrice : sa fiche du 17 août donne les pièces
    et leurs nombres, pas l'ordre. Elles s'écartent ici dans l'ordre de la
    fiche, et la planche le dit ;
  2. les photos : celles qu'il a validées le 17 octobre 2026, plus ses cinq Palaplast
    (appli/arrosage-photos/). Les autres pièces portent un cadre vide et leur
    nom, jusqu'à ce qu'il envoie les siennes.

  LES COULEURS SONT LES JETONS DES CHARTES ; seules celles des réseaux
  viennent du calcul (`couleurs`), comme sur le plan de l'application.
-->

<div class="entete">
  <h1>La vue éclatée</h1>

    <div class="plateau"><div class="eclate" id="regard"></div></div>
    <button class="ajouter" type="button" data-ajouter="regard">Ajouter une pièce</button>

    <div id="jardin"></div>
  </section>

  <section class="bloc">
    <span class="caps">La liste</span>

    <ul class="reserves" id="reserves"></ul>
  </section>
</main>

</div>

<script>
(function () {
  var C = window.CALCUL, CAT = C.CATALOGUE;

    var corpsTuyere = CAT.corps.filter(function (c) { return c.pourType === "tuyere" && M.some(function (m) { return m.ref === c.ref; }); })[0];
    p.dessin.forEach(function (z) {
      if (z.cle === "gaine") return;
      var buse = CAT.buses.filter(function (b) { return b.nom === z.buse; })[0];
      var corps = z.cle === "tuyere" ? corpsTuyere : CAT.corpsDeLaBuse(buse);
      if (!corps) return;
      var rangees = {};
      z.points.forEach(function (t) { var k = t.reseau + ":" + t.y; (rangees[k] = rangees[k] || []).push(t); });
      Object.keys(rangees).forEach(function (k, ir) {
        var r = rangees[k];
        r.forEach(function (t, i) {
          parReseau[t.reseau].push({ zone: z, corps: corps, buse: z.cle === "tuyere" ? buse : null, fin: i === r.length - 1, jonction: i === 0 && ir > 0 });
        });
      });
    });
    var sbeBas = CAT.coudes.filter(function (c) { return c.filetage === "3/4"; })[0];
    var jardin = "";
    p.secteurs.forEach(function (s, i) {
      var c = p.couleurs[i];
      jardin += '<div class="reseau-titre" style="--couleur:' + c + '"><span class="pastille"></span><b>Réseau ' + (i + 1) + "</b><span>" + texte(s.nom) + "</span></div>";
      jardin += '<div class="rail" style="--couleur:' + c + '">';
      jardin += '<div class="tete">' + poser("r" + i + ":pe", "pe25-reseau", "PEHD Ø25", "PEHD Ø25, à mesurer", 0, "ml") + "</div>";
      if (s.famille === "Goutte-à-goutte") {
        jardin += '<div class="tete">' + poser("r" + i + ":coude", "coude-taraude-25-34", nomDe("coude-taraude-25-34", M), "Coude taraudé") +
          (etat.sortie === "ligne"
            ? poser("r" + i + ":coude16", "MID6341", nomDe("MID6341", M), "coude Palaplast Ø16")
            : poser("r" + i + ":te16", "MID6321", nomDe("MID6321", M), "té Palaplast Ø16")) +
          couronnes(i, M) +
          (etat.sortie === "boucle" ? "" : poser("r" + i + ":bouchon", "MID6371", nomDe("MID6371", M), "bouchon Palaplast Ø16")) +
          "</div>";
      }
      parReseau[i].forEach(function (t, j) {
        var k = "r" + i + ":t" + j;
        var raccord = t.fin ? "coude-taraude-25-34" : "te-taraude-25-34-25";
        var sbeHaut = CAT.coudes.filter(function (c) { return c.filetage === t.corps.filetage; })[0];
        if (t.jonction) jardin += '<div class="tete">' + poser(k + ":jonction", "te-25-25-25", nomDe("te-25-25-25", M), "Té égal, rangée suivante") + "</div>";
        jardin += '<div class="tete">' +
          poser(k + ":raccord", raccord, nomDe(raccord, M), t.fin ? "Coude taraudé" : "Té taraudé") +
          poser(k + ":sbeb", sbeBas.ref, sbeBas.nom + ", " + sbeBas.detail, "SBE 3/4\"") +
          poser(k + ":pebd", "pebd16", nomDe("pebd16", M), "PEBD Ø16, 2 m", 2, "ml") +
          poser(k + ":sbeh", sbeHaut.ref, sbeHaut.nom + ", " + sbeHaut.detail, "SBE " + sbeHaut.filetage + "\"") +
          (t.buse ? tuyere(k + ":corps", t.corps, t.buse) : poser(k + ":corps", t.corps.ref, t.corps.nom, t.zone.buse)) +
          "</div>";
      });
      jardin += ajoutees("r" + i) + "</div>";
      jardin += '<button class="ajouter" type="button" data-ajouter="r' + i + '">Ajouter une pièce au réseau ' + (i + 1) + "</button>";
    });
    jardin = '<div class="question" role="group" aria-label="Massif">' +
      '<button type="button" data-sortie="ligne" aria-pressed="' + (etat.sortie === "ligne") + '">Massif : une seule ligne</button>' +
      '<button type="button" data-sortie="boucle" aria-pressed="' + (etat.sortie === "boucle") + '">Deux, en boucle</button></div>' + jardin;
    $("jardin").innerHTML = jardin;

    // ── La liste : ce qui est posé sur les plateaux, comparé au calcul.
    var lignes = "", ecarts = 0;
    Object.keys(compte).forEach(function (ref) {
      var e = compte[ref], calcul = M.filter(function (m) { return m.ref === ref; })[0];
      var q = e.u === "ml" ? (e.q ? e.q + " m" : "à mesurer") : e.q + "x";
      var dit = "";
      if (calcul && calcul.q !== e.q && ref !== "pe25-amenee") { dit = "le calcul dit " + calcul.q; ecarts++; }
      lignes += '<div class="ligne"><span class="q">' + q + '</span><span class="n">' + texte(e.nom) + "</span>" + (dit ? '<span class="ecart">' + texte(dit) + "</span>" : "") + "</div>";
    });
    $("liste").innerHTML = lignes;
    var touche = Object.keys(etat.retirees).length + Object.keys(etat.remplacees).length + etat.ajoutees.length;
    $("verdict").className = "verdict" + (ecarts && !touche ? " rouge" : "");
    $("verdict").textContent = touche
      ? touche + " changement" + (touche > 1 ? "s" : "") + " à la main. Les écarts avec le calcul sont écrits à droite."
      : ecarts ? "Le schéma ne compte pas comme le calcul : " + ecarts + " pièce" + (ecarts > 1 ? "s" : "") + " à revoir." : "Le schéma et le calcul comptent les mêmes pièces.";
    $("reserves").innerHTML = p.manquants.map(function (r) { return "<li>" + texte(r) + "</li>"; }).join("");
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.cle) { menu(b.dataset.cle); return; }
    if (b.dataset.geste) {
      var cle = etat.cible;
      if (b.dataset.geste === "changer") { $("menu").hidden = true; etat.ou = null; etat.recherche = ""; $("recherche").value = ""; etat.categorie = categorieDe(cle); ouvrir(); return; }
      if (b.dataset.geste === "supprimer") {
        if (cle.indexOf("plus:") === 0) etat.ajoutees = etat.ajoutees.filter(function (a) { return "plus:" + a.n !== cle; });
        else etat.retirees[cle] = true;
      }
      if (b.dataset.geste === "remettre") delete etat.retirees[cle];
      if (b.dataset.geste === "revenir") delete etat.remplacees[cle];
      $("menu").hidden = true; dessiner(); return;
    }
    if (b.dataset.sortie) { etat.sortie = b.dataset.sortie; dessiner(); }
    else if (b.dataset.ajouter) { etat.ou = b.dataset.ajouter; etat.cible = null; ouvrir(); }
    else if (b.dataset.categorie) { etat.categorie = b.dataset.categorie; etat.recherche = ""; $("recherche").value = ""; ouvrir(); }
    else if (b.dataset.choisir) {
      var x = trouver(b.dataset.choisir);
      // « Changer la pièce » : la nouvelle prend la place, la case garde ce qui était proposé.
      if (etat.ou === null && etat.cible) { etat.remplacees[etat.cible] = { ref: x.ref, nom: x.nom }; delete etat.retirees[etat.cible]; }
      else etat.ajoutees.push({ n: Date.now(), ou: etat.ou, ref: x.ref, nom: x.nom });
      $("feuille").hidden = true; dessiner();
    }
  });
  $("fermer").onclick = function () { $("feuille").hidden = true; };
  $("fermer-menu").onclick = function () { $("menu").hidden = true; };
  $("recherche").oninput = function () { etat.recherche = this.value; ouvrir(); };

  // La catégorie où chercher la remplaçante : celle de la pièce proposée.
  function categorieDe(cle) {
    var p = proposees[cle], x = p && trouver(p.ref);
    return x ? x.categorie : cle.indexOf("rg:") === 0 ? "nourrice" : "reseau";
  }

  // Le petit menu d'une pièce : la changer, la supprimer, ou défaire.
  function menu(cle) {
    etat.cible = cle;
    var p = proposees[cle] || {}, change = etat.remplacees[cle], retiree = etat.retirees[cle];
    $("menu-titre").textContent = change ? change.nom : p.nom;
    $("menu-propose").hidden = !change;
    $("menu-propose").textContent = change ? "Proposée : " + p.nom : "";
    var g = '<button type="button" data-geste="changer">Changer la pièce</button>';
    g += retiree ? '<button type="button" data-geste="remettre">Remettre la pièce</button>'
                 : '<button type="button" class="danger" data-geste="supprimer">Supprimer la pièce</button>';
    if (change) g += '<button type="button" data-geste="revenir">Revenir à la pièce proposée</button>';
    $("menu-gestes").innerHTML = g;
    $("menu").hidden = false;
  }

  function ouvrir() {
    $("feuille-titre").textContent = etat.ou === null ? "Changer la pièce" : "Ajouter une pièce";
    $("categories").innerHTML = CATEGORIES.map(function (c) {
      return '<button type="button" data-categorie="' + texte(c[0]) + '" aria-pressed="' + (!etat.recherche && etat.categorie === c[0]) + '">' + texte(c[1]) + "</button>";
    }).join("");
    var q = etat.recherche.trim().toLowerCase();
    var vues = LISTE.filter(function (x) { return q ? (x.nom + " " + x.ref).toLowerCase().indexOf(q) >= 0 : x.categorie === etat.categorie; });
    $("choix").innerHTML = vues.slice(0, 60).map(function (x) {
      var v = PHOTOS[x.ref] ? '<span class="vignette pleine"><img src="arrosage-photos/' + PHOTOS[x.ref] + '" alt=""></span>' : '<span class="vignette"></span>';
      return '<button type="button" class="choix" data-choisir="' + texte(x.ref) + '">' + v + "<span>" + texte(x.nom) + "<small>" + texte(x.sansReference ? "Réf. du fournisseur" : x.ref) + "</small></span></button>";
    }).join("");
    $("feuille").hidden = false;
  }

  dessiner();
})();
</script>
</body>
</html>
