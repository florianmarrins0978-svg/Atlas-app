<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les numéros de la nourrice</title>
<!--
  PLANCHE CODÉE LE 22 NOVEMBRE 2026, sur son choix du soir : « Tu peux coder la A noire à l'éclaté
  seulement », la flèche et R1, R2, R3 avec. Les repères vivent dans nourrice-3d/reperes.js, que l'écran du
  plan emploie aussi (Nourrice3D.tsx) ; B, C et « Toujours » restent ici, à titre de comparaison. Dans
  l'appli, une ligne de la liste ouvre déjà Changer et Supprimer : on y voit les pièces d'une ligne par
  « Voir », le geste qu'il a demandé d'ajouter à cette feuille. Les ombres sont retirées partout (sa
  réponse : « oui, partout »).

  Sa demande du 22 novembre 2026, devant la nourrice en 3D de
  l'écran du plan : « il y a encore les numéros pour montrer à quoi ça correspond, comme il y avait avant,
  pour les pièces juste en dessous ? », puis « remets-les. Est-ce qu'on met une pastille noire ou autre
  chose pour que ça soit joli ? Et je veux bien une planche d'abord. »

  CE QUI EST PROPOSÉ. Le numéro de la liste, accroché à chaque pièce, qui suit la pièce quand on tourne,
  zoome ou éclate. Trois habillages (A, B, C) et deux moments (à l'éclaté seulement, ou toujours). Au bout des colonnes,
  comme sur le dessin d'avant (sa demande du même soir) : la flèche « Arrivée d'eau », et R1, R2, R3 dans
  la couleur du réseau, « goutte-à-goutte » sous la voie qui l'alimente. Une
  pièce posée plusieurs fois (les électrovannes) porte le même numéro sur chacune. Toucher une ligne de la
  liste allume ses numéros sur la 3D et éteint les autres ; un second toucher rend tout.

  LES PIÈCES CHOISIES RESTENT EN COULEUR, LES AUTRES SE GRISENT. Sa demande du même soir : « quand on
  clique sur une pièce où il y a marqué 2 Dura Mamelon par exemple, ou 5 Dura Mamelon, ce qui serait bien,
  c'est que les pièces qu'on a sélectionnées restent en couleur et toutes les autres se grisent ». Toutes
  les pièces de la ligne gardent leur matière, sur chaque voie ; les autres deviennent un voile gris pâle.

  D'OÙ VIENT LE NUMÉRO. Celui de la légende de l'appli : la première pièce de chaque modèle, dans l'ordre
  de la composition (nourrice-3d/vue.js, `numeros`), le même que le dessin d'avant
  (src/lib/arrosage/nourrice-eclatee.ts), vérifié sur 1, 2, 3, 4 et 6 voies.

  La 3D est celle de l'appli (nourrice-3d/vue.js), les repères aussi (nourrice-3d/reperes.js).
-->
<!-- La carte des imports passe AVANT tout chargement de module : posée après, le navigateur l'ignore. -->
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
<link rel="modulepreload" href="vendor/three/three.module.min.js">
<link rel="modulepreload" href="nourrice-3d/vue.js">
<link rel="modulepreload" href="nourrice-3d/reperes.js">
<link rel="modulepreload" href="nourrice-3d/scene.js">
<link rel="modulepreload" href="nourrice-3d/formes.js">
<link rel="modulepreload" href="nourrice-3d/pieces/index.js">
<style>
[data-charte="origine"]{--atlas-orTexte:#8b6835;--atlas-cream:#f5f3ee;--atlas-card:#faf9f5;--atlas-ink:#1c1c1a;--atlas-inkSoft:#4a4a44;--atlas-muted:#6f6b60;--atlas-or:#B98B47;--atlas-line:rgba(28,28,26,0.12);--atlas-alerte:#9C3B2E;--atlas-rustTint:#ece9e1}
  *{box-sizing:border-box}
  html{background:var(--atlas-rustTint)}
  body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--atlas-ink);background:var(--atlas-rustTint);-webkit-text-size-adjust:100%}
  ::selection{background:var(--atlas-ink);color:var(--atlas-card)}
  .entete{max-width:430px;margin:0 auto;padding:18px 16px 6px}
  .entete h1{margin:0;font:400 24px/1.15 Georgia,"Times New Roman",serif;text-wrap:balance}
  .entete p{margin:6px 0 0;font-size:13.5px;color:var(--atlas-inkSoft)}
  .ecran{max-width:430px;margin:10px auto 0;background:var(--atlas-cream);padding:16px 16px 70px;min-height:100vh}
  h2{margin:0;font:400 21px/1.2 Georgia,"Times New Roman",serif}
  /* La ligne garde sa place quand elle est vide : la vue ne saute pas quand on ajoute une voie de goutte-à-goutte. */
  .sous{margin:4px 0 0;min-height:1.45em;font-size:13.5px;color:var(--atlas-muted)}
  /* La vue : la couleur de fond est celle que rend la scène, pour que rien ne clignote à l'arrivée de l'image. */
  .vue{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--atlas-line);background:#d6d5d2;aspect-ratio:4/5;max-height:76vh;width:100%}
  .vue canvas{display:block;width:100%;height:100%;touch-action:none;outline:0;-webkit-tap-highlight-color:transparent;cursor:grab}
  .vue canvas:active{cursor:grabbing}
  .vue canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--atlas-or)}
  .vue::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px var(--atlas-line);pointer-events:none}
  .attente{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:14px;color:var(--atlas-inkSoft);background:#d6d5d2;transition:opacity .35s ease-out}
  .attente[hidden]{display:none}
  .attente.part{opacity:0;pointer-events:none}
  .attente.refus{font-size:15px;line-height:1.4;color:var(--atlas-ink)}
  .caps{display:block;margin:16px 0 0;font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--atlas-or)}
  .voies{display:flex;gap:6px;margin-top:10px}
  .voies button{flex:1;min-width:0;min-height:44px;padding:0 4px;border-radius:10px;border:1px solid var(--atlas-line);background:var(--atlas-card);color:var(--atlas-ink);font:inherit;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .18s ease-out,color .18s ease-out,border-color .18s ease-out,transform .12s ease-out}
  .voies button:active{transform:scale(.97)}
  .voies button[aria-pressed="true"]{background:var(--atlas-ink);border-color:var(--atlas-ink);color:var(--atlas-card)}
  .voies button:focus-visible{outline:2px solid var(--atlas-or);outline-offset:2px}
  .voies.montage{margin-top:12px}
  @media (prefers-reduced-motion:reduce){.voies button,.attente{transition:none}}

  /* LES NUMÉROS : la A est celle du module (nourrice-3d/reperes.js) ; B et C, écartées, restent pour comparer. */
  /* B : l'encre cerclée d'or, le chiffre en or. */
  [data-habit="b"] .n3d-num{width:24px;height:24px;margin:-12px 0 0 -12px;color:#d9b57a;box-shadow:inset 0 0 0 1.5px var(--atlas-or),0 1px 4px rgba(28,28,26,.35)}
  /* C : l'étiquette au fil, comme sur un éclaté de fabricant. */
  [data-habit="c"] .n3d-num{width:20px;height:20px;margin:-10px 0 0 -10px;background:var(--atlas-card);color:var(--atlas-ink);box-shadow:inset 0 0 0 1px rgba(28,28,26,.55)}
  [data-habit="c"] .n3d-num.allume{background:var(--atlas-ink);color:var(--atlas-card)}
  /* La liste, comme dans l'appli : deux colonnes, la pastille de A, et une ligne se touche. */
  .liste{margin:14px 0 0;padding:14px;border-radius:6px;background:var(--atlas-card);list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
  .liste button{display:flex;align-items:flex-start;gap:8px;width:100%;min-height:40px;padding:4px 0;border:0;background:none;color:var(--atlas-ink);font:inherit;font-size:14px;line-height:1.35;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .liste b{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:22px;margin-top:-1px;border-radius:50%;background:var(--atlas-ink);color:var(--atlas-card);font-size:12px}
  .liste button[aria-pressed="true"] span{color:var(--atlas-orTexte,#8b6835);font-weight:600}
  .liste button[aria-pressed="true"] b{background:var(--atlas-or)}
</style>
<body data-charte="origine">
<div class="entete">
  <h1>Les numéros de la nourrice</h1>
  <p>Codée le 22 novembre dans le plan d’arrosage : la A, à l’éclaté seulement. B, C et « Toujours » restent pour comparer.</p>
</div>
<main class="ecran">
  <h2 id="titre">Nourrice</h2>
  <p class="sous" id="sous-titre"></p>
  <div class="vue">
    <canvas id="scene" tabindex="0" role="img" aria-label="La nourrice en 3D. Un toucher l’éclate, un second la remonte."></canvas>
    <div id="numeros" data-habit="a" aria-hidden="true"></div>
    <div class="attente" id="attente" role="status">Chargement</div>
  </div>
  <span class="caps" id="l-habit">Les numéros</span>
  <div class="voies" role="group" aria-labelledby="l-habit">
    <button type="button" data-habit="a" aria-pressed="true">A, noire</button><button type="button" data-habit="b" aria-pressed="false">B, or</button><button type="button" data-habit="c" aria-pressed="false">C, au fil</button>
  </div>
  <div class="voies" role="group" aria-label="Quand les montrer">
    <button type="button" data-quand="eclatee" aria-pressed="true">À l’éclaté</button><button type="button" data-quand="toujours" aria-pressed="false">Toujours</button>
  </div>
  <div class="voies montage" role="group" aria-label="Montage">
    <button type="button" data-montage="montee" aria-pressed="true">Montée</button><button type="button" data-montage="eclatee" aria-pressed="false">Éclatée</button>
  </div>
  <div class="voies" role="group" aria-label="Point de vue">
    <button type="button" data-vue="biais" aria-pressed="true">De biais</button><button type="button" data-vue="dessus" aria-pressed="false">Dessus</button><button type="button" data-vue="face" aria-pressed="false">De face</button>
  </div>
  <span class="caps" id="l-voies">Combien de voies</span>
  <div class="voies" role="group" aria-labelledby="l-voies">
    <button type="button" data-voies="1">1</button><button type="button" data-voies="2">2</button>
    <button type="button" data-voies="3">3</button><button type="button" data-voies="4">4</button>
    <button type="button" data-voies="5">5</button><button type="button" data-voies="6">6</button>
  </div>
  <span class="caps" id="l-goutte">Dont en goutte-à-goutte</span>
  <div class="voies" id="goutte" role="group" aria-labelledby="l-goutte"></div>
  <ol class="liste" id="liste"></ol>
</main>
<script>
// CE QUI SE DIT QUAND LA 3D NE PEUT PAS S'AFFICHER. Ce script est écrit à l'ancienne, exprès : il doit
// tourner sur le téléphone qui ne sait pas lire le reste.
var NOURRICE_3D = { prete: false, refus: "" };
function refuser(phrase) {
  // La première raison est la bonne : un vieux navigateur échoue aussi au chargement, et c'est sa
  // vieillesse qu'il faut dire, pas l'échec qui en découle.
  if (NOURRICE_3D.prete || NOURRICE_3D.refus) return;
  NOURRICE_3D.refus = phrase;
  var a = document.getElementById("attente"); a.hidden = false; a.className = "attente refus"; a.textContent = phrase;
  document.getElementById("scene").style.visibility = "hidden";
}
var REFUS = {
  ancien: "Ce navigateur est trop ancien pour afficher la 3D. Mettez votre téléphone à jour (Safari 16.4 ou plus récent).",
  webgl: "Cet appareil ne sait pas afficher la 3D : WebGL est absent ou coupé.",
  charge: "La 3D n’a pas pu se charger. Rechargez la page."
};
// Les import maps : sans elles, le module ci-dessous ne démarre même pas et ne peut rien dire.
if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports("importmap"))) refuser(REFUS.ancien);
// Un fichier qui ne vient pas, un module qui casse avant d'avoir pu parler : la page le dit aussi.
window.addEventListener("error", function () { refuser(REFUS.charge); }, true);
window.addEventListener("unhandledrejection", function () { refuser(REFUS.charge); });
</script>
<script src="arrosage-catalogue.js"></script>
<script type="module">
import { ouvrirNourrice } from "./nourrice-3d/vue.js";
import { poserReperes } from "./nourrice-3d/reperes.js";

var $ = function (id) { return document.getElementById(id); }, toile = $("scene"), CAT = window.CATALOGUE;
var etat = { voies: 3, goutte: 1, eclatee: false, vue: "biais", habit: "a", quand: "eclatee", choisi: 0 }, V = null;

// LE NOM DE CHAQUE PIÈCE, comme la légende de l'appli (NourriceEclatee.tsx) : quatre noms écrits pour la
// nourrice, les autres pris au catalogue avec leur marque.
var NOMS = { "coude-mf": "Coude MF 1\"", mamelon: "Mamelon réduit MM 1\" x 3/4\"", "vanne-purge": "Vanne 3/4\" FF", pehd: "PEHD Ø25" };
function nomDe(cle) { if (NOMS[cle]) return NOMS[cle]; var p = CAT.piece(cle); return p ? (p.marque ? p.marque + " " : "") + p.nom : cle; }

// LA LISTE, refaite quand la nourrice change : un numéro par modèle, dans l'ordre de la 3D.
var cles = [];
function liste() {
  var vus = {};
  cles = [];
  V.numeros().forEach(function (e) { if (!vus[e.numero]) { vus[e.numero] = true; cles.push(e.cle); } });
  if (etat.choisi > cles.length) etat.choisi = 0;
  $("liste").innerHTML = cles.map(function (c, i) {
    return '<li><button type="button" data-numero="' + (i + 1) + '" aria-pressed="' + (etat.choisi === i + 1) + '"><b>' + (i + 1) + "</b><span>" + nomDe(c) + "</span></button></li>";
  }).join("");
}

// LES COULEURS DES RÉSEAUX, celles du plan (src/lib/arrosage/calcul.js, COULEURS_RESEAU) : la voie 1 en
// bleu, la 2 en vert, la 3 en jaune…
var COULEURS_RESEAU = ["#2F6FB5", "#3E8F4E", "#D9A520", "#B5502F", "#7A4FA3", "#1F8A8A", "#B5417F", "#6B7A2F"];

// LA LIGNE CHOISIE : ses pièces gardent leur couleur et leurs numéros s'allument, les autres se voilent.
var R = null, couche = null;
function choisir() {
  var cle = etat.choisi ? cles[etat.choisi - 1] : null;
  V.choisir(cle); R.choisir(cle);
}

function boutons() {
  document.querySelectorAll("[data-voies]").forEach(function (b) { b.setAttribute("aria-pressed", String(Number(b.dataset.voies) === etat.voies)); });
  document.querySelectorAll("[data-montage]").forEach(function (b) { b.setAttribute("aria-pressed", String((b.dataset.montage === "eclatee") === etat.eclatee)); });
  document.querySelectorAll("[data-vue]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.vue === etat.vue)); });
  var gg = "";
  for (var j = 0; j <= etat.voies; j++) gg += '<button type="button" data-goutte="' + j + '" aria-pressed="' + (j === etat.goutte) + '">' + (j ? j : "Aucune") + "</button>";
  $("goutte").innerHTML = gg;
  var fiche = CAT.ficheNourrice(etat.voies, etat.goutte);
  $("titre").textContent = fiche.nom;
  $("sous-titre").textContent = etat.goutte ? "Dont " + etat.goutte + " en goutte-à-goutte." : "";
  document.querySelectorAll("[data-habit]").forEach(function (b) { if (b.tagName === "BUTTON") b.setAttribute("aria-pressed", String(b.dataset.habit === etat.habit)); });
  document.querySelectorAll("[data-quand]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.quand === etat.quand)); });
  document.querySelectorAll("[data-numero]").forEach(function (b) { b.setAttribute("aria-pressed", String(Number(b.dataset.numero) === etat.choisi)); });
  if (R) { couche.dataset.habit = etat.habit; R.regler({ quand: etat.quand, fil: etat.habit === "c" }); }
}
// Une autre fiche peut donner un autre modèle au même numéro : le choix se refait.
function reposer() { V.montrer(etat.voies, etat.goutte); liste(); boutons(); choisir(); }

document.addEventListener("click", function (e) {
  if (!V) return;
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.voies) { etat.voies = Number(b.dataset.voies); etat.goutte = Math.min(etat.goutte, etat.voies); reposer(); }
  else if (b.dataset.goutte) { etat.goutte = Number(b.dataset.goutte); reposer(); }
  else if (b.dataset.montage) V.eclater(b.dataset.montage === "eclatee");
  else if (b.dataset.vue) V.regarder(b.dataset.vue);
  // Une ligne touchée allume ses numéros, grise les autres pièces, et éclate la nourrice si ses numéros
  // ne se voyaient pas encore.
  else if (b.dataset.numero) { var n = Number(b.dataset.numero); etat.choisi = etat.choisi === n ? 0 : n; if (etat.choisi && etat.quand === "eclatee") V.eclater(true); boutons(); choisir(); }
  else if (b.dataset.habit) { etat.habit = b.dataset.habit; boutons(); }
  else if (b.dataset.quand) { etat.quand = b.dataset.quand; boutons(); }
});

try {
  V = ouvrirNourrice(toile, { ficheNourrice: CAT.ficheNourrice, hdri: "vendor/hdri/studio.exr" });
  couche = $("numeros");
  R = poserReperes(couche, V, { voie: function (k) { return { nom: "R" + (k + 1), couleur: COULEURS_RESEAU[k % COULEURS_RESEAU.length] }; } });
  V.scene.surImage(R.placer);
  // Les boutons suivent l'état : un toucher sur la nourrice, ou la vue tournée à la main.
  V.surEtat(function (e) { etat.eclatee = e.eclatee; etat.vue = e.vue; boutons(); });
  reposer();
  // La scène tourne : une phrase de refus posée par excès de prudence (un navigateur qui sait lire la
  // carte des imports sans savoir le dire) s'efface.
  NOURRICE_3D.prete = true; toile.style.visibility = "";
  var attente = $("attente"), premiere = false;
  attente.className = "attente"; attente.textContent = "Chargement";
  V.scene.surImage(function () { if (premiere) return; premiere = true; attente.classList.add("part"); setTimeout(function () { attente.hidden = true; }, 400); });
  // Pour les contrôles : l'état de la page, la mesure des axes dans la scène, la composition en cours.
  window.__nourrice3d = { etat: etat, scene: V.scene, erreurs: V.erreurs };
} catch (erreur) {
  refuser(/WebGL/.test(String(erreur && erreur.message)) ? REFUS.webgl : REFUS.charge);
  throw erreur;
}
</script>
</body>
</html>
