<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fournisseurs et partenaires</title>
<!--
  MAQUETTE, RIEN N'EST CODÉ (CLAUDE.md §3 bis). Ses demandes du 18 octobre 2026 :
  1. « dans Réglages, une catégorie Mes fournisseurs, valable pour l'arrosage,
     mais aussi pour du matériel ou autre » ;
  2. « pas que mes fournisseurs, mais aussi mes partenaires : on pourrait rentrer
     le prix de la main-d'œuvre de nos collègues, et quand on fait le devis, si
     on doit travailler en collaboration, on connaît déjà leur prix » ;
  3. « quand je dicte mon devis, je dis que j'ai besoin de 3 sacs de ciment, il
     faudrait qu'il aille se référer à la rubrique pour prendre le prix ».

  CE QUE L'APPLICATION FAIT AUJOURD'HUI, ET CE QUI CHANGE. Un devis dicté va
  chercher ses prix dans Réglages > Tarifs, ses PRIX DE VENTE
  (rechercher-tarifs-compatibles.ts, proposition-prix.ts), et une ligne sans
  prix reste « à chiffrer », jamais à zéro. La planche ajoute deux sources,
  dans cet ordre : 1) son tarif de vente s'il en a un ; 2) sinon le prix
  d'achat d'un fournisseur ou d'un partenaire, MULTIPLIÉ PAR SON COEFFICIENT,
  la source écrite sous la ligne ; 3) sinon « à chiffrer ». Rien ne part sans
  son geste : l'IA prépare, il valide (PRODUCT.md).

  AUCUN PRIX, AUCUN NOM N'EST INVENTÉ : tout est vide, sauf les deux fournisseurs
  qu'il a nommés. On tape un article et un prix, puis on dicte pour voir.
-->
<style>

[data-charte="pierre"]{--atlas-cream:#e8e8e3;--atlas-card:#f4f4f0;--atlas-ink:#1b1d19;--atlas-inkSoft:#454741;--atlas-muted:#83867c;--atlas-rust:#1b1d19;--atlas-rustDeep:#545652;--atlas-rustTint:#dadad5;--atlas-or:#B98B47;--atlas-orClair:#C9A15E;--atlas-orTexte:#826231;--atlas-orSurEncre:#b98b47;--atlas-line:rgba(27,29,25,0.12);--atlas-lineSoft:rgba(27,29,25,0.07);--atlas-chevron:rgba(27,29,25,0.28);--atlas-alerte:#9c3b2e;--atlas-bordeaux:#6E2433;--atlas-vertPale:#b9c6b4;--atlas-plein:#1b1d19}

[data-charte="sylve"]{--atlas-cream:#16241c;--atlas-card:#1e3026;--atlas-ink:#e6e6da;--atlas-inkSoft:#c2caba;--atlas-muted:#8ba189;--atlas-rust:#e6e6da;--atlas-rustDeep:#acb0a5;--atlas-rustTint:#253229;--atlas-or:#B98B47;--atlas-orClair:#C9A15E;--atlas-orTexte:#b98b47;--atlas-orSurEncre:#806031;--atlas-line:rgba(230,230,218,0.12);--atlas-lineSoft:rgba(230,230,218,0.07);--atlas-chevron:rgba(230,230,218,0.28);--atlas-alerte:#d47a6e;--atlas-bordeaux:#c44b63;--atlas-vertPale:#728a69;--atlas-plein:#e6e6da}
[data-charte="nuit"]{--atlas-cream:#101210;--atlas-card:#1a1d19;--atlas-ink:#e9e8de;--atlas-inkSoft:#c1c2b6;--atlas-muted:#84887b;--atlas-rust:#e9e8de;--atlas-rustDeep:#acaca4;--atlas-rustTint:#1f211e;--atlas-or:#B98B47;--atlas-orClair:#C9A15E;--atlas-orTexte:#b98b47;--atlas-orSurEncre:#826231;--atlas-line:rgba(233,232,222,0.12);--atlas-lineSoft:rgba(233,232,222,0.07);--atlas-chevron:rgba(233,232,222,0.28);--atlas-alerte:#cd6456;--atlas-bordeaux:#b53b54;--atlas-vertPale:#738b6a;--atlas-plein:#e9e8de}
  *{box-sizing:border-box}
  html{background:var(--atlas-rustTint)}
  body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--atlas-ink);background:var(--atlas-rustTint)}
  .entete{max-width:430px;margin:0 auto;padding:18px 16px 6px}
  .entete h1{margin:0;font:400 24px/1.15 Georgia,"Times New Roman",serif}
  .entete p{margin:6px 0 0;font-size:13.5px;color:var(--atlas-inkSoft)}
  .entete select{margin-top:10px;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--atlas-line);background:var(--atlas-card);color:var(--atlas-ink)}
  .ecran{max-width:430px;margin:10px auto 0;background:var(--atlas-cream);padding:6px 0 80px;min-height:100vh}
  .caps{display:block;margin:0;font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--atlas-or)}
  .bloc{margin:26px 16px 0}
  .bloc h2{margin:6px 0 0;font:400 21px/1.2 Georgia,"Times New Roman",serif}

  .onglets{display:flex;gap:6px;margin-top:12px}
  .onglets button{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--atlas-line);background:var(--atlas-card);color:var(--atlas-ink);font-size:14.5px;cursor:pointer}
  .onglets button[aria-pressed="true"]{background:var(--atlas-ink);border-color:var(--atlas-ink);color:var(--atlas-card)}
  .carte{margin-top:10px;border-radius:14px;background:var(--atlas-card);padding:14px 16px;box-shadow:0 0 0 1px var(--atlas-lineSoft)}

  .article{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--atlas-line);font-size:14px}

  body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1,h2,.feuille h2,.total .m{font-family:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:400;letter-spacing:-0.01em}
  .principal,.second,.source,.ajouter,.petit,.gestes-message button,.onglets button,.inconnue .gestes button,.nouveau button,.fournisseur .source{border-radius:999px}
</style>
<body>
<div class="entete">
  <h1>Fournisseurs et partenaires</h1>
  <p>Planche, rien n’est codé. Aucun prix n’est inventé : ajoutez un article et son prix, puis dictez une ligne.</p>
  <select id="charte" aria-label="Charte"><option value="origine">Origine</option><option value="brume">Brume</option><option value="pierre">Pierre</option><option value="beurre">Beurre</option><option value="moka">Moka</option><option value="prune">Prune</option><option value="sylve">Sylve</option><option value="nuit">Nuit</option></select>
</div>
<main class="ecran">
  <section class="bloc">
    <span class="caps">Réglages</span>
    <h2>Ce que je paie</h2>
    <p class="sous">Prix d’achat, à part de vos prix de vente.</p>
    <div class="onglets" role="group" aria-label="Rubrique">
      <button type="button" data-onglet="fournisseurs" aria-pressed="true">Mes fournisseurs</button>
      <button type="button" data-onglet="partenaires" aria-pressed="false">Mes partenaires</button>
    </div>
    <div id="liste"></div>
    <div class="nouveau"><input id="nom-nouveau" aria-label="Nom"><button type="button" id="ajouter-societe">Ajouter</button></div>

    <!-- Deux marges, sa réponse du 19 octobre 2026 : « oui, deux marges ». -->
    <div class="coef">
      <span>Ma marge sur le matériel</span>
      <input id="coef" inputmode="decimal" placeholder="1,30" aria-label="Coefficient sur le matériel">
    </div>
    <div class="coef">
      <span>Ma marge sur la main d’œuvre des partenaires</span>
      <input id="coef-mo" inputmode="decimal" placeholder="1,15" aria-label="Coefficient sur la main d’œuvre des partenaires">
    </div>
    <p class="vide-note" id="coef-note"></p>
  </section>

  <section class="bloc">
    <span class="caps">Un devis</span>
    <h2>Je dicte</h2>
    <textarea class="dictee" id="dictee" aria-label="Ce que je dicte">Il me faut 3 sacs de ciment.</textarea>
    <button class="principal" type="button" id="preparer">Préparer le devis</button>
    <div class="devis" id="devis" hidden></div>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var texte = function (s) { var e = document.createElement("span"); e.textContent = s == null ? "" : String(s); return e.innerHTML; };
  var euros = function (n) { return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €"; };
  var nombre = function (s) { var n = Number(String(s).replace(/\s/g, "").replace(",", ".")); return String(s).trim() !== "" && isFinite(n) && n >= 0 ? n : null; };
  $("charte").onchange = function () { document.body.dataset.charte = this.value; };

  // Les deux rubriques. Un fournisseur vend des articles, un partenaire de la main d'œuvre.
  var societes = {
    fournisseurs: [{ nom: "Aqua Plus", articles: [] }, { nom: "France Bonhomme", articles: [] }],
    partenaires: []
  };
  var UNITES = { fournisseurs: ["pièce", "sac", "m", "m²", "m³", "kg", "palette"], partenaires: ["heure", "journée", "m", "m²", "forfait"] };
  var onglet = "fournisseurs";

  function dessiner() {
    document.querySelectorAll("[data-onglet]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.onglet === onglet)); });
    $("nom-nouveau").placeholder = onglet === "fournisseurs" ? "Un autre fournisseur" : "Une société partenaire";
    var l = societes[onglet];
    $("liste").innerHTML = (l.length ? "" : '<p class="vide-note">Aucun partenaire. Ajoutez la société avec qui vous travaillez, puis ses prix de main d’œuvre.</p>') + l.map(function (s, i) {
      var arts = s.articles.map(function (a, k) {
        return '<div class="article"><span class="n">' + texte(a.nom) + "<small>" + (a.date ? "du " + a.date : "") + '</small></span><span class="p">' + euros(a.prix) + " / " + texte(a.unite) + '</span><button type="button" data-supprimer="' + i + ":" + k + '">Retirer</button></div>';
      }).join("");
      return '<div class="carte"><div class="tete"><b>' + texte(s.nom) + "</b><small>" + s.articles.length + (onglet === "fournisseurs" ? " article" : " prix") + (s.articles.length > 1 ? "s" : "") + "</small></div>" + arts +
        '<div class="saisie"><input data-champ="nom" data-i="' + i + '" placeholder="' + (onglet === "fournisseurs" ? "Article" : "Prestation") + '" aria-label="Article">' +
        '<select data-champ="unite" data-i="' + i + '" aria-label="Unité">' + UNITES[onglet].map(function (u) { return "<option>" + u + "</option>"; }).join("") + "</select>" +
        '<input class="prix" data-champ="prix" data-i="' + i + '" inputmode="decimal" placeholder="Prix HT" aria-label="Prix HT"></div>' +
        '<button class="petit" type="button" data-ajouter-article="' + i + '">Ajouter ce prix</button>' +
        (onglet === "fournisseurs" ? '<label class="source"><input type="file" accept="image/*" capture="environment" data-devis="' + i + '">Prendre son devis en photo</label>' : "") +
        "</div>";
    }).join("");
  }

  // Le devis dicté : chaque morceau de phrase cherche un article, d'abord chez les
  // fournisseurs, puis chez les partenaires. Le prix proposé = prix d'achat x coefficient.
  var MOTS_VIDES = /^(il|me|faut|de|des|du|la|le|les|un|une|et|pour|avec|j'ai|besoin|en|au|aux|sur)$/i;
  var racine = function (m) { return m.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/s$/, ""); };
  function preparer() {
    var coefMat = nombre($("coef").value), coefMo = nombre($("coef-mo").value);
    var morceaux = $("dictee").value.split(/[.,;\n]|\bet\b/).map(function (s) { return s.trim(); }).filter(Boolean);
    var tous = [];
    ["fournisseurs", "partenaires"].forEach(function (r) { societes[r].forEach(function (s) { s.articles.forEach(function (a) { tous.push({ a: a, s: s, r: r }); }); }); });
    var lignes = morceaux.map(function (m) {
      var q = (m.match(/\d+(?:[.,]\d+)?/) || [null])[0];
      var qte = q ? Number(q.replace(",", ".")) : (/\bdeux\b/i.test(m) ? 2 : /\btrois\b/i.test(m) ? 3 : 1);
      var mots = m.split(/\s+/).filter(function (x) { return !MOTS_VIDES.test(x) && !/^\d/.test(x) && x.length > 2; }).map(racine);
      var mieux = null, score = 0;
      tous.forEach(function (t) {
        var sienne = (t.a.nom + " " + t.s.nom).split(/\s+/).map(racine);
        var n = mots.filter(function (x) { return sienne.indexOf(x) >= 0; }).length;
        if (n > score || (n === score && n > 0 && t.a.prix < mieux.a.prix)) { score = n; mieux = t; }
      });
      return { dit: m, qte: qte, t: score > 0 ? mieux : null };
    });
    $("devis").innerHTML = lignes.map(function (l) {
      if (!l.t) return '<div class="ld vide"><div class="haut"><span>' + texte(l.dit) + "</span><b>à chiffrer</b></div><small>Aucun prix dans vos fournisseurs ni vos partenaires.</small></div>";
      var a = l.t.a, achat = a.prix * l.qte;
      var coef = l.t.r === "partenaires" ? coefMo : coefMat;
      var vente = coef ? Math.round(achat * coef * 100) / 100 : null;
      return '<div class="ld' + (vente === null ? " vide" : "") + '"><div class="haut"><span>' + texte(a.nom) + ", " + String(l.qte).replace(".", ",") + " " + texte(a.unite) + (l.qte > 1 && !/s$/.test(a.unite) ? "s" : "") + "</span><b>" + (vente === null ? "à chiffrer" : euros(vente)) + "</b></div>" +
        "<small>" + (l.t.r === "partenaires" ? "Main d’œuvre de " : "Prix d’achat ") + texte(l.t.s.nom) + (a.date ? " du " + a.date : "") + " : " + euros(achat) + (vente === null ? (l.t.r === "partenaires" ? ". Donnez votre marge sur la main d’œuvre." : ". Donnez votre marge sur le matériel.") : ", fois " + String(coef).replace(".", ",") + ".") + "</small></div>";
    }).join("") + '<p class="vide-note">Proposé, à valider. Rien ne part sans vous.</p>';
    $("devis").hidden = false;
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.onglet) { onglet = b.dataset.onglet; dessiner(); return; }
    if (b.id === "ajouter-societe") { var n = $("nom-nouveau").value.trim(); if (!n) return; societes[onglet].push({ nom: n, articles: [] }); $("nom-nouveau").value = ""; dessiner(); return; }
    if (b.dataset.ajouterArticle !== undefined) {
      var i = b.dataset.ajouterArticle, champ = function (c) { return document.querySelector('[data-champ="' + c + '"][data-i="' + i + '"]'); };
      var nom = champ("nom").value.trim(), prix = nombre(champ("prix").value);
      if (!nom || prix === null) { champ(nom ? "prix" : "nom").focus(); return; }
      societes[onglet][i].articles.push({ nom: nom, unite: champ("unite").value, prix: prix, date: new Date().toLocaleDateString("fr-FR") });
      dessiner(); return;
    }
    if (b.dataset.supprimer) { var p = b.dataset.supprimer.split(":"); societes[onglet][p[0]].articles.splice(p[1], 1); dessiner(); return; }
    if (b.id === "preparer") { preparer(); return; }
  });
  // Le devis en photo : la planche ne le lit pas ; dans l'outil, l'IA le lit et montre
  // ce qu'elle a compris avant d'enregistrer (comme ImportTarifs.tsx).
  document.addEventListener("change", function (e) {
    if (e.target.dataset && e.target.dataset.devis !== undefined && e.target.files[0]) { e.target.value = ""; e.target.parentNode.firstChild.nextSibling.textContent = "Lu dans l’outil, vérifié avant d’enregistrer"; }
  });
  $("coef").oninput = $("coef-mo").oninput = function () { $("coef-note").textContent = nombre(this.value) === null && this.value ? "Un nombre, par exemple 1,30 pour 30 % de marge." : ""; };
  dessiner();
})();
</script>
</body>
</html>
