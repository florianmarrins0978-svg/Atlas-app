<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Des couleurs bien distinctes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  DES COULEURS BIEN DISTINCTES — 27 octobre 2026

  CE QU'IL A DIT : « Le train, le virement et les repas, les couleurs sont trop
  proches. Virement reçu, tu peux mettre du vert, mais change celles des repas
  et du train. Il faut que chaque couleur soit bien distincte des autres. »

  La proposition donne une famille de couleur à chaque catégorie, sans en
  répéter : bleu marine, violet clair, cyan, orange, brun, rose, vert, gris.
  L'écart entre les deux couleurs les plus proches passe de 18,8 à 24,0 sur
  l'échelle CIEDE2000 (au-dessus de 20, deux couleurs se distinguent d'un coup
  d'œil). Sur Nuit et Sylve, chaque teinte remonte toute seule, comme avant.
*/
:root{
  --fond:#f5f3ee; --carte:#faf9f5; --encre:#1c1c1a; --encre-douce:#4a4a44; --scene:#e6e3dc;
  --trait:rgba(28,28,26,.12); --vert:#1f7a45; --rouge:#b3392b;
  --carburant:#3d6e9e; --repas:#4f8a3c; --materiel:#b9732a; --hotel:#7a5aa6; --transport:#2b8586; --virement:#a3506b; --autre:#8a8578; --recu:#2f3b2f;
  --serif:"Playfair Display",ui-serif,Georgia,serif;
  --sans:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--scene)}
body{font:16px/1.5 var(--sans);color:var(--encre);-webkit-text-size-adjust:100%}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid #B98B47;outline-offset:2px}

.choix{position:sticky;top:0;z-index:20;background:var(--scene);padding:12px 16px;border-bottom:1px solid var(--trait);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choix button{min-height:46px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--trait);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap}
.choix button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--encre);font-weight:600}
.choix i{width:14px;height:14px;border-radius:50%;display:inline-block}

.ecran{max-width:430px;margin:0 auto;background:var(--fond);min-height:100vh;padding:20px 0 40px}
h1{font:400 30px/1.15 var(--serif);margin:6px 24px 0}
.sous{margin:2px 24px 0;color:var(--encre-douce);font-size:15px}
.legende{margin:16px 24px 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--encre-douce)}
.legende span{display:inline-flex;align-items:center;gap:7px}
.legende i{width:10px;height:10px;border-radius:50%;display:inline-block}
.jour{margin:22px 24px 2px;font-size:15px;font-weight:700}
.ligne{margin:0 24px;padding:12px 0;border-top:1px solid var(--trait);display:flex;gap:12px;align-items:flex-start}
.point{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.corps{flex:1;min-width:0}
.nom{display:block;font-size:16px;font-weight:500;overflow-wrap:anywhere}
.cat{display:block;font-size:14px;color:var(--encre-douce)}
.montant{flex:none;font:400 17px/1.3 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.entree{color:var(--vert)}.sortie{color:var(--rouge)}
.barre{display:flex;height:10px;gap:2px;margin:18px 24px 0}
.barre i{display:block;border-radius:999px}
.note{margin:22px 24px 0;font-size:14px;color:var(--encre-douce)}
</style>
</head>
<body>
<div class="choix" role="group" aria-label="Palette">
  <button type="button" data-p="actuel" aria-pressed="true">Actuelle</button>
  <button type="button" data-p="neuf" aria-pressed="false">Proposition</button>
</div>
<main class="ecran">
  <p class="sous">Pour mon comptable</p>
  <h1>Octobre 2026</h1>
  <div class="legende" id="legende"></div>
  <div class="barre" id="barre"></div>
  <div id="liste"></div>
  <p class="note">Touchez « Proposition » : toutes les pastilles et la barre changent.</p>
</main>
<script>
var CAT = [
  ["carburant","Carburant"],["repas","Repas"],["materiel","Matériel"],["hotel","Hôtel"],
  ["transport","Train, taxi"],["virement","Virement envoyé"],["recu","Virement reçu"],["autre","Autre"]
];
var PALETTES = {
  actuel: {carburant:"#3d6e9e",repas:"#4f8a3c",materiel:"#b9732a",hotel:"#7a5aa6",transport:"#2b8586",virement:"#a3506b",recu:"#2f3b2f",autre:"#8a8578"},
  neuf:   {carburant:"#1e40af",repas:"#ea580c",materiel:"#78350f",hotel:"#a855f7",transport:"#0891b2",virement:"#db2777",recu:"#12a150",autre:"#8a8578"}
};
var LIGNES = [
 ["27 octobre","VIR M DUPONT FACTURE F-2026-014","recu","+864,00 €",1],
 ["27 octobre","CB BOULANGERIE DU PORT","repas","−12,40 €",0],
 ["26 octobre","CB STATION TOTAL","carburant","−62,40 €",0],
 ["25 octobre","CB LEROY MERLIN","materiel","−48,90 €",0],
 ["24 octobre","CB HOTEL IBIS","hotel","−96,00 €",0],
 ["24 octobre","SNCF TRAIN","transport","−48,00 €",0],
 ["24 octobre","PRLV SEPA BOUYGUES TELECOM","virement","−30,99 €",0],
 ["23 octobre","PAIEMENT CB ZOOPLUS","autre","−69,34 €",0]
];
var nom = {}; CAT.forEach(function(c){ nom[c[0]] = c[1]; });
function dessiner(p) {
  var pal = PALETTES[p];
  CAT.forEach(function(c){ document.documentElement.style.setProperty("--"+c[0], pal[c[0]]); });
  document.getElementById("legende").innerHTML = CAT.map(function(c){ return '<span><i style="background:var(--'+c[0]+')"></i>'+c[1]+'</span>'; }).join("");
  var parts = {carburant:62,repas:12,materiel:49,hotel:96,transport:48,virement:31,autre:69};
  document.getElementById("barre").innerHTML = Object.keys(parts).map(function(k){ return '<i style="flex:'+parts[k]+' 1 0;background:var(--'+k+')"></i>'; }).join("");
  var h="", dernier="";
  LIGNES.forEach(function(l){
    if (l[0]!==dernier){ h+='<h2 class="jour">'+l[0]+'</h2>'; dernier=l[0]; }
    h+='<div class="ligne"><span class="point" style="background:var(--'+l[2]+')"></span><span class="corps"><span class="nom">'+l[1]+'</span><span class="cat">'+nom[l[2]]+'</span></span><span class="montant '+(l[4]?"entree":"sortie")+'">'+l[3]+'</span></div>';
  });
  document.getElementById("liste").innerHTML = h;
  document.querySelectorAll(".choix button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-p")===p); });
}
document.querySelector(".choix").addEventListener("click", function(e){ var b=e.target.closest("button"); if(b) dessiner(b.getAttribute("data-p")); });
dessiner("actuel");
</script>
</body>
</html>
