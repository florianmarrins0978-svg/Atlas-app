<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les photos du robinet</title>
<!--
  Sa demande du 22 novembre 2026 : « donne-moi les photos toutes séparées, mais fais en sorte que je puisse
  toutes les télécharger dans ma galerie photo en même temps ». Ce n'est pas une planche : une page de
  photos. Le bouton passe par le partage du téléphone (navigator.share avec des fichiers) : sur un iPhone,
  la feuille de partage propose « Enregistrer N images », qui les met toutes dans Photos d'un coup. Les
  photos sont recopiées sur fond blanc, en JPEG (appli/galerie-robinet/) : détourées, elles gardaient leur
  fond transparent et la galerie les montrait sur du noir.
-->
<style>
  :root{--fond:#f5f3ee;--carte:#faf9f5;--encre:#1c1c1a;--doux:#6f6b60;--trait:rgba(28,28,26,.12)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  h1{margin:0;font:400 26px/1.15 Georgia,serif}
  .chapeau{margin:6px 0 0;color:var(--doux);font-size:14px}
  h2{margin:28px 0 10px;font:400 21px/1.2 Georgia,serif}
  .tout{width:100%;min-height:50px;border:0;border-radius:999px;background:var(--encre);color:var(--carte);font:600 16px/1 inherit;font-family:inherit;cursor:pointer}
  .tout:active{transform:scale(.98)}
  .tout:disabled{opacity:.5}
  .etat{min-height:1.4em;margin:6px 0 0;font-size:13.5px;color:var(--doux)}
  .grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
  @media (min-width:600px){.grille{grid-template-columns:repeat(3,minmax(0,1fr))}}
  figure{margin:0;padding:10px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--trait)}
  figure img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
  #montages figure img{aspect-ratio:auto}
  figcaption{margin-top:8px;font-size:13px;line-height:1.35}
</style>
<main>
  <h1>Les photos du robinet</h1>
  <p class="chapeau">Un bouton enregistre toutes les photos du groupe dans votre galerie. Une seule : appui long dessus.</p>
  <section><h2>Les 15 pièces</h2><button type="button" class="tout" data-groupe="pieces">Enregistrer les 15 photos</button><p class="etat" id="etat-pieces" role="status"></p><div class="grille" id="pieces"><figure><img src="galerie-robinet/01-double-sortie-BRO3493.jpg" alt="Double sortie, robinet 2 voies 3/4&quot; (BRO3493)" loading="lazy"><figcaption>Double sortie, robinet 2 voies 3/4&quot; (BRO3493)</figcaption></figure><figure><img src="galerie-robinet/02-programmateur-solem-bl-nr-SP1151.jpg" alt="Programmateur Solem BL-NR, 1 voie (SP1151)" loading="lazy"><figcaption>Programmateur Solem BL-NR, 1 voie (SP1151)</figcaption></figure><figure><img src="galerie-robinet/03-programmateur-orbit-buddy-AEV11401.jpg" alt="Programmateur Orbit Buddy (AEV11401)" loading="lazy"><figcaption>Programmateur Orbit Buddy (AEV11401)</figcaption></figure><figure><img src="galerie-robinet/04-programmateur-rain-bird.jpg" alt="Programmateur Rain Bird" loading="lazy"><figcaption>Programmateur Rain Bird</figcaption></figure><figure><img src="galerie-robinet/05-programmateur-solem.jpg" alt="Programmateur Solem" loading="lazy"><figcaption>Programmateur Solem</figcaption></figure><figure><img src="galerie-robinet/06-plasson-taraude-25-32.jpg" alt="Raccord Plasson taraudé x 3/4&quot;, Ø25 ou Ø32" loading="lazy"><figcaption>Raccord Plasson taraudé x 3/4&quot;, Ø25 ou Ø32</figcaption></figure><figure><img src="galerie-robinet/07-palaplast-16-debout-MID6362.jpg" alt="Embout Palaplast 16 x 3/4&quot;, debout (MID6362)" loading="lazy"><figcaption>Embout Palaplast 16 x 3/4&quot;, debout (MID6362)</figcaption></figure><figure><img src="galerie-robinet/08-palaplast-16-a-plat-MID6362.jpg" alt="Embout Palaplast 16 x 3/4&quot;, à plat (MID6362)" loading="lazy"><figcaption>Embout Palaplast 16 x 3/4&quot;, à plat (MID6362)</figcaption></figure><figure><img src="galerie-robinet/09-plasson-16-rigide-debout.jpg" alt="Raccord Plasson 16 rigide x 3/4&quot;, debout" loading="lazy"><figcaption>Raccord Plasson 16 rigide x 3/4&quot;, debout</figcaption></figure><figure><img src="galerie-robinet/10-plasson-16-rigide-a-plat.jpg" alt="Raccord Plasson 16 rigide x 3/4&quot;, à plat" loading="lazy"><figcaption>Raccord Plasson 16 rigide x 3/4&quot;, à plat</figcaption></figure><figure><img src="galerie-robinet/11-plasson-16-te-egal.jpg" alt="Té égal Plasson 16" loading="lazy"><figcaption>Té égal Plasson 16</figcaption></figure><figure><img src="galerie-robinet/12-plasson-16-te-taraude.jpg" alt="Té taraudé Plasson 16 x 3/4&quot; x 16" loading="lazy"><figcaption>Té taraudé Plasson 16 x 3/4&quot; x 16</figcaption></figure><figure><img src="galerie-robinet/13-plasson-16-coude.jpg" alt="Coude Plasson 16" loading="lazy"><figcaption>Coude Plasson 16</figcaption></figure><figure><img src="galerie-robinet/14-plasson-16-manchon.jpg" alt="Manchon Plasson 16" loading="lazy"><figcaption>Manchon Plasson 16</figcaption></figure><figure><img src="galerie-robinet/15-plasson-16-manchon-filete.jpg" alt="Manchon fileté Plasson 16 x 3/4&quot;" loading="lazy"><figcaption>Manchon fileté Plasson 16 x 3/4&quot;</figcaption></figure></div></section>
  <section><h2>Les 9 montages au nez de robinet</h2><button type="button" class="tout" data-groupe="montages">Enregistrer les 9 photos</button><p class="etat" id="etat-montages" role="status"></p><div class="grille" id="montages"><figure><img src="galerie-robinet/montage-01.jpg" alt="Avec double sortie, départ Ø25" loading="lazy"><figcaption>Avec double sortie, départ Ø25</figcaption></figure><figure><img src="galerie-robinet/montage-02.jpg" alt="Avec double sortie, départ Ø32" loading="lazy"><figcaption>Avec double sortie, départ Ø32</figcaption></figure><figure><img src="galerie-robinet/montage-03.jpg" alt="Avec double sortie, départ Ø16 rigide" loading="lazy"><figcaption>Avec double sortie, départ Ø16 rigide</figcaption></figure><figure><img src="galerie-robinet/montage-04.jpg" alt="Avec double sortie, départ Ø16 souple" loading="lazy"><figcaption>Avec double sortie, départ Ø16 souple</figcaption></figure><figure><img src="galerie-robinet/montage-05.jpg" alt="Sans double sortie, départ Ø25" loading="lazy"><figcaption>Sans double sortie, départ Ø25</figcaption></figure><figure><img src="galerie-robinet/montage-06.jpg" alt="Sans double sortie, départ Ø32" loading="lazy"><figcaption>Sans double sortie, départ Ø32</figcaption></figure><figure><img src="galerie-robinet/montage-07.jpg" alt="Sans double sortie, départ Ø16 rigide" loading="lazy"><figcaption>Sans double sortie, départ Ø16 rigide</figcaption></figure><figure><img src="galerie-robinet/montage-08.jpg" alt="Sans double sortie, départ Ø16 souple" loading="lazy"><figcaption>Sans double sortie, départ Ø16 souple</figcaption></figure><figure><img src="galerie-robinet/montage-09.jpg" alt="Jardin de 3 réseaux, il manque 2 voies" loading="lazy"><figcaption>Jardin de 3 réseaux, il manque 2 voies</figcaption></figure></div></section>
</main>
<script>
// Le partage du téléphone, avec les fichiers eux-mêmes : c'est lui qui offre « Enregistrer les images ».
// Sans lui (un ordinateur, un vieux navigateur), chaque photo se télécharge l'une après l'autre.
document.querySelectorAll(".tout").forEach(function (b) {
  b.addEventListener("click", function () {
    var groupe = b.dataset.groupe, etat = document.getElementById("etat-" + groupe);
    var imgs = Array.prototype.slice.call(document.querySelectorAll("#" + groupe + " img"));
    b.disabled = true; etat.textContent = "Préparation des photos";
    Promise.all(imgs.map(function (im) {
      return fetch(im.src).then(function (r) { return r.blob(); }).then(function (bl) { return new File([bl], im.src.split("/").pop(), { type: "image/jpeg" }); });
    })).then(function (fichiers) {
      if (navigator.canShare && navigator.canShare({ files: fichiers })) {
        etat.textContent = "Choisissez « Enregistrer les images ».";
        return navigator.share({ files: fichiers }).then(function () { etat.textContent = "C'est fait."; });
      }
      fichiers.forEach(function (f, i) {
        setTimeout(function () { var a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }, i * 250);
      });
      etat.textContent = "Les photos se téléchargent une à une.";
    }).catch(function (e) {
      etat.textContent = e && e.name === "AbortError" ? "Annulé." : "Les photos n'ont pas pu être préparées. Rechargez la page.";
    }).then(function () { b.disabled = false; });
  });
});
</script>
</html>
