<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le nom et la nourrice</title>
<!--
MAQUETTE, RIEN N'EST CODÉ (CLAUDE.md §3 bis). Sa capture du 27 octobre 2026
sur « Dessiner le plan » : le rectangle noir de la nourrice cachait
« Goutte à goutte 9 × 10, 16 lignes ». Deux façons de ne plus rien cacher : A, le nom se pousse dans la partie
libre de la zone ; B, il sort de la zone, relié par un trait.
La nourrice reste toujours là où il l'a posée (règle du 21 août) : seul le
nom de la zone change. Son terrain : pelouse 12 × 10, massif 6 × 3 dedans,
bande GAG 12 × 1 au-dessus. Les couleurs sont celles de l'application.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f5f3ee; --card: #faf9f5; --ink: #1c1c1a; --inkSoft: #4a4a44;
  --muted: #8a8578; --line: rgba(28,28,26,0.12); --rustDeep: #4f5f4c;
  --plein: #7d9a6d; --vertPale: #b9c6b4; --or: #8b6835;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--ink); font: 16px/1.45 Inter, -apple-system, system-ui, sans-serif; }
.bandeau { position: sticky; top: 0; z-index: 5; background: var(--ink); color: var(--card); font-size: 13px; padding: 8px 16px; }
main { max-width: 430px; margin: 0 auto; padding: 22px 16px 60px; }
h1 { font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.05; margin: 6px 0 4px; }
.surtitre { font-size: 10px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--or); }
.choix { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #ebe8e1; border-radius: 999px; padding: 5px; margin: 18px 0 14px; }
.choix button { border: 0; border-radius: 999px; min-height: 46px; font: 600 15px Inter, sans-serif; background: transparent; color: var(--inkSoft); }
.choix button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.carte { background: var(--card); border-radius: 14px; padding: 10px; }
svg { display: block; width: 100%; height: auto; }
.dit { margin: 12px 4px 0; font-size: 15px; color: var(--inkSoft); }
.dit b { color: var(--ink); font-weight: 600; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="bandeau">Planche, rien n’est codé. Le nom d’une zone et la nourrice ne se cachent plus.</div>
<main>
  <span class="surtitre">Dessiner le plan</span>
  <h1>Le nom et la nourrice</h1>

  <div class="choix" role="group" aria-label="Version">
    <button type="button" data-v="a" aria-pressed="true">A</button>
    <button type="button" data-v="b" aria-pressed="false">B</button>
  </div>

  <!-- Terrain 14 × 13 m, 1 m = 1 unité. Pelouse 12 × 10 en (1, 2.5) ; GAG 12 × 1 en (1, 1.5) ; massif 3 × 6 en (1, 4.5) ; nourrice au milieu du massif. -->
  <div class="carte">
    <svg viewBox="-1.2 -1.2 16.4 16.0" role="img" aria-label="Le terrain et ses zones">
      <rect x="0" y="0" width="14" height="13" rx=".2" fill="#f5f3ee" stroke="#1c1c1a" stroke-width=".08"/>
      <text x="7" y="-.45" text-anchor="middle" font-size=".55" fill="#4a4a44">14 m</text>
      <text x="-.45" y="6.5" text-anchor="middle" font-size=".55" fill="#4a4a44" transform="rotate(-90 -.45 6.5)">13 m</text>

      <!-- La pelouse, découpée autour du massif -->
      <g>
        <rect x="1" y="2.5" width="12" height="10" rx=".13" fill="rgba(185,198,180,.75)" stroke="#4f5f4c" stroke-width=".08"/>
        <text x="8.5" y="7.3" text-anchor="middle" font-size=".6" fill="#1c1c1a" stroke="#faf9f5" stroke-width=".14" paint-order="stroke">Arroseurs</text>
        <text x="8.5" y="8" text-anchor="middle" font-size=".52" fill="#4a4a44" stroke="#faf9f5" stroke-width=".14" paint-order="stroke">12 × 10, en 3 parts</text>
      </g>

      <!-- La bande GAG -->
      <g>
        <rect x="1" y="1.5" width="12" height="1" rx=".13" fill="rgba(125,154,109,.34)" stroke="#4f5f4c" stroke-width=".08"/>
        <text x="7" y="2.17" text-anchor="middle" font-size=".5" fill="#1c1c1a" stroke="#faf9f5" stroke-width=".13" paint-order="stroke">GAG, 12 × 1, 2 lignes</text>
      </g>

      <!-- Le massif -->
      <rect x="1" y="4.5" width="3" height="6" rx=".13" fill="rgba(79,95,76,.24)" stroke="#4f5f4c" stroke-width=".08"/>

      <!-- La nourrice, là où il l'a posée : au milieu du massif, où tombait le nom -->
      <g>
        <rect x="1.82" y="7.1" width="1.36" height=".8" rx=".12" fill="#1c1c1a"/>
        <text x="2.5" y="8.5" text-anchor="middle" font-size=".46" font-weight="600" fill="#1c1c1a" stroke="#faf9f5" stroke-width=".14" paint-order="stroke">nourrice</text>
      </g>

      <!-- A : le nom se pousse dans la partie libre du massif, au-dessus de la nourrice -->
      <g class="v-a">
        <text x="2.5" y="5.4" text-anchor="middle" font-size=".42" fill="#1c1c1a" stroke="#faf9f5" stroke-width=".13" paint-order="stroke">Goutte à</text>
        <text x="2.5" y="5.9" text-anchor="middle" font-size=".42" fill="#1c1c1a" stroke="#faf9f5" stroke-width=".13" paint-order="stroke">goutte</text>
        <text x="2.5" y="6.5" text-anchor="middle" font-size=".4" fill="#4a4a44" stroke="#faf9f5" stroke-width=".13" paint-order="stroke">6 × 3, 5 lignes</text>
      </g>

      <!-- B : le nom sort de la zone, sous le terrain, relié par un trait fin -->
      <g class="v-b" style="display:none">
        <line x1="2.5" y1="10.5" x2="2.5" y2="13.55" stroke="#4f5f4c" stroke-width=".05" stroke-dasharray=".15 .12"/>
        <circle cx="2.5" cy="10.2" r=".1" fill="#4f5f4c"/>
        <text x="2.5" y="14.1" text-anchor="middle" font-size=".46" fill="#1c1c1a">Goutte à goutte, 6 × 3, 5 lignes</text>
      </g>

      <!-- Le compteur -->
      <g>
        <circle cx="13.4" cy=".8" r=".32" fill="#faf9f5" stroke="#1c1c1a" stroke-width=".09"/>
        <circle cx="13.4" cy=".8" r=".1" fill="#1c1c1a"/>
        <text x="12.9" y=".97" text-anchor="end" font-size=".5" font-weight="600" fill="#1c1c1a" stroke="#faf9f5" stroke-width=".14" paint-order="stroke">compteur</text>
      </g>
    </svg>
  </div>

  <p class="dit" data-v="a"><b>A.</b> Le nom se pousse dans la partie libre de la zone, là où rien n'est posé.</p>
  <p class="dit" data-v="b" hidden><b>B.</b> Le nom sort de la zone, sous le terrain, relié à elle par un trait fin.</p>
</main>
<script>
  const boutons = document.querySelectorAll(".choix button");
  function montrer(v) {
    boutons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
    // Un élément SVG ignore « hidden » : on le masque par son style.
    document.querySelectorAll(".v-a").forEach((n) => (n.style.display = v === "a" ? "" : "none"));
    document.querySelectorAll(".v-b").forEach((n) => (n.style.display = v === "b" ? "" : "none"));
    document.querySelectorAll("p.dit").forEach((p) => (p.hidden = p.dataset.v !== v));
  }
  boutons.forEach((b) => b.addEventListener("click", () => montrer(b.dataset.v)));
</script>
</body>
</html>
