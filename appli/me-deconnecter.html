<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Me déconnecter — Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  ═══════════════════════════════════════════════════════════════════════════
  ME DÉCONNECTER — 9 septembre 2026
  ═══════════════════════════════════════════════════════════════════════════

  Sa question : « si je clique sur me déconnecter dans les réglages, est-ce que
  ça me remet à la page de connexion ? » — et il n'y a AUCUN « me déconnecter »
  dans les Réglages. Le seul geste qui existe est « Me déconnecter partout »,
  rangé au bas de l'écran « Mot de passe » (`ConnexionClient.tsx:207`).

  Ce qu'il a demandé ensuite, et que cette planche doit répondre à l'écran :
  pourquoi Face ID tombe, et ce que « tous les appareils » recouvre.

  Rien n'est codé. Les couleurs viennent de `src/lib/design-tokens.ts`.
*/
:root{
  --fond:#f5f3ee; --carte:#faf9f5; --encre:#1c1c1a; --encre-douce:#4a4a44;
  --gris:#8a8578; --pin:#2f3b2f; --papier:#ece9e1; --plein:#7d9a6d;
  --or:#B98B47; --trait:rgba(28,28,26,.12); --filet:rgba(28,28,26,.08);
  --alerte:#9C3B2E; --scene:#e6e3dc;
  --serif:"Playfair Display",ui-serif,Georgia,serif;
  --sans:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
}
body.nuit{
  --fond:#101210; --carte:#1a1d19; --encre:#e9e8de; --encre-douce:#c1c2b6;
  --gris:#84887b; --pin:#8fae86; --papier:#20241f; --plein:#8fae86;
  --or:#c6a15b; --trait:rgba(233,232,222,.12); --filet:rgba(233,232,222,.08);
  --alerte:#c07a56; --scene:#070908;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--scene)}
body{font:16px/1.5 var(--sans);color:var(--encre);-webkit-text-size-adjust:100%;padding:0 0 64px}

.bandeau{background:var(--encre);color:var(--fond);padding:18px 20px;font-size:14px;line-height:1.6}
.bandeau b{color:#fff}
/* **En Nuit, `--fond` DEVIENT SOMBRE** — et le bandeau, lui, reste noir : le
   texte disparaissait sur son propre fond, seuls les mots en gras survivaient.
   C'est le défaut qu'il a signalé le 22 août 2026 (« le mode nuit est
   illisible »), et il se recopie de planche en planche. On ne suit donc pas le
   jeton : on nomme la couleur claire, puisque le fond ne bouge pas. */
body.nuit .bandeau{background:#000;color:#c1c2b6}
body.nuit .bandeau b{color:#fff}

.etats{position:sticky;top:0;z-index:20;background:var(--scene);
       border-bottom:1px solid var(--trait);padding:12px 16px 13px}
.etats .quoi{max-width:860px;margin:0 auto 9px;font:600 10px/1 var(--sans);
             letter-spacing:.2em;text-transform:uppercase;color:var(--gris)}
.etats .rangee{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:7px}
.etats button{border:1px solid var(--trait);background:var(--carte);color:var(--encre-douce);
              border-radius:999px;padding:10px 14px;font:400 13px/1 var(--sans);cursor:pointer;
              min-height:44px;-webkit-tap-highlight-color:transparent}
.etats button[aria-pressed="true"]{background:var(--pin);border-color:var(--pin);color:#faf9f5}
body.nuit .etats button[aria-pressed="true"]{color:#101210}

.tete{max-width:860px;margin:0 auto;padding:26px 20px 0}
.tete h1{margin:0 0 6px;font:500 26px/1.15 var(--serif)}
.tete .idee{margin:0;font-size:14px;line-height:1.6;color:var(--encre-douce)}
.tete .idee b{color:var(--encre)}

.paire{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;
       max-width:900px;margin:24px auto 0;padding:0 20px}
.colonne{width:390px;max-width:100%}
.colonne .nom{margin:0 0 10px;font:500 17px/1.2 var(--serif)}
.tel{position:relative;width:390px;max-width:100%;height:790px;border-radius:26px;overflow:hidden;
     box-shadow:0 16px 44px rgba(20,18,14,.22);background:var(--fond)}
.defile{height:100%;overflow-y:auto;padding:24px 24px 60px}

/* ── La grammaire des écrans d'Atlas ──────────────────────────────────── */
h2.titre{margin:14px 0 0;font:400 32px/1.04 var(--serif);letter-spacing:-.018em}
.sur{margin:10px 0 0;font:500 11px/1 var(--sans);letter-spacing:.28em;
     text-transform:uppercase;color:var(--or)}
.inter{margin:26px 0 10px;font:500 11px/1 var(--sans);letter-spacing:.28em;
       text-transform:uppercase;color:var(--encre-douce)}
.note{margin:14px 0 0;font-size:12.5px;line-height:1.6;color:var(--gris)}
.note b{color:var(--encre);font-weight:500}
.dit{margin:12px 0 0;font-size:13.5px;line-height:1.6;color:var(--encre-douce)}

.rang{display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:13px 0;border-bottom:1px solid var(--filet)}
.rang:last-child{border-bottom:0}
.rang .n{font:400 17px/1.25 var(--serif)}
.rang .fl{flex:none;width:8px;height:8px;transform:rotate(45deg);
          border-right:1.5px solid var(--trait);border-top:1.5px solid var(--trait)}
.rang .ic{flex:none;width:21px;height:21px;margin-right:12px;border-radius:4px;
          background:var(--papier);box-shadow:inset 0 0 0 1px var(--trait)}
.rang .g{display:flex;align-items:center;min-width:0;flex:1}

/* La ligne neuve se repère à son filet doré ; ce qui part se voit barré. */
.neuf{box-shadow:inset 3px 0 0 var(--or);padding-left:11px;margin-left:-14px}
.parti{position:relative;opacity:.45}
.parti::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:1px;background:var(--alerte)}

.sortie{margin-top:30px;border-top:1px solid var(--trait);padding-top:6px}
.sortie .n{color:var(--alerte)}

.bouton{display:block;width:100%;margin-top:12px;border:0;border-radius:999px;
        background:none;box-shadow:inset 0 0 0 1px var(--trait);color:var(--encre-douce);
        padding:14px;font:400 16px var(--sans);text-align:center;cursor:default}
.bouton.vert{background:var(--plein);color:#faf9f5;box-shadow:none}
body.nuit .bouton.vert{color:#101210}
.bouton .sous{display:block;margin-top:3px;font-size:12.5px;opacity:.85}

/* La feuille qui monte du bas : ce qui se décide sans quitter l'écran. */
.feuille{position:absolute;left:0;right:0;bottom:0;background:var(--carte);
         border-top:1px solid var(--trait);border-radius:18px 18px 0 0;padding:20px 24px 26px;
         box-shadow:0 -14px 34px rgba(20,18,14,.16)}
.feuille .poignee{width:38px;height:4px;border-radius:2px;background:var(--trait);margin:0 auto 16px}
.feuille h3{margin:0;font:400 24px/1.1 var(--serif)}
.voile{position:absolute;inset:0;background:rgba(20,18,14,.34)}

.liste{margin:12px 0 0;padding:0;list-style:none}
.liste li{position:relative;padding:7px 0 7px 22px;font-size:13.5px;line-height:1.5;color:var(--encre-douce)}
.liste li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;
                  border-radius:50%;background:var(--alerte)}
.liste li.reste::before{background:var(--plein)}
.liste b{color:var(--encre);font-weight:500}

.nav{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--fond);
     border-top:1px solid var(--trait);display:flex;align-items:center;
     justify-content:space-around;font:400 9px var(--sans);letter-spacing:.18em;
     text-transform:uppercase;color:var(--gris)}
.nav.sous-feuille{display:none}

.notes{max-width:860px;margin:34px auto 0;padding:0 20px}
.notes .bloc{padding:16px 20px;background:var(--carte);border-left:3px solid var(--or);
             font-size:14px;line-height:1.7;color:var(--encre-douce)}
.notes .bloc + .bloc{margin-top:12px}
.notes b{color:var(--encre)}
.notes ul{margin:8px 0 0;padding-left:18px}
.notes li{margin:0 0 6px}
</style>
</head>
<body>

<div class="bandeau">
  <b>Me déconnecter.</b> Aujourd'hui ce bouton n'existe pas dans les Réglages :
  le seul geste est « Me déconnecter partout », rangé sous « Mot de passe ».
  À droite ce que je propose. <b>Rien n'est codé.</b>
</div>

<div class="etats">
  <p class="quoi">Voir</p>
  <div class="rangee">
    <button type="button" data-v="reglages" aria-pressed="true">Le bas des Réglages</button>
    <button type="button" data-v="choix" aria-pressed="false">Le choix</button>
    <button type="button" data-v="partout" aria-pressed="false">Ce qui tombe</button>
    <button type="button" id="pole" aria-pressed="false">Voir sur Nuit</button>
  </div>
</div>

<div class="tete">
  <h1 id="nom"></h1>
  <p class="idee" id="idee"></p>
</div>

<div class="paire">
  <div class="colonne">
    <p class="nom">Aujourd'hui</p>
    <div class="tel"><div class="defile" id="avant"></div>
      <div class="nav"><span>Chantiers</span><span>Planning</span><span>Terminés</span><span>Réglages</span></div></div>
  </div>
  <div class="colonne">
    <p class="nom">Ce que je propose</p>
    <div class="tel" id="boiteB"><div class="defile" id="apres"></div>
      <div class="nav" id="navB"><span>Chantiers</span><span>Planning</span><span>Terminés</span><span>Réglages</span></div></div>
  </div>
</div>

<div class="notes" id="notes"></div>

<script>
var etat = { vue: "reglages", nuit: false };

/* La fin du sommaire des Réglages, recopiée de `rubriques-reglages.ts` :
   l'ensemble « Moi » ferme la liste, et il ferme sur « Couleurs ». */
function finDesReglages(avecSortie){
  return '<p class="sur">Mon entreprise</p>' +
    '<h2 class="titre">Réglages</h2>' +
    '<p class="inter">L\'entreprise</p>' +
    ligne("Mon entreprise") + ligne("Équipe") + ligne("Tarifs & catalogue") +
    ligne("Devis & factures") + ligne("Atlas IA") + ligne("Mon agenda") +
    ligne("Abonnement") + ligne("Mes données") +
    '<p class="inter">Moi</p>' +
    ligne("Mon compte") + ligne("Notifications") + ligne("Mot de passe") + ligne("Couleurs") +
    (avecSortie
      ? '<div class="sortie neuf"><div class="rang"><div class="g"><span class="ic"></span>' +
        '<span class="n">Me déconnecter</span></div><span class="fl"></span></div></div>'
      : "");
}
function ligne(nom){
  return '<div class="rang"><div class="g"><span class="ic"></span><span class="n">' + nom +
         '</span></div><span class="fl"></span></div>';
}

/* L'écran « Mot de passe », tel qu'il est aujourd'hui — c'est là que le seul
   geste de déconnexion se cache, sous un intertitre nommé « Ailleurs ». */
function motDePasseAujourdhui(ouvert){
  return '<p class="sur">Mon compte</p>' +
    '<h2 class="titre">Mot de passe</h2>' +
    '<p class="inter">Changer de mot de passe</p>' +
    '<div class="rang"><span class="n" style="color:var(--gris)">Mot de passe actuel</span></div>' +
    '<div class="rang"><span class="n" style="color:var(--gris)">Nouveau mot de passe</span></div>' +
    '<div class="rang"><span class="n" style="color:var(--gris)">Confirmer</span></div>' +
    '<div class="bouton">Changer mon mot de passe</div>' +
    '<p class="inter">Ouvrir avec Face ID</p>' +
    '<div class="rang"><span class="n">Cet iPhone</span><span class="n" style="font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--plein)">Activé</span></div>' +
    '<p class="inter">Ailleurs</p>' +
    (ouvert
      ? '<p class="dit">Vous devrez vous reconnecter sur tous vos appareils, celui-ci compris.</p>' +
        '<p class="note">Face ID sera retiré de vos appareils. Vous le remettrez en un toucher.</p>' +
        '<div class="bouton vert">Me déconnecter partout</div>' +
        '<div class="bouton">Annuler</div>'
      : '<div class="rang"><span class="n">Me déconnecter partout</span><span class="fl"></span></div>');
}

/* La feuille du choix : deux gestes, et le second n'est pas le premier. */
function feuilleDuChoix(){
  return '<div class="voile"></div>' +
    '<div class="feuille"><div class="poignee"></div>' +
      '<h3>Me déconnecter</h3>' +
      '<div class="bouton vert" style="margin-top:16px">De cet appareil' +
        '<span class="sous">Face ID reste posé ici</span></div>' +
      '<div class="bouton">De tous mes appareils' +
        '<span class="sous">Face ID part partout</span></div>' +
      '<div class="bouton" style="box-shadow:none;color:var(--gris)">Annuler</div>' +
    '</div>';
}

/* Ce que « partout » emporte, dit en clair plutôt qu'en une phrase. */
function ceQuiTombe(){
  return '<p class="sur">Mon compte</p>' +
    '<h2 class="titre">Me déconnecter<br>de tous mes appareils</h2>' +
    '<ul class="liste">' +
      '<li>Vos sessions ouvertes se ferment — <b>téléphone, tablette, ordinateur</b>, celui-ci compris</li>' +
      '<li><b>Face ID part de tous vos appareils.</b> Sans ça, celui que vous voulez fermer se rouvrirait en un regard</li>' +
      '<li>Il faudra votre <b>mot de passe</b> pour revenir</li>' +
      '<li class="reste">Vos <b>salariés ne sont pas touchés</b> : ceci ne concerne que votre compte</li>' +
      '<li class="reste">Aucune donnée n\'est effacée</li>' +
    '</ul>' +
    '<div class="bouton vert" style="margin-top:22px">Me déconnecter partout</div>' +
    '<div class="bouton">Annuler</div>';
}

var VUES = {
  reglages: {
    nom: "Le bas des Réglages",
    idee: "<b>Il n'y a pas de « me déconnecter » dans les Réglages.</b> Le seul geste existant est « Me déconnecter partout », et il est rangé au bas de l'écran <b>Mot de passe</b> — personne ne le cherche là. À droite, une ligne de plus tout en bas de la liste, détachée du reste par un trait.",
    avant: function(){ return finDesReglages(false); },
    apres: function(){ return finDesReglages(true); },
    feuilleB: false,
    versLeBas: true,
    notes: [
      "<b>Elle est en bas, et en rouge sombre.</b> C'est la sortie : elle ne se met pas au milieu des tarifs, et elle ne se met pas en vert — le vert, dans Atlas, c'est ce qu'on fait, pas ce qu'on quitte.",
      "<b>Et « Me déconnecter partout » reste où il est</b>, sous « Mot de passe ». Les deux ne servent pas au même moment : l'un quand vous prêtez votre téléphone, l'autre quand vous l'avez perdu."
    ]
  },
  choix: {
    nom: "Le choix",
    idee: "Aujourd'hui il n'y a <b>qu'un seul geste, le plus violent</b> : se déconnecter du téléphone déconnecte aussi la tablette et retire Face ID partout. À droite, une feuille monte et pose la vraie question — <b>cet appareil, ou tous</b>.",
    avant: function(){ return motDePasseAujourdhui(true); },
    apres: function(){ return finDesReglages(true) + feuilleDuChoix(); },
    feuilleB: true,
    notes: [
      "<b>« De cet appareil » sera le geste de tous les jours</b>, et il ne touche à rien d'autre : votre session s'efface ici, vos autres appareils continuent, Face ID reste posé sur ce téléphone. Vous repartez sur l'écran de connexion <b>tout de suite</b>.",
      "<b>Deux appuis, comme aujourd'hui.</b> Une déconnexion au premier toucher se déclenche par mégarde au fond d'un écran de réglages — et l'on se retrouve devant la page de connexion sans comprendre pourquoi."
    ]
  },
  partout: {
    nom: "Ce qui tombe",
    idee: "<b>Vos deux questions, à l'écran.</b> Aujourd'hui l'écran dit <i>« Face ID sera retiré de vos appareils »</i> sans dire pourquoi, et <i>« tous vos appareils »</i> sans dire lesquels. À droite : cinq lignes, trois qui tombent en rouge, deux qui restent en vert.",
    avant: function(){ return motDePasseAujourdhui(true); },
    apres: ceQuiTombe,
    feuilleB: false,
    notes: [
      "<b>POURQUOI FACE ID TOMBE.</b> Face ID ouvre une session <b>sans mot de passe</b> — c'est tout son intérêt. Si on fermait les sessions en laissant les clés, l'appareil dont vous vouliez justement couper l'accès rouvrirait Atlas à l'instant d'après, d'un regard. Le geste n'aurait servi à rien. C'était le cas jusqu'au 7 septembre 2026, et c'est corrigé depuis.",
      "<b>CE QUE « TOUS LES APPAREILS » RECOUVRE.</b> Tout ce qui est ouvert <b>avec votre compte à vous</b> : téléphone, tablette, ordinateur, chaque navigateur, celui que vous tenez compris. Ni les comptes de vos salariés, ni l'entreprise, ni la moindre donnée. Techniquement, l'application marque l'heure et refuse ensuite toute session ouverte avant — la coupure est immédiate.",
      "<b>Et vous garderez besoin de votre mot de passe pour revenir</b>, sur chaque appareil, avant de reposer Face ID. C'est le coût du geste, et c'est pour ça qu'il ne doit pas être le geste de tous les jours."
    ]
  }
};

function rendre(){
  var v = VUES[etat.vue];
  document.getElementById("nom").textContent = v.nom;
  document.getElementById("idee").innerHTML = v.idee;
  var avantEl = document.getElementById("avant"), apresEl = document.getElementById("apres");
  avantEl.innerHTML = v.avant();
  apresEl.innerHTML = v.apres();
  /* La feuille se pose SUR l'écran, pas dedans : elle sort du cadre défilant. */
  var boite = document.getElementById("boiteB");
  /* Elle vit hors du cadre défilant : rien dans `#apres` ne l'emporte au
     rendu suivant. Sans ce balayage, la feuille du « choix » se retrouvait
     posée sur l'écran de « Ce qui tombe » — vu à la capture, par aucun test.
     **On ne regarde que le PREMIER étage** : `#apres` est un enfant de ce
     cadre, et une recherche profonde emportait la feuille qu'on venait tout
     juste d'y dessiner. Vu à la capture, encore. */
  Array.prototype.slice.call(boite.children).forEach(function(el){
    if (el.classList.contains("voile") || el.classList.contains("feuille")) el.remove();
  });
  var flottant = document.getElementById("apres").querySelectorAll(".voile,.feuille");
  flottant.forEach(function(el){ boite.appendChild(el); });
  document.getElementById("navB").style.display = v.feuilleB ? "none" : "flex";
  /* « Le bas des Réglages » montrait le HAUT : la ligne proposée tombait hors
     du cadre, et la planche ne montrait pas son objet. Vu à la capture. */
  if (v.versLeBas) {
    [avantEl, apresEl].forEach(function(el){ el.scrollTop = el.scrollHeight; });
  } else {
    [avantEl, apresEl].forEach(function(el){ el.scrollTop = 0; });
  }
  document.getElementById("notes").innerHTML =
    v.notes.map(function(n){ return '<div class="bloc">' + n + "</div>"; }).join("");
}

document.querySelectorAll(".etats button[data-v]").forEach(function(b){
  b.addEventListener("click", function(){
    etat.vue = b.dataset.v;
    document.querySelectorAll(".etats button[data-v]").forEach(function(o){
      o.setAttribute("aria-pressed", String(o === b));
    });
    rendre();
  });
});

var pole = document.getElementById("pole");
pole.addEventListener("click", function(){
  etat.nuit = !etat.nuit;
  document.body.classList.toggle("nuit", etat.nuit);
  pole.setAttribute("aria-pressed", String(etat.nuit));
  pole.textContent = etat.nuit ? "Revenir sur Terre" : "Voir sur Nuit";
});

rendre();
</script>
</body>
</html>
