<!--
  LA COMPOSITION DU FILM DE LA FICHE D'INTERVENTION (site de vente, planche
  cause-2.html). Ce n'est pas une page du site : c'est la pellicule, que
  film-fiche.cjs photographie image par image pour en faire
  vente/images/nov-film-fiche.mp4.

  Sa demande du 18 novembre 2026, capture de son iPhone à l'appui : « Il faut
  faire une animation pour cette page aussi ! Qu'on voit qu'en un clic on peut
  avoir l'adresse sur Maps ou Waze. Pour la note tu peux écrire quelque chose
  comme tu as fait pour le retour du jour. » Puis, le film vu : « à la place
  de l'animation de Waze, fais une animation où on clique pour appeler le
  client et on voit que ça ouvre l'application téléphone pour pouvoir
  l'appeler directement. »

  CE QUI EST VRAI, ET CE QUI EST DESSINÉ.
  Le fond est la vraie capture de la fiche (vente/images/
  nov-fiche-intervention.jpg, prise dans l'appli à trois pixels pour un).
  La note s'écrit avec ce que l'appli emploie pour elle
  (src/app/planning/FeuilleChantier.tsx) : Inter, 16 px, interligne 1,45,
  retrait de 12 et 10 px, encre #1c1c1a, curseur or. Elle est calée sur le
  texte d'exemple de la capture (film-fiche.cjs le vérifie à chaque rendu).
  « Enregistré. » apparaît dessous, comme dans l'appli quand on quitte le cadre.
  La carte et l'écran d'appel, eux, sont DESSINÉS. L'appli n'a ni carte ni
  téléphone : Maps ouvre Google Maps avec l'adresse déjà posée (src/lib/
  itineraire.ts : un itinéraire en voiture), « Appeler le client » ouvre le
  téléphone avec son numéro (un lien tel:). Ces applis ne se filment pas ici,
  et leurs écrans ne sont pas à nous : ce sont deux schémas, sans logo, qui
  disent seulement « on a quitté Cause, et l'adresse (ou le numéro) est
  arrivée ». L'écran d'appel est sombre, comme celui d'un téléphone : on ne
  le prend pas pour un écran de Cause. Le retour « Cause » en haut à gauche
  est celui qu'un iPhone affiche quand une appli en ouvre une autre.
  L'adresse et le numéro sont ceux du chantier Lemaire des captures (12 allée
  des Charmilles, Valmorin, commune inventée ; 06 39 98 12 34, tranche que
  l'Arcep réserve à la fiction : voir l'en-tête de cause.html).

  RIEN N'EST POSÉ SUR L'ÉCRAN POUR MONTRER LE DOIGT (ni pastille, ni anneau :
  son refus). La case touchée s'assombrit un instant, comme un lien qu'on
  appuie, et l'autre appli sort de cette case.

  Tout l'état est une fonction du temps : poser(t) le pose pour la seconde t,
  sans minuterie ni transition. C'est ce qui rend le film rejouable à
  l'identique.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f4f0}
#scene{position:relative;width:294px;height:532px;overflow:hidden;background:url(../vente/images/nov-fiche-intervention.jpg) 0 0/294px 532px no-repeat;font-family:Inter,system-ui,sans-serif;color:#1c1c1a}

/* ── La fiche : ce qui s'ajoute à la capture ── */
.appui{position:absolute;top:84.5px;width:59px;height:77px;border-radius:12px;background:rgba(28,28,26,.13);opacity:0}
#appui-maps{left:20px}
#appui-appel{left:215px}
/* Le cadre de la note. Le cache efface le texte d'exemple au premier
   caractère, comme un vrai cadre de saisie. Il ne couvre que ce texte, loin
   du liseré : posé jusqu'au bord, il y laissait un filet. */
#cache{position:absolute;left:28px;top:216px;width:228px;height:52px;background:#f1ebdf;opacity:0}
/* Le texte se pose au pixel d'écran près sur celui de la capture : la
   hauteur le met à un pixel de la page, le glissement fait le tiers restant
   (un navigateur aligne le texte sur les pixels de la page, pas de l'écran). */
#note{position:absolute;left:20px;top:206.6667px;transform:translateY(var(--calage,.3333px));width:254px;padding:10px 12px;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:break-word;color:#1c1c1a}
#curseur{position:relative;display:inline-block;width:0;height:1em;vertical-align:-.12em}
#curseur::after{content:"";position:absolute;left:0;top:-.08em;width:1.6px;height:1.2em;border-radius:1px;background:#b98b47}
#etat{position:absolute;left:20px;top:301.7px;margin:0;font-size:12.5px;line-height:1.5;color:#2f3b2f;opacity:0}

/* ── L'autre appli : un schéma, pas une capture ── */
.autre{position:absolute;inset:0;overflow:hidden;background:#f0ecdf;opacity:0;will-change:transform}
.autre > svg{position:absolute;inset:0;display:block}
.retour{position:absolute;left:10px;top:10px;height:26px;display:flex;align-items:center;gap:4px;padding:0 11px 0 8px;border-radius:13px;background:#fff;box-shadow:0 1px 6px rgba(28,28,26,.14);font-size:12.5px;font-weight:600;line-height:1}
.retour svg{flex:none}
.nom{position:absolute;left:0;right:0;top:10px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;letter-spacing:-.01em;pointer-events:none}
.champ{position:absolute;left:12px;right:12px;top:45px;height:42px;display:flex;align-items:center;gap:8px;padding:0 13px 0 12px;border-radius:13px;background:#fff;box-shadow:0 2px 10px rgba(28,28,26,.12);font-size:13px;font-weight:500;white-space:nowrap}
.champ svg{flex:none}
/* Ce que l'autre appli fait de l'adresse, dit sous elle (et non en bas de
   l'écran, que le bouton d'essai du téléphone recouvre). */
.fait{position:absolute;left:12px;top:95px;height:27px;display:flex;align-items:center;gap:7px;padding:0 13px 0 10px;border-radius:13.5px;background:#fff;box-shadow:0 1px 6px rgba(28,28,26,.12);font-size:12.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.fait i{flex:none;width:8px;height:8px;border-radius:50%}
#maps .fait i{background:#2f6de0}
/* L'écran d'appel : sombre, le numéro en grand, tout dans la moitié du haut. */
#appel{background:linear-gradient(180deg,#1d1e22,#2b2c31)}
#appel .retour{background:rgba(255,255,255,.16);box-shadow:none;color:#fff}
#appel .nom{color:rgba(255,255,255,.72)}
.rond{position:absolute;left:50%;top:60px;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.onde{position:absolute;left:50%;top:89px;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);opacity:0}
.numero{position:absolute;left:0;right:0;top:132px;margin:0;text-align:center;font-size:25px;font-weight:500;letter-spacing:.01em;line-height:1.2;color:#fff;font-variant-numeric:tabular-nums}
.sonne{position:absolute;left:0;right:0;top:167px;margin:0;text-align:center;font-size:13.5px;line-height:1.3;color:rgba(255,255,255,.66)}
.sonne b{display:inline-block;width:1.1em;text-align:left;font-weight:400}
.touche{position:absolute;top:222px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.touche.raccroche{left:50%;top:217px;width:60px;height:60px;margin-left:-30px;background:#e5483d}
</style>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  // ── Les courbes ──────────────────────────────────────────────────────────
  var courbe = function(x1, y1, x2, y2){
    return function(p){
      if (p <= 0) return 0; if (p >= 1) return 1;
      var a = 0, b = 1, m;
      for (var i = 0; i < 40; i++){ m = (a + b) / 2; if (3 * (1 - m) * (1 - m) * m * x1 + 3 * (1 - m) * m * m * x2 + m * m * m < p) a = m; else b = m; }
      m = (a + b) / 2;
      return 3 * (1 - m) * (1 - m) * m * y1 + 3 * (1 - m) * m * m * y2 + m * m * m;
    };
  };
  var borne = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; };
  var part = function(t, a, b){ return borne((t - a) / (b - a)); };
  var doux = function(v){ return v * v * (3 - 2 * v); };
  // L'écran de l'autre appli sort de sa case en quatre images lisibles, puis
  // se pose longuement. Une courbe plus vive (.2, .84, .2, 1) le posait à
  // 40 % de sa taille dès la deuxième image : la case touchée était
  // recouverte avant qu'on ait vu d'où il venait. Elle reste à l'épingle,
  // qui, elle, doit tomber franchement.
  var SORT = courbe(.3, .3, .15, 1), POSE = courbe(.2, .84, .2, 1), FERME = courbe(.5, 0, .3, 1), TRACE = courbe(.4, 0, .2, 1);

  // ── Le trajet : il suit les rues du plan, au point près ──────────────────
  // Une rue est une courbe de Bézier ; le trajet en emprunte des morceaux.
  var morceau = function(c, a, b){
    var entre = function(p, q, t){ return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]; };
    var coupe = function(c, t){
      var ab = entre(c[0], c[1], t), bc = entre(c[1], c[2], t), cd = entre(c[2], c[3], t);
      var abc = entre(ab, bc, t), bcd = entre(bc, cd, t), p = entre(abc, bcd, t);
      return [[c[0], ab, abc, p], [p, bcd, cd, c[3]]];
    };
    var fin = coupe(c, b)[0];
    return a > 0 ? coupe(fin, a / b)[1] : fin;
  };
  // Tout tient dans les trois cinquièmes du haut : sur un téléphone, le bas
  // de la fiche est sous le bouton d'essai quand la scène se joue.
  var ROUTE_1 = [[-10, 336], [50, 332], [104, 322], [150, 302]];
  var ROUTE_2 = [[150, 302], [196, 282], [244, 266], [304, 260]];
  var MONTEE = [[214, 278], [222, 230], [240, 170], [252, 60]];
  var ALLEE = [[228, 208], [204, 196], [176, 188], [146, 180]];
  var etapes = [morceau(ROUTE_1, .28, 1), morceau(ROUTE_2, 0, .45), morceau(MONTEE, 0, .42), ALLEE];
  var n2 = function(v){ return Math.round(v * 100) / 100; };
  var chemin = "M" + n2(etapes[0][0][0]) + " " + n2(etapes[0][0][1]);
  etapes.forEach(function(c, i){
    // Les jonctions tombent à une fraction de pixel l'une de l'autre : on
    // rejoint le début du morceau suivant par un trait, invisible à cette taille.
    if (i) chemin += "L" + n2(c[0][0]) + " " + n2(c[0][1]);
    chemin += "C" + c.slice(1).map(function(p){ return n2(p[0]) + " " + n2(p[1]); }).join(" ");
  });
  var ARRIVEE = ALLEE[3];

  var NS = "http://www.w3.org/2000/svg";
  var trait = function(parent, attributs){ var e = document.createElementNS(NS, attributs.tag || "path"); for (var k in attributs) if (k !== "tag") e.setAttribute(k, attributs[k]); parent.appendChild(e); return e; };
  var monter = function(id, teinte, bord){
    var g = document.querySelector("#" + id + " .trajet");
    var dessous = trait(g, {d: chemin, fill: "none", stroke: bord, "stroke-width": 7.6, "stroke-linecap": "round", "stroke-linejoin": "round"});
    var dessus = trait(g, {d: chemin, fill: "none", stroke: teinte, "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round"});
    var longueur = dessus.getTotalLength();
    [dessous, dessus].forEach(function(p){ p.setAttribute("stroke-dasharray", longueur + " " + longueur); });
    // L'épingle de l'arrivée, et son ombre au sol.
    var ombre = trait(g, {tag: "ellipse", cx: ARRIVEE[0], cy: ARRIVEE[1] + .5, rx: 5.5, ry: 2, fill: "rgba(28,28,26,.22)"});
    var epingle = trait(g, {tag: "g"});
    trait(epingle, {d: "M0 0c-8.600-11.400-12.500-16.600-12.500-23.300a12.500 12.500 0 0 1 25 0c0 6.700-3.900 11.900-12.500 23.300z", fill: "#d8503f", stroke: "#b23c2e", "stroke-width": 1});
    trait(epingle, {tag: "circle", cx: 0, cy: -23.3, r: 4.4, fill: "#fff"});
    // Le départ : là où l'on est.
    var debut = dessus.getPointAtLength(0), depart = trait(g, {tag: "g", transform: "translate(" + n2(debut.x) + " " + n2(debut.y) + ")"});
    trait(depart, {tag: "circle", r: 13, fill: teinte, opacity: .16});
    trait(depart, {tag: "circle", r: 6.6, fill: "#fff"});
    trait(depart, {tag: "circle", r: 4.4, fill: teinte});
    return {dessous: dessous, dessus: dessus, longueur: longueur, ombre: ombre, epingle: epingle};
  };
  var TRAJET = monter("maps", "#2f6de0", "#2251b4");

  // ── Le déroulé, en secondes ──────────────────────────────────────────────
  // Les cases d'abord : elles sont en haut de la fiche, donc vues les
  // premières quand on arrive en descendant. La note vient ensuite, le temps
  // qu'elle soit montée au-dessus du bouton d'essai du téléphone.
  var NOTE = "Clé du portail chez la voisine. Prendre le broyeur.";
  // Chaque écran garde un repos une fois posé : refermé aussitôt, ce qu'il
  // dit n'était qu'un tressaillement (vu à la relecture, sur l'écran qui
  // tenait cette place avant l'appel). Le repos du début est court : la page
  // attend déjà une demi-seconde avant de lancer le film.
  var T = {
    maps: {appui: .24, ouvre: .36, trace: .78, tracee: .70, ferme: 2.06, centre: [49.5, 123]},
    appel: {appui: 2.58, ouvre: 2.70, ferme: 4.20, centre: [244.5, 123]},
    curseur: 4.76, ecrit: 4.94
  };
  var DUREE_OUVRE = .46, DUREE_FERME = .36;
  // L'écran part de la taille d'une case (un cinquième de la sienne), posé
  // SUR elle. Le point fixe d'une mise à l'échelle n'est pas le centre de ce
  // qu'on veut voir rétrécir dessus : prendre le centre de la case pour point
  // fixe faisait naître l'écran vingt pixels à droite et trente plus bas, à
  // cheval sur la case voisine. Le point fixe se calcule : c'est celui qui
  // amène le centre de l'écran sur le centre de la case à l'échelle de départ.
  var PETIT = .2, ECRAN = [147, 266];
  var pointFixe = function(centre){ return [(centre[0] - PETIT * ECRAN[0]) / (1 - PETIT), (centre[1] - PETIT * ECRAN[1]) / (1 - PETIT)]; };
  // La frappe : régulière sans être mécanique, un souffle après un point.
  // Une quarantaine de millisecondes par lettre : c'est le rythme de la
  // remarque du film des travaux (« Le portail ferme mal, à revoir. »).
  var instants = [], h = T.ecrit;
  for (var i = 0; i < NOTE.length; i++){
    instants.push(h);
    var car = NOTE.charAt(i), alea = ((i * 7919 + 13) % 23) / 1000;
    h += .030 + alea + (car === "." ? .16 : car === "," ? .08 : 0);
  }
  T.ecritFin = instants[instants.length - 1];
  T.enregistre = T.ecritFin + .38;
  var DUREE = Math.ceil((T.enregistre + .5) * 60) / 60;

  // Une autre appli sort de la case touchée et y rentre.
  var poserAutre = function(nom, t){
    var el = $(nom), r = T[nom];
    var appui = $("appui-" + nom);
    appui.style.opacity = (doux(part(t, r.appui, r.appui + .07)) * (1 - doux(part(t, r.ouvre + .1, r.ouvre + .3)))).toFixed(3);
    var ouvert = t < r.ferme ? SORT(part(t, r.ouvre, r.ouvre + DUREE_OUVRE)) : 1 - FERME(part(t, r.ferme, r.ferme + DUREE_FERME));
    if (ouvert <= 0){ el.style.opacity = "0"; el.style.transform = "scale(" + PETIT + ")"; return; }
    // L'échelle part de la taille de la case, avec son arrondi (12 px), et
    // les coins s'ouvrent avec elle.
    var echelle = PETIT + (1 - PETIT) * ouvert, fixe = pointFixe(r.centre);
    el.style.transformOrigin = fixe[0].toFixed(3) + "px " + fixe[1].toFixed(3) + "px";
    el.style.transform = "scale(" + echelle.toFixed(4) + ")";
    el.style.borderRadius = (12 * (1 - ouvert) / echelle).toFixed(2) + "px";
    el.style.opacity = doux(part(ouvert, 0, t < r.ferme ? .3 : .2)).toFixed(3);
  };
  // Maps : le trajet se trace du départ à l'arrivée ; l'épingle se pose au bout.
  var tracer = function(t){
    var r = T.maps, j = TRAJET;
    var decalage = (j.longueur * (1 - TRACE(part(t, r.trace, r.trace + r.tracee)))).toFixed(2);
    j.dessous.setAttribute("stroke-dashoffset", decalage); j.dessus.setAttribute("stroke-dashoffset", decalage);
    var pose = part(t, r.trace + r.tracee * .62, r.trace + r.tracee * .62 + .34), chute = POSE(pose);
    j.epingle.setAttribute("transform", "translate(" + ARRIVEE[0] + " " + (ARRIVEE[1] - 16 * (1 - chute)).toFixed(2) + ") scale(" + (.6 + .4 * chute).toFixed(3) + ")");
    j.epingle.setAttribute("opacity", doux(part(pose, 0, .35)).toFixed(3));
    j.ombre.setAttribute("opacity", doux(part(pose, .3, 1)).toFixed(3));
  };
  // Le téléphone : l'appel part. Deux ondes quittent le rond l'une après
  // l'autre, et les points de suspension se comptent.
  var sonner = function(t){
    var depuis = t - (T.appel.ouvre + .3);
    $("points").textContent = depuis < 0 ? "" : "...".slice(0, 1 + Math.floor(depuis / .3) % 3);
    ["onde-1", "onde-2"].forEach(function(id, k){
      var tour = depuis < 0 ? -1 : ((depuis - k * .55) / 1.1) % 1;
      var o = $(id);
      if (tour < 0){ o.style.opacity = "0"; return; }
      o.style.transform = "scale(" + (1 + 1.1 * tour).toFixed(3) + ")";
      o.style.opacity = (.55 * (1 - tour) * doux(part(tour, 0, .12))).toFixed(3);
    });
  };

  window.DUREE = DUREE;
  window.NOTE = NOTE;
  window.poser = function(t){
    poserAutre("maps", t); tracer(t);
    poserAutre("appel", t); sonner(t);
    // La note : le curseur se pose, le texte d'exemple s'efface au premier
    // caractère, « Enregistré. » vient quand on quitte le cadre.
    var ecrits = 0; while (ecrits < instants.length && instants[ecrits] <= t) ecrits++;
    $("ecrit").textContent = NOTE.slice(0, ecrits);
    $("cache").style.opacity = ecrits ? "1" : "0";
    var dernier = ecrits ? instants[ecrits - 1] : T.curseur;
    var enFrappe = ecrits > 0 && ecrits < instants.length || t - dernier < .3;
    var bat = Math.floor((t - dernier) / .53) % 2 === 0;
    $("curseur").style.visibility = t >= T.curseur && t < T.enregistre - .1 && (enFrappe || bat) ? "visible" : "hidden";
    $("etat").style.opacity = doux(part(t, T.enregistre, T.enregistre + .2)).toFixed(3);
  };
  // Pour le calage : le texte d'exemple de l'appli, posé là où la note s'écrit.
  window.calage = function(texte){
    $("ecrit").textContent = texte; $("cache").style.opacity = "1"; $("curseur").style.visibility = "hidden"; $("etat").style.opacity = "0";
    ["maps", "appel"].forEach(function(n){ $(n).style.opacity = "0"; $("appui-" + n).style.opacity = "0"; });
  };
  window.poser(Number(new URLSearchParams(location.search).get("t")) || 0);
})();
</script>
</body>
</html>
