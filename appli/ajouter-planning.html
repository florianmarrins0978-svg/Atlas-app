<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajouter sur une journée du planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --etabli:#e6e3dc; --etabli-carte:#faf9f5; --etabli-trait:rgba(28,28,26,.12);
    --etabli-encre:#1c1c1a; --etabli-doux:#4a4a44; --etabli-gris:#77726a;
    --etabli-or:#8b6835;
    --serif:"Playfair Display",ui-serif,Georgia,serif;
    --sans:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;

    --cream:#f5f3ee; --card:#faf9f5; --ink:#1c1c1a; --inkSoft:#4a4a44;
    --muted:#8a8578; --rust:#2f3b2f; --plein:#7d9a6d; --or:#B98B47;
    --bordeaux:#6E2433; --vertPale:#b9c6b4;
    --line:rgba(28,28,26,.12); --lineSoft:rgba(28,28,26,.07);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--etabli)}
  body{font-family:var(--sans);color:var(--etabli-encre);-webkit-font-smoothing:antialiased}

  .page{max-width:1240px;margin:0 auto;padding:30px 16px 90px}
  .surtitre{font:600 11.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;
            color:var(--etabli-or);margin:0 0 10px}
  h1{font:600 30px/1.15 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
  .chapeau{max-width:680px;color:var(--etabli-doux);font-size:15.5px;line-height:1.6;margin:0 0 22px}

  .rangee{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .tel{width:390px;max-width:100%;border-radius:26px;overflow:hidden;
       box-shadow:0 1px 2px rgba(20,18,14,.16),0 14px 34px rgba(20,18,14,.14);background:var(--cream)}
  .ecran{height:720px;display:flex;flex-direction:column;background:var(--cream);color:var(--ink)}
  .corps{flex:1;overflow-y:auto;padding:0 0 24px}

  .entete{padding:20px 22px 6px}
  .entete h3{font:600 25px/1.15 var(--serif);margin:0}
  .semaine{display:flex;justify-content:space-between;margin:14px 18px 0;padding:0 4px}
  .j{width:40px;text-align:center;padding:7px 0 8px;border-radius:10px;color:var(--muted)}
  .j b{display:block;font:500 16px/1.2 var(--sans);color:var(--ink);margin-top:3px}
  .j small{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .j .barres{display:flex;flex-direction:column;gap:2px;margin:5px 8px 0}
  .j .barres i{display:block;height:3px;border-radius:2px;background:var(--lineSoft)}
  .j.pris-m .barres i:first-child,.j.pris-a .barres i:last-child{background:var(--rust)}
  .j.dela-m .barres i:first-child,.j.dela-a .barres i:last-child{background:var(--bordeaux)}
  .j.choisi{background:var(--card);box-shadow:inset 0 0 0 1px var(--lineSoft)}

  .carte{margin:16px 18px 0;background:var(--card);border-radius:10px;padding:14px 15px}
  .date{margin:0 0 14px;text-align:center;font:700 12.5px/1 var(--sans);letter-spacing:.14em;
        text-transform:uppercase;color:var(--ink)}
  .absent{background:none;border:0;padding:4px 0;color:var(--or);font:400 14px/1 var(--sans);min-height:36px;cursor:default}
  .bloc{margin-top:16px}
  .bloc:first-of-type{margin-top:4px}
  .nomch{font:400 19px/1.2 var(--serif);color:var(--ink)}
  .duree{margin-top:3px;font-size:12.5px;color:var(--or)}
  .lieu{margin-top:2px;font-size:11.5px;line-height:1.5;color:var(--muted)}
  .demi{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:30px}
  .pastille{width:11px;height:11px;border-radius:3px;flex:none}
  .p-vide{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  .p-plein{background:var(--rust)}
  .p-dela{background:var(--bordeaux)}
  .motdemi{width:70px;flex:none;font:600 10px/1.15 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .compte{margin-left:auto;font-size:12px;color:var(--muted)}
  .gestes{margin-left:auto;display:flex;gap:16px}
  .gestes span{font-size:13px;color:var(--or)}
  .poserici{min-height:44px;border-radius:999px;padding:0 14px;font:400 12.5px/1 var(--sans);
            color:var(--or);background:none;border:0;box-shadow:inset 0 0 0 1px var(--or);cursor:pointer}

  .motor{background:none;border:0;padding:0;min-height:44px;display:inline-flex;align-items:center;
         font:400 14px/1 var(--sans);color:var(--or);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .centre{margin-top:8px;display:flex;justify-content:center}
  .voies{display:flex;flex-wrap:wrap;gap:0 18px;align-items:center}
  .zone{margin-top:14px;padding-top:12px}
  .choisir{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
  .petit{border-radius:999px;padding:7px 12px;font:400 12px/1.2 var(--sans);cursor:pointer;
         border:1px solid var(--line);background:var(--card);color:var(--inkSoft)}
  .petit.retenue{border-color:var(--plein);background:var(--plein);color:var(--card)}
  .droite{margin-top:8px;display:flex;justify-content:flex-end}
  .gauche{margin-top:10px;display:flex}

  .recherche{margin-top:8px;display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--muted)}
  .recherche:focus-within{border-bottom-color:var(--or)}
  .recherche input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;outline:none;
                   font:400 17px/1.2 var(--sans);color:var(--ink);caret-color:var(--or)}
  .recherche input::placeholder{color:var(--muted)}
  .champ{margin-top:8px;width:100%;border:0;border-radius:9px;padding:12px;min-height:48px;outline:none;
         font:400 16px/1.2 var(--sans);background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .info{margin:8px 0 0;font-size:13px;color:var(--inkSoft)}
  .info span{display:block;color:var(--muted)}
  .refus{margin:8px 0 0;font-size:13px;color:var(--bordeaux)}
  .moments{margin-top:4px;display:flex;flex-wrap:wrap;gap:0 18px}
  .moment{background:none;border:0;padding:0;min-height:44px;font:400 14px/1 var(--sans);color:var(--or);cursor:pointer;
          text-underline-offset:6px;text-decoration-thickness:1.5px;text-decoration-color:var(--or)}
  .moment[aria-pressed="true"]{color:var(--ink);text-decoration-line:underline}

  .temoin{width:390px;max-width:100%;background:var(--etabli-carte);border-radius:16px;padding:16px 18px;
          box-shadow:inset 0 0 0 1px var(--etabli-trait)}
  .temoin .t{display:block;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
             color:var(--etabli-or);margin-bottom:10px}
  .temoin ul{list-style:none;margin:0;padding:0}
  .temoin li{font-size:14px;line-height:1.5;color:var(--etabli-doux);padding:7px 0;border-top:1px solid var(--etabli-trait)}
  .temoin li:first-child{border-top:0}
  .temoin li.neuf{animation:neuf 1.6s ease-out}
  @keyframes neuf{from{background:rgba(185,139,71,.22)}to{background:transparent}}
  .temoin .vide{font-size:14px;color:var(--etabli-gris)}
  .recommencer{margin-top:14px;appearance:none;border:0;cursor:pointer;font:600 12.5px/1 var(--sans);
               padding:11px 17px;border-radius:999px;background:var(--etabli-carte);color:var(--etabli-doux);
               box-shadow:inset 0 0 0 1px var(--etabli-trait)}
</style>
</head>
<body>
<main class="page">
  <p class="surtitre">Planning, fiche d'un jour</p>
  <h1>Ajouter sur une journée</h1>
  <p class="chapeau">Appuyez sur Ajouter, essayez chaque voie, puis Poser sans rien écrire.</p>

  <div class="rangee">
    <div class="tel"><div class="ecran"><div class="corps">
      <div class="entete"><h3>Planning</h3></div>
      <div class="semaine" id="semaine"></div>
      <div class="carte" id="carte"></div>
    </div></div></div>

    <div>
      <div class="temoin">
        <span class="t">Enregistré</span>
        <div id="temoin"></div>
      </div>
      <button class="recommencer" id="recommencer" type="button">Recommencer</button>
    </div>
  </div>
</main>

<script>
(function(){
  var JOUR = "Mercredi 30 septembre";
  var CARNET = [
    {nom:"Bernard", affiche:"Mr. Bernard", tel:"06 21 44 18 07", adresse:"14 rue des Tilleuls, Olivet"},
    {nom:"Lefèvre", affiche:"Mme Lefèvre", tel:"06 58 03 92 11", adresse:"3 allée des Charmes, Saran"},
    {nom:"Garnier", affiche:"Mr. Garnier", tel:"07 81 20 36 45", adresse:"22 route de Blois, Ingré"},
    {nom:"Moreau", affiche:"Mme Moreau", tel:"06 12 77 40 59", adresse:"9 impasse du Moulin, Fleury-les-Aubrais"}
  ];

  var etat;
  function depart(){
    etat = {
      jour: [ {nom:"Mr. Bernard", lieu:"Olivet", demis:["matin"]} ],
      sansDate: [ {nom:"Mme Lefèvre", lieu:"Saran"} ],
      morceaux: [ {nom:"Mr. Garnier", lieu:"Ingré"} ],
      carnet: CARNET.map(function(c){return Object.assign({}, c);}),
      ouvert: null,
      enMain: null,
      saisie: "", reponse: {mot:"", clients:[]}, retenu: null,
      fiche: {telephone:"", email:"", adresse:""},
      quand: "matin", quoi: "", enCours: false, refus: null,
      enregistre: [], dernier: -1
    };
  }

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function sansAccent(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
  var MOT = {matin:"Matin", apres_midi:"Après-midi", journee:"Journée"};
  var DIT = {matin:"matin", apres_midi:"après-midi", journee:"journée"};

  function prises(demi){ return etat.jour.filter(function(c){return c.demis.indexOf(demi)>=0;}).length; }
  function classeDemi(demi){ var n=prises(demi); return n===0?"p-vide":(n===1?"p-plein":"p-dela"); }

  function note(texte){ etat.enregistre.push(texte); etat.dernier = etat.enregistre.length-1; }

  function poserSurLeJour(nom, lieu, quand){
    var demis = quand==="journee" ? ["matin","apres_midi"] : [quand];
    etat.jour.push({nom:nom, lieu:lieu, demis:demis});
  }
  function premiereLibre(){ return prises("matin")===0 ? "matin" : "apres_midi"; }

  function semaine(){
    var jours=[["Lun",28],["Mar",29],["Mer",30],["Jeu",1],["Ven",2]];
    var h="";
    jours.forEach(function(j){
      var cl="j";
      if(j[1]===30){
        cl+=" choisi";
        var m=prises("matin"), a=prises("apres_midi");
        if(m===1) cl+=" pris-m"; if(m>1) cl+=" dela-m";
        if(a===1) cl+=" pris-a"; if(a>1) cl+=" dela-a";
      }
      if(j[1]===29) cl+=" pris-m pris-a";
      if(j[1]===2) cl+=" pris-m";
      h+='<div class="'+cl+'"><small>'+j[0]+'</small><b>'+j[1]+'</b><div class="barres"><i></i><i></i></div></div>';
    });
    document.getElementById("semaine").innerHTML=h;
  }

  function ligneDemi(demi, avecGestes){
    return '<div class="demi"><span class="pastille '+classeDemi(demi)+'"></span><span class="motdemi">'+MOT[demi]+'</span>'+
      (avecGestes?'<span class="gestes"><span>Déplacer</span><span>Retirer</span></span>':'')+'</div>';
  }
  function ligneLibre(demi){
    return '<div class="demi" style="margin-top:16px"><span class="pastille p-vide"></span><span class="motdemi">'+MOT[demi]+'</span>'+
      '<span class="compte">libre</span>'+
      (etat.enMain?'<button class="poserici" data-ici="'+demi+'" type="button">Poser ici</button>':'')+'</div>';
  }

  function moments(){
    return '<div class="moments">'+["matin","apres_midi","journee"].map(function(k){
      return '<button class="moment" type="button" data-quand="'+k+'" aria-pressed="'+(etat.quand===k)+'">'+MOT[k]+'</button>';
    }).join("")+'</div>';
  }
  function refus(){ return etat.refus?'<p class="refus">'+esc(etat.refus)+'</p>':''; }
  function annuler(){ return '<div class="gauche"><button class="petit" data-action="annuler" type="button">Annuler</button></div>'; }
  function boutonPoser(pret, action){
    return '<div class="droite"><button class="petit'+(pret?' retenue':'')+'" data-action="'+action+'" type="button">'+(etat.enCours?'…':'Poser')+'</button></div>';
  }

  /* Ce que l'application calcule dans AjoutDunClient. */
  function motClient(){ return etat.saisie.trim(); }
  function cherche(){ var m=motClient(); return m.length>=2 && etat.reponse.mot!==m; }
  function trouves(){ return etat.reponse.mot===motClient()?etat.reponse.clients:[]; }
  function inconnu(){ var m=motClient(); return etat.retenu===null && !cherche() && trouves().length===0 && m.length>=2; }
  function pretClient(){ return (etat.retenu!==null || motClient().length>=2) && !etat.enCours; }
  function pretTemps(){ return etat.quoi.trim().length>=2 && !etat.enCours; }

  function zoneAjout(){
    var o=etat.ouvert;
    if(o===null){
      return '<div class="centre"><button class="motor" data-action="ajouter" type="button">Ajouter</button></div>';
    }
    if(o==="voies"){
      var aEnAttente = etat.sansDate.length>0 || etat.morceaux.length>0;
      return '<div class="zone"><div class="voies">'+
        (aEnAttente?'<button class="motor" data-action="voie-attente" type="button">Client en attente</button>':'')+
        '<button class="motor" data-action="voie-client" type="button">Un client</button>'+
        '<button class="motor" data-action="voie-temps" type="button">Autre chose</button>'+
        '</div><div class="centre"><button class="motor" data-action="fermer" type="button">Fermer</button></div></div>';
    }
    if(o==="qui"){
      var h='<div class="zone"><div class="choisir">';
      etat.sansDate.forEach(function(s,i){ h+='<button class="petit" data-sansdate="'+i+'" type="button">'+esc(s.nom)+'</button>'; });
      etat.morceaux.forEach(function(m,i){ h+='<button class="petit'+(etat.enMain===m.nom?' retenue':'')+'" data-morceau="'+i+'" type="button">'+esc(m.nom)+', ½</button>'; });
      h+='</div><div class="droite"><button class="petit" data-action="annuler" type="button">Annuler</button></div></div>';
      return h;
    }
    if(o==="temps"){
      return '<div class="zone"><input class="champ" id="quoi" value="'+esc(etat.quoi)+'" placeholder="Rendez-vous à la banque, livraison…">'+
        moments()+refus()+annuler()+boutonPoser(pretTemps(),"poser-temps")+'</div>';
    }
    if(o==="client"){
      var h2='<div class="zone"><div class="recherche"><svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="#B98B47" stroke-width="1.5"><circle cx="8.2" cy="8.2" r="6.2"/><path d="M12.8 12.8L18 18" stroke-linecap="round"/></svg>'+
        '<input id="nomclient" type="text" autocomplete="off" value="'+esc(etat.saisie)+'" placeholder="Nom du client" aria-label="Nom du client"></div>';
      if(etat.retenu){
        h2+='<p class="info">'+esc(etat.retenu.nom)+'<span>'+esc(etat.retenu.tel||"sans numéro")+', '+esc(etat.retenu.adresse||"sans adresse")+'</span></p>';
      } else if(trouves().length>0){
        h2+='<div class="choisir">'+trouves().map(function(c,i){return '<button class="petit" data-trouve="'+i+'" type="button">'+esc(c.nom)+'</button>';}).join("")+'</div>';
      } else if(inconnu()){
        h2+='<p class="info">Inconnu, sa fiche sera créée</p>';
        [["telephone","Téléphone"],["email","E-mail"],["adresse","Adresse du chantier"]].forEach(function(p){
          h2+='<input class="champ" data-fiche="'+p[0]+'" value="'+esc(etat.fiche[p[0]])+'" placeholder="'+p[1]+'">';
        });
      }
      h2+=moments()+refus()+annuler()+boutonPoser(pretClient(),"poser-client")+'</div>';
      return h2;
    }
    return "";
  }

  function carte(){
    var h='<p class="date">'+JOUR+'</p><button class="absent" type="button">Absent ?</button>';
    var libreAvant = prises("matin")===0;
    etat.jour.forEach(function(c,rang){
      h+='<div class="bloc" style="margin-top:'+(rang===0?4:16)+'px"><div class="nomch">'+esc(c.nom)+'</div>'+
        '<div class="duree">'+(c.demis.length===2?"une journée":"une demi-journée")+'</div>'+
        (c.lieu?'<div class="lieu">'+esc(c.lieu)+'</div>':'');
      c.demis.forEach(function(d){ h+=ligneDemi(d,true); });
      h+='</div>';
    });
    if(libreAvant) h+=ligneLibre("matin");
    if(prises("apres_midi")===0) h+=ligneLibre("apres_midi");
    h+=zoneAjout();
    document.getElementById("carte").innerHTML=h;
  }

  function temoin(){
    var el=document.getElementById("temoin");
    if(etat.enregistre.length===0){ el.innerHTML='<p class="vide">Rien pour l\'instant.</p>'; return; }
    el.innerHTML='<ul>'+etat.enregistre.map(function(t,i){return '<li'+(i===etat.dernier?' class="neuf"':'')+'>'+esc(t)+'</li>';}).join("")+'</ul>';
    etat.dernier=-1;
  }

  function rendre(focus){
    var actif=document.activeElement, id=actif&&actif.id, fiche=actif&&actif.getAttribute&&actif.getAttribute("data-fiche");
    var pos=actif&&typeof actif.selectionStart==="number"?actif.selectionStart:null;
    semaine(); carte(); temoin();
    var cible=focus?document.getElementById(focus):(id?document.getElementById(id):(fiche?document.querySelector('[data-fiche="'+fiche+'"]'):null));
    if(cible){ cible.focus(); if(pos!==null&&!focus){ try{cible.setSelectionRange(pos,pos);}catch(e){} } }
  }

  function ouvrirVoies(){ etat.ouvert="voies"; etat.refus=null; }
  function remiseAZeroGeste(){
    etat.saisie=""; etat.reponse={mot:"",clients:[]}; etat.retenu=null;
    etat.fiche={telephone:"",email:"",adresse:""}; etat.quand="matin"; etat.quoi=""; etat.enCours=false; etat.refus=null;
  }

  var minuteur=null;
  function lancerRecherche(){
    clearTimeout(minuteur);
    var m=motClient();
    if(etat.retenu || m.length<2) return;
    minuteur=setTimeout(function(){
      var n=sansAccent(m);
      var r=etat.carnet.filter(function(c){return sansAccent(c.nom).indexOf(n)>=0 || sansAccent(c.affiche).indexOf(n)>=0;}).slice(0,6)
        .map(function(c){return {nom:c.nom, tel:c.tel, adresse:c.adresse};});
      etat.reponse={mot:m, clients:r};
      rendre();
    }, 450);
  }

  var carteEl=document.getElementById("carte");
  carteEl.addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    var a=b.getAttribute("data-action");
    if(a==="ajouter"){ remiseAZeroGeste(); ouvrirVoies(); return rendre(); }
    if(a==="fermer"){ etat.ouvert=null; remiseAZeroGeste(); return rendre(); }
    if(a==="annuler"){ remiseAZeroGeste(); ouvrirVoies(); return rendre(); }
    if(a==="voie-attente"){ etat.ouvert="qui"; return rendre(); }
    if(a==="voie-client"){ remiseAZeroGeste(); etat.ouvert="client"; return rendre("nomclient"); }
    if(a==="voie-temps"){ remiseAZeroGeste(); etat.ouvert="temps"; return rendre("quoi"); }

    if(b.hasAttribute("data-quand")){ etat.quand=b.getAttribute("data-quand"); return rendre(); }

    if(b.hasAttribute("data-sansdate")){
      /* Un seul appui : l'application pose tout de suite, sans autre question. */
      var s=etat.sansDate.splice(+b.getAttribute("data-sansdate"),1)[0];
      etat.ouvert=null;
      var q=premiereLibre();
      poserSurLeJour(s.nom, s.lieu, q);
      note("Chantier "+s.nom+" posé le "+JOUR.toLowerCase()+", "+DIT[q]+".");
      return rendre();
    }
    if(b.hasAttribute("data-morceau")){
      var m=etat.morceaux[+b.getAttribute("data-morceau")];
      etat.enMain=m.nom; etat.ouvert=null;
      return rendre();
    }
    if(b.hasAttribute("data-ici")){
      var demi=b.getAttribute("data-ici");
      var idx=etat.morceaux.findIndex(function(x){return x.nom===etat.enMain;});
      var mo=etat.morceaux.splice(idx,1)[0];
      etat.enMain=null;
      poserSurLeJour(mo.nom, mo.lieu, demi);
      note("Demi-journée de "+mo.nom+" reposée le "+JOUR.toLowerCase()+", "+DIT[demi]+".");
      return rendre();
    }
    if(b.hasAttribute("data-trouve")){
      var c=trouves()[+b.getAttribute("data-trouve")];
      etat.retenu=c; etat.saisie=c.nom; clearTimeout(minuteur);
      return rendre();
    }

    if(a==="poser-temps"){
      if(!pretTemps()) return; /* comme l'application : rien ne part, aucun message */
      etat.enCours=true; rendre();
      setTimeout(function(){
        var nom=etat.quoi.trim().slice(0,120), q=etat.quand;
        poserSurLeJour(nom, "", q);
        note("Temps bloqué « "+nom+" » le "+JOUR.toLowerCase()+", "+DIT[q]+" (sans client, sans prix).");
        etat.ouvert=null; remiseAZeroGeste(); rendre();
      }, 600);
      return;
    }
    if(a==="poser-client"){
      if(!pretClient()) return; /* comme l'application : rien ne part, aucun message */
      var estInconnu=inconnu();
      etat.enCours=true; rendre();
      setTimeout(function(){
        var nom=(etat.retenu?etat.retenu.nom:etat.saisie).trim();
        var existant=etat.carnet.find(function(x){return sansAccent(x.nom)===sansAccent(nom) || sansAccent(x.affiche)===sansAccent(nom);});
        var q=etat.quand, affiche, lieu;
        if(existant){
          affiche=existant.affiche; lieu=existant.adresse.split(", ").pop();
          note("Fiche de "+existant.affiche+" reprise, rien n'y est changé.");
        } else {
          var f=estInconnu?etat.fiche:{telephone:"",email:"",adresse:""};
          var gardes=[], vides=[];
          [["telephone","téléphone"],["email","e-mail"],["adresse","adresse"]].forEach(function(p){
            var v=(f[p[0]]||"").trim();
            if(v) gardes.push(p[1]+" "+v); else vides.push(p[1]);
          });
          var neuf={nom:nom, affiche:"Mr. "+nom, tel:(f.telephone||"").trim(), adresse:(f.adresse||"").trim()};
          etat.carnet.push(neuf);
          affiche=neuf.affiche; lieu=neuf.adresse?neuf.adresse.split(", ").pop():"";
          note("Fiche client créée : "+nom+(gardes.length?", "+gardes.join(", "):"")+"."+(vides.length?" Rien de gardé pour : "+vides.join(", ")+".":""));
        }
        poserSurLeJour(affiche, lieu, q);
        note("Chantier "+affiche+" posé le "+JOUR.toLowerCase()+", "+DIT[q]+" (sans devis, sans prix).");
        etat.ouvert=null; remiseAZeroGeste(); rendre();
      }, 600);
      return;
    }
  });

  carteEl.addEventListener("input", function(e){
    var t=e.target;
    if(t.id==="nomclient"){
      etat.saisie=t.value; etat.retenu=null; etat.refus=null;
      rendre(); lancerRecherche(); return;
    }
    if(t.id==="quoi"){ etat.quoi=t.value; rendre(); return; }
    if(t.hasAttribute("data-fiche")){ etat.fiche[t.getAttribute("data-fiche")]=t.value; return; }
  });

  document.getElementById("recommencer").addEventListener("click", function(){ clearTimeout(minuteur); depart(); rendre(); });

  depart(); rendre();
})();
</script>
</body>
</html>
