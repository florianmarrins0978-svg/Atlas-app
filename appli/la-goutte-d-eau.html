<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — La goutte d'eau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<!--
  ————————————————————————————————————————————————————————————————————————
  LA GOUTTE D'EAU — maquette ESSAYABLE, rien n'est codé
  ————————————————————————————————————————————————————————————————————————

  Votre demande du 2 septembre 2026 : « je veux que la première page soit
  dynamique : une animation d'une goutte d'eau qui tombe, qu'on suivrait en
  la regardant tomber en tournant autour d'elle à la troisième personne ;
  elle arrive sur le rond de créer un chantier et hop, ça laisse apparaître
  la page entière de l'application — l'original. »

  DONC :

    · la goutte naît au bout de la feuille Atlas, se détache, et tombe ;
    · la caméra la suit de près et TOURNE autour d'elle pendant la chute —
      le ciel, la brume et la page en dessous pivotent, la goutte reste
      devant nous ;
    · elle s'écrase exactement sur le rond doré de « Créer un devis » —
      l'impact APPUIE le bouton : le signe tourne et la gerbe d'or part,
      comme dans l'application ;
    · l'éclaboussure révèle la page entière, en cercle, depuis le rond.

  LA PAGE EST L'ORIGINAL : charte Origine, Playfair et Inter, le mot et son
  rond (mesures reprises de l'application au pixel), le fil, les onglets.
  Rien n'y est redessiné. Les trois chantiers sont de la démonstration.

  Toucher l'écran pendant la chute saute à la page. « Revoir » rejoue.
  Sous « mouvement réduit », la page s'affiche directement.
  ————————————————————————————————————————————————————————————————————————
-->
<style>
  :root{
    /* La charte Origine, relevée de `design-tokens.ts` — aucune invention. */
    --cream:#f5f3ee;
    --card:#faf9f5;
    --ink:#1c1c1a;
    --ink-soft:#4a4a44;
    --muted:#8a8578;
    --pin:#2f3b2f;
    --or:#B98B47;
    --line:rgba(28,28,26,.12);
    --display:'Playfair Display', Georgia, serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:var(--body);
    color:var(--ink);
    background:var(--cream);
    overflow:hidden;
  }
  ::selection{ background:rgba(185,139,71,.25); }

  /* ════════════════════════ LE CINÉMA ═══════════════════════════════ */

  #cinema{
    position:fixed; inset:0; z-index:10;
    /* Le ciel du matin au-dessus d'un jardin : la lumière de la charte. */
    background:
      radial-gradient(90% 55% at 50% 0%, rgba(185,139,71,.10), transparent 60%),
      linear-gradient(180deg, #faf8f3, #efebe1 75%, #eae5d9);
    perspective:1100px;
    /* TOUT le cinéma est ancré sur le rond RÉEL de la page révélée
       (--rx/--ry, mesurés au chargement) : la goutte tombe, frappe et la
       page éclot au même point — trois ancres, un seul geste. */
    perspective-origin:var(--rx,50%) var(--ry,42%);
    opacity:1;
    transition:opacity .5s;
  }
  body.revele #cinema{ opacity:0; }
  body.pose #cinema{ display:none; }

  /* Le monde entier pivote autour de la goutte : c'est la caméra qui
     tourne, à la troisième personne. La goutte, elle, reste devant nous. */
  #camera{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    /* L'axe de l'orbite passe par l'ANCRE — laissé au centre de l'écran,
       le monde entier arrivait décalé de deux cents pixels à l'impact. */
    transform-origin:var(--rx,50%) var(--ry,42%);
    transform:rotateX(4deg);
  }
  body.joue #camera{
    animation:camera-orbite 3.25s cubic-bezier(.4,.08,.3,1) both;
  }
  /* Un tour complet, arrivée à l'aplomb. L'inclinaison est NÉGATIVE, et ce
     n'est pas un détail : positive, elle place la caméra sous le sol — la
     page ne se montrait que par son dos, en miroir, quel que soit l'azimut
     (payé en trois captures : 322°, 360° et 540° y sont tous passés). */
  @keyframes camera-orbite{
    0%,26%{ transform:rotateX(-4deg)  rotateY(0deg); }
    55%   { transform:rotateX(-24deg) rotateY(132deg); }
    80%   { transform:rotateX(-54deg) rotateY(264deg); }
    100%  { transform:rotateX(-88deg) rotateY(360deg); }
  }

  /* La chute est rendue par le monde qui MONTE : brume, feuille et page
     remontent pendant que la goutte demeure au centre du regard. */
  #ascension{
    position:absolute; left:var(--rx,50%); top:var(--ry,42%);
    transform-style:preserve-3d;
  }
  body.joue #ascension{
    animation:monde-monte 3.25s cubic-bezier(.5,.06,.3,1) both;
  }
  /* Exactement l'opposé du départ de la feuille (1058) — un résidu de
     30 px avait déjà décalé le point d'impact une première fois. */
  @keyframes monde-monte{
    0%,27%{ transform:translateY(0); }
    100%  { transform:translateY(-1058px); }
  }

  /* La feuille Atlas — le tracé exact de `MarqueAtlas.tsx`. La goutte
     naît à sa pointe, puis la feuille s'éloigne vers le haut. */
  #feuille{
    position:absolute; left:-52px; top:-172px;
    width:104px; height:104px;
    color:var(--pin);
  }
  /* Une fois la goutte détachée, la feuille sort de l'histoire : montée
     derrière la caméra, elle traverserait le cadre en silhouette géante. */
  body.joue #feuille{ animation:feuille-sefface 3.25s linear both; }
  @keyframes feuille-sefface{
    0%,32%{ opacity:1; }
    46%,100%{ opacity:0; }
  }

  /* Les nappes de brume : ce sont elles qui donnent le tour de caméra —
     elles orbitent et défilent, la goutte non. */
  .brume{
    position:absolute;
    border-radius:9999px;
    background:radial-gradient(closest-side, rgba(255,255,255,.85), rgba(255,255,255,0));
    filter:blur(14px);
  }
  /* Près du sol il n'y a plus de brume — montée derrière la caméra, une
     nappe voilait toute la moitié basse de la page à l'impact. */
  body.joue .brume{ animation:brume-sefface 3.25s linear both; }
  @keyframes brume-sefface{
    0%,62%{ opacity:1; }
    80%,100%{ opacity:0; }
  }

  /* ── La page, couchée en dessous, qui approche ─────────────────────── */
  /* Plus grande que la page qu'elle porte : la page, décalée pour poser
     son rond au centre du plan, ne doit jamais déborder de la feuille —
     sinon des bandes de ciel se découvrent au dernier instant. */
  #plaque{
    position:absolute; left:-295px; top:-572px;
    width:590px; height:1144px;
    /* Sa propre couche, rasterisée ENTIÈRE : sans cela, Chromium peint le
       plan une fois, cadré sur un instant du vol, et le bas de la page
       n'existe pas à l'arrivée (payé en trois sondes du DOM). */
    will-change:transform;
    /* 1058, pas 858 : partie plus haut, la feuille perçait le bas du cadre
       dès la première seconde — la page n'entre en scène qu'appelée. */
    transform:translateY(1058px) rotateX(90deg);
    transform-style:flat;
    background:var(--cream);
    border-radius:22px;
    box-shadow:0 30px 70px rgba(28,28,26,.28), 0 0 0 1px var(--line);
    overflow:hidden;
  }
  /* Le décalage qui pose le ROND — pas le centre de la page — sous la
     goutte. Mesuré au chargement, jamais estimé. */
  #plaque .cale{ transform:translate(var(--dx,0px), var(--dy,0px)); }
  /* La page ENCAISSE l'impact : un tassement d'un souffle sous la goutte.
     Sans lui, l'appui se voit mais ne se sent pas. */
  body.eclate #plaque .cale{ animation:page-encaisse .3s cubic-bezier(.33,.66,.33,1) both; }
  @keyframes page-encaisse{
    0%,100%{ transform:translate(var(--dx,0px), var(--dy,0px)); }
    45%    { transform:translate(var(--dx,0px), calc(var(--dy,0px) + 2px)) scale(.997); }
  }

  /* L'ombre portée de la goutte, qui grandit à l'approche de la page. */
  #ombre{
    position:absolute; left:295px; top:572px;
    width:54px; height:54px; margin:-27px 0 0 -27px;
    border-radius:9999px;
    background:radial-gradient(closest-side, rgba(28,28,26,.30), rgba(28,28,26,0));
    opacity:0; transform:scale(.2);
  }
  body.joue #ombre{ animation:ombre-vient 3.25s cubic-bezier(.5,.06,.3,1) both; }
  @keyframes ombre-vient{
    0%,45%{ opacity:0; transform:scale(2.6); }
    85%   { opacity:.35; }
    100%  { opacity:.85; transform:scale(.62); }
  }

  /* ── La goutte — en avant du monde, toujours face à nous ───────────── */
  #goutte{
    position:absolute; left:var(--rx,50%); top:var(--ry,42%); z-index:3;
    width:54px; height:54px; margin:-27px 0 0 -27px;
    pointer-events:none;
    opacity:0;
  }
  /* De l'eau, pas un œuf : le centre est transparent et RÉFRACTE ce qui
     est derrière (la page qui approche se lit à travers la goutte), la
     matière ne vit que sur le bord, et l'or de la charte s'y accroche. */
  #goutte .eau{
    position:absolute; inset:0;
    border-radius:50% 50% 52% 48% / 58% 58% 44% 42%;
    background:
      radial-gradient(32% 24% at 32% 22%, rgba(255,255,255,.95), rgba(255,255,255,0) 72%),
      radial-gradient(22% 16% at 67% 79%, rgba(185,139,71,.38), rgba(185,139,71,0) 78%),
      radial-gradient(closest-side, rgba(255,255,255,.05) 50%, rgba(168,168,148,.35) 72%, rgba(110,112,92,.66) 89%, rgba(70,72,58,.78));
    box-shadow:
      inset 0 -6px 10px rgba(47,59,47,.26),
      inset 0 3px 6px rgba(255,255,255,.6),
      0 0 0 1px rgba(94,96,80,.3),
      0 8px 20px rgba(28,28,26,.16);
    backdrop-filter:blur(1.6px) saturate(1.2) brightness(1.05);
    -webkit-backdrop-filter:blur(1.6px) saturate(1.2) brightness(1.05);
  }
  /* La lentille : une goutte réelle retourne et grossit ce qu'elle
     survole. Pendant l'approche, le rond doré monte dans la goutte —
     inversé, de plus en plus grand, jusqu'à l'impact. */
  #goutte .lentille{
    position:absolute; inset:5px;
    border-radius:9999px;
    overflow:hidden;
    transform:rotate(180deg) scale(.4);
    opacity:0;
  }
  .lentille .mini{
    position:absolute; left:50%; top:50%;
    width:32px; height:32px; margin:-16px 0 0 -16px;
    border-radius:9999px;
    background:var(--card);
    border:1.5px solid var(--or);
    box-shadow:0 0 0 4px rgba(250,249,245,.9);
  }
  /* Le signe est le SVG du bouton, cloné — jamais un glyphe de police. */
  .lentille .mini svg{ position:absolute; inset:5px; width:22px; height:22px; }
  body.joue #goutte .lentille{ animation:lentille-voit 3.25s linear both; }
  @keyframes lentille-voit{
    0%,58%{ opacity:0; transform:rotate(180deg) scale(.35); }
    80%   { opacity:.6; }
    100%  { opacity:.85; transform:rotate(180deg) scale(1.05); }
  }
  body.joue #goutte{ animation:goutte-vit 3.25s linear both; }
  @keyframes goutte-vit{
    /* Elle perle à la POINTE de la feuille… */
    0%    { opacity:0; transform:translateY(-84px) scale(.14); }
    8%    { opacity:1; }
    22%   { transform:translateY(-76px) scale(.5)  scaleY(1.35); }
    /* …s'étire, se détache… */
    27%   { transform:translateY(-64px) scale(.72) scaleY(1.24); }
    /* …et tombe : le fil de l'air l'étire, l'oscillation la fait vivre. */
    40%   { transform:translateY(-4px)  scale(1)   scaleY(1.14) scaleX(.94); }
    55%   { transform:translateY(0)      scale(1.04) scaleY(.96) scaleX(1.05); }
    70%   { transform:translateY(0)      scale(1.04) scaleY(1.1)  scaleX(.95); }
    86%   { transform:translateY(0)      scale(1.06) scaleY(1.02) scaleX(1.02); }
    100%  { transform:translateY(16px)   scale(1.08) scaleY(1.12) scaleX(.96); }
  }
  body.eclate #goutte{ display:none; }

  /* ── L'impact ──────────────────────────────────────────────────────── */
  #impact{
    position:absolute; left:var(--rx,50%); top:var(--ry,42%); z-index:4;
    width:0; height:0;
    pointer-events:none;
    display:none;
  }
  body.eclate #impact{ display:block; }
  /* La couronne d'eau qui s'aplatit… */
  #impact .couronne{
    position:absolute; left:-38px; top:-13px;
    width:76px; height:26px;
    border-radius:9999px;
    border:2px solid rgba(243,236,220,.95);
    border-bottom-color:transparent;
    animation:couronne-part .5s cubic-bezier(.16,.68,.3,1) both;
  }
  @keyframes couronne-part{
    0%  { transform:scale(.25); opacity:.95; }
    60% { opacity:.55; }
    100%{ transform:scale(1.45) scaleY(.5); opacity:0; }
  }
  /* …et les gouttelettes balistiques : elles montent, puis retombent. */
  #impact i{
    position:absolute; left:0; top:0;
    width:var(--g); height:var(--g);
    margin:calc(var(--g)/-2) 0 0 calc(var(--g)/-2);
    border-radius:9999px;
    /* La lumière du monde, pas celle d'un lavabo : blanc chaud et or. */
    background:radial-gradient(circle at 32% 28%, #ffffff, #f2ead8 55%, rgba(185,139,71,.6));
    animation:gouttelette .55s cubic-bezier(.3,.5,.6,1) both;
    animation-delay:var(--t);
  }
  @keyframes gouttelette{
    0%  { transform:translate(0,0) scale(.4); opacity:0; }
    12% { opacity:1; }
    45% { transform:translate(calc(var(--x)*.8), var(--y)) scale(1); opacity:1; }
    100%{ transform:translate(var(--x), calc(var(--y)*.15 + 26px)) scale(.6); opacity:0; }
  }

  /* ════════════════════ LA PAGE — L'ORIGINAL ════════════════════════ */

  #app{
    position:fixed; inset:0; z-index:5;
    display:flex; justify-content:center;
    background:var(--cream);
    visibility:hidden;
  }
  body.revele #app{
    visibility:visible;
    clip-path:circle(30px at var(--rx,50%) var(--ry,32%));
    animation:page-parait .75s cubic-bezier(.22,.61,.36,1) .08s both;
  }
  @keyframes page-parait{
    to{ clip-path:circle(142% at var(--rx,50%) var(--ry,32%)); }
  }
  body.pose #app{ visibility:visible; clip-path:none; animation:none; }

  /* Les deux ronds d'eau qui finissent de s'éteindre sur la page. */
  .ricochet{
    position:absolute; left:var(--rx,50%); top:var(--ry,32%); z-index:6;
    width:42px; height:42px; margin:-21px 0 0 -21px;
    border-radius:9999px;
    border:1px solid rgba(185,139,71,.55);
    opacity:0;
    pointer-events:none;
  }
  body.revele .ricochet{ animation:ricochet 1.1s cubic-bezier(.16,.7,.3,1) both; }
  body.revele .ricochet + .ricochet{ animation-delay:.22s; }
  @keyframes ricochet{
    0%  { transform:scale(.6); opacity:.8; }
    100%{ transform:scale(3.4); opacity:0; }
  }
  body.pose .ricochet{ display:none; }

  .ecran{
    position:relative;
    width:100%; max-width:430px;
    height:100dvh; min-height:600px;
    display:flex; flex-direction:column;
    background:var(--cream);
  }

  .ecran .marque{
    padding-top:26px;
    text-align:center;
    font-size:11px; letter-spacing:.52em; text-indent:.52em;
    color:var(--ink);
  }

  .ecran .tete{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding:34px 26px 0;
  }
  .ecran h1{
    margin-top:14px;
    font-family:var(--display); font-weight:400;
    font-size:36px; line-height:1.02; letter-spacing:-.018em;
    white-space:nowrap;
  }
  .ecran .assistant{
    margin-top:14px; flex:none;
    width:44px; height:44px;
    display:grid; place-items:center;
    border-radius:9999px; border:none; cursor:pointer;
    background:var(--pin);
  }
  .ecran .clients{
    display:inline-flex; align-items:center; gap:6px;
    margin:10px 26px 0;
    font-size:9.5px; font-weight:500; letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--or); text-decoration:none;
  }
  .ecran .clients i{
    width:5px; height:5px; transform:rotate(45deg);
    border-right:1.5px solid var(--or); border-top:1.5px solid var(--or);
  }

  /* Le mot et son rond — les mesures de `globals.css`, au pixel. */
  .geste{
    display:flex; justify-content:center;
    padding:22px 26px 2px;
  }
  .atlas-geste-nouveau{
    display:flex; align-items:center; justify-content:center; gap:13px;
    text-decoration:none; color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .atlas-mot{
    font-size:13px; font-weight:800; letter-spacing:.22em;
    text-transform:uppercase; white-space:nowrap;
    transition:letter-spacing .62s cubic-bezier(.22,.61,.36,1);
  }
  [data-geste="part"] .atlas-mot{ letter-spacing:.32em; }
  .atlas-rond{
    position:relative;
    display:grid; place-items:center;
    width:42px; height:42px; border-radius:9999px;
  }
  .atlas-cerne{ position:absolute; inset:0; z-index:2; border-radius:9999px; border:1px solid var(--line); }
  .atlas-signe{ position:relative; z-index:4; display:block; width:20px; height:20px; }
  .atlas-pouls{
    position:absolute; inset:0; z-index:1; border-radius:9999px;
    border:1px solid var(--or); opacity:0;
    animation:atlas-battement 3.4s cubic-bezier(.16,.7,.3,1) infinite;
  }
  @keyframes atlas-battement{
    0%{ transform:scale(1); opacity:0; }
    8%{ opacity:.5; }
    46%,100%{ transform:scale(1.42); opacity:0; }
  }
  [data-geste="part"] .atlas-pouls{ animation:none; opacity:0; }
  [data-geste="part"] .atlas-signe{ animation:atlas-tour .56s cubic-bezier(.16,.74,.22,1) both; }
  @keyframes atlas-tour{
    0%{ transform:rotate(0); }
    14%{ transform:rotate(120deg); }
    100%{ transform:rotate(1080deg); }
  }
  .atlas-gerbe{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .atlas-gerbe i{
    position:absolute; left:50%; top:50%;
    width:var(--l); height:var(--l);
    margin:calc(var(--l)/-2) 0 0 calc(var(--l)/-2);
    border-radius:9999px; background:var(--or); opacity:0;
  }
  [data-geste="part"] .atlas-gerbe i{
    animation:atlas-grain .56s cubic-bezier(.16,.68,.3,1) both;
    animation-delay:var(--t);
  }
  @keyframes atlas-grain{
    0%{ transform:translate(calc(var(--x)*.46), calc(var(--y)*.46)) scale(.4); opacity:0; }
    16%,64%{ opacity:1; }
    100%{ transform:translate(var(--x), var(--y)) scale(.7); opacity:0; }
  }

  .compteur{
    display:flex; align-items:baseline; gap:10px;
    margin:30px 26px 4px;
    font-size:9.5px; font-weight:500; letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .compteur b{
    font-size:12px; font-weight:700; letter-spacing:.06em;
    color:var(--ink); font-variant-numeric:tabular-nums;
  }

  .fil{
    position:relative;
    flex:1; min-height:0; overflow-y:auto;
    padding:10px 0 84px;
  }
  .fil::before{
    content:"";
    position:absolute; top:0; bottom:0; left:47px;
    width:1px; background:var(--line);
  }
  .brin{
    position:relative;
    display:grid; grid-template-columns:47px 1fr;
    padding:14px 26px 14px 0;
    text-decoration:none; color:inherit;
  }
  .brin .quand{
    text-align:right; padding-right:13px;
    font-size:9.5px; font-weight:500; letter-spacing:.28em;
    text-transform:uppercase; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .brin .quand b{
    display:block;
    font-family:var(--display); font-weight:400;
    font-size:19px; line-height:1; color:var(--ink);
  }
  .brin .quand span{ display:block; margin-top:4px; }
  .brin .corps{ padding-left:17px; min-width:0; }
  .brin .corps > span{ display:block; }
  .brin .nom{ font-size:16.5px; font-weight:500; }
  .brin .lieu{
    margin-top:2px; font-size:13px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brin .etat{
    margin-top:6px;
    font-size:9.5px; font-weight:500; letter-spacing:.22em;
    text-transform:uppercase; color:var(--muted);
  }
  .brin.attend .etat{ color:var(--or); }
  .brin .precision{ margin-top:2px; font-size:12.5px; color:var(--ink-soft); }
  /* La perle : le seul point de couleur de la liste. */
  .perle{
    position:absolute; left:44px; top:50%;
    width:7px; height:7px; margin-top:-3.5px;
    border-radius:9999px; background:var(--or);
    box-shadow:0 0 0 3px var(--cream);
  }

  .onglets{
    position:absolute; left:0; right:0; bottom:0;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:12px 0 max(14px, env(safe-area-inset-bottom));
  }
  .onglets a{
    flex:1; text-align:center; text-decoration:none;
    font-size:9.5px; font-weight:500; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);
  }
  .onglets a[aria-current]{ color:var(--pin); font-weight:700; }

  /* ── Revoir ────────────────────────────────────────────────────────── */
  /* Ancré dans la page, en coin bas au-dessus de la barre — jamais
     flottant au bord de la fenêtre sur grand écran. */
  #revoir{
    position:absolute; right:14px; bottom:56px; z-index:7;
    background:none; border:none; cursor:pointer;
    font-family:var(--body);
    font-size:9.5px; font-weight:500; letter-spacing:.28em; text-indent:.28em;
    text-transform:uppercase; color:var(--muted);
    padding:10px 6px;
    display:none;
  }
  body.pose #revoir{ display:block; }

  @media (prefers-reduced-motion: reduce){
    #camera, #ascension, #goutte, #ombre, #app, .ricochet,
    .atlas-pouls, [data-geste="part"] .atlas-signe, [data-geste="part"] .atlas-gerbe i{
      animation:none !important;
    }
    .atlas-gerbe{ display:none; }
  }

<script>
  // ── La page est UNE : le même gabarit sert la plaque du cinéma et la
  //    page révélée. Deux copies écrites à la main auraient divergé.
  const gabarit = document.getElementById('gabarit-ecran');
  const app = document.getElementById('app');
  const cale = document.getElementById('cale');
  const corps = document.body;

  const ecranApp = gabarit.content.cloneNode(true).firstElementChild;
  app.appendChild(ecranApp);
  const ecranPlaque = gabarit.content.cloneNode(true).firstElementChild;
  ecranPlaque.style.height = '744px';
  cale.appendChild(ecranPlaque);
  // « Revoir » vit DANS la page : ancré à sa colonne, pas au bord de la
  // fenêtre — sur grand écran il flottait dans le vide.
  ecranApp.appendChild(document.getElementById('revoir'));

  // ── Poser le ROND sous la goutte : mesuré, jamais estimé.
  function viser(){
    // Sur la plaque : décaler la page pour que le centre du rond soit au
    // centre du plan — c'est là que la goutte tombe.
    const rondP = ecranPlaque.querySelector('.atlas-rond');
    let x = 21, y = 21, n = rondP;
    while (n && n !== ecranPlaque){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    cale.style.setProperty('--dx', (295 - x) + 'px');
    cale.style.setProperty('--dy', (572 - y) + 'px');

    // Le rond RÉEL de la page révélée : la goutte, l'impact, l'éclosion et
    // la perspective du cinéma s'ancrent tous sur ce point — posé sur
    // <body>, chacun l'hérite.
    const r = ecranApp.querySelector('.atlas-rond').getBoundingClientRect();
    corps.style.setProperty('--rx', (r.left + r.width/2) + 'px');
    corps.style.setProperty('--ry', (r.top + r.height/2) + 'px');
  }

  // ── Le déroulé. Les minuteries s'annulent au rejeu.
  let minuteries = [];
  const plus = (fn, ms) => minuteries.push(setTimeout(fn, ms));

  function jouer(){
    minuteries.forEach(clearTimeout); minuteries = [];
    corps.classList.remove('joue','eclate','revele','pose');
    ecranApp.querySelector('[data-rond]').removeAttribute('data-geste');
    void corps.offsetWidth; // repartir de zéro, animations comprises
    viser();
    corps.classList.add('joue');
    // L'impact : la goutte éclate…
    plus(() => corps.classList.add('eclate'), 3250);
    // …elle a APPUYÉ le bouton : le signe tourne, la gerbe d'or part,
    // et la page éclot depuis le rond.
    plus(() => {
      corps.classList.add('revele');
      ecranApp.querySelector('[data-rond]').setAttribute('data-geste','part');
    }, 3450);
    plus(() => ecranApp.querySelector('[data-rond]').removeAttribute('data-geste'), 4390);
    plus(() => corps.classList.add('pose'), 4400);
  }

  function poserDirectement(){
    minuteries.forEach(clearTimeout); minuteries = [];
    corps.classList.remove('joue','eclate');
    viser();
    corps.classList.add('revele','pose');
  }

  // Toucher le ciel pendant la chute saute à la page : personne n'est
  // obligé de regarder la goutte deux fois.
  document.getElementById('cinema').addEventListener('pointerdown', poserDirectement);
  document.getElementById('revoir').addEventListener('click', jouer);

  if (matchMedia('(prefers-reduced-motion: reduce)').matches){
    poserDirectement();
  } else {
    jouer();
  }
</script>
