<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Atlas, film D, le coup de poing</title>
<link rel="stylesheet" href="polices/polices.css">
<style>
  /*
    LE FILM D, VERSION « LE COUP DE POING » (nerveuse) : 128 à la noire, de
    bout en bout.

    Sa demande du 5 octobre 2026 : deux films distincts, nerveux et récit ;
    et pour celui-ci, « accentuer qu'avant d'utiliser l'appli on se sent
    stressé, tout va vite, on perd du temps ; et avec l'appli on en gagne ».
    Ses deux reproches au premier montage valent ici aussi : le téléphone
    EN ENTIER, et la dictée visible, avec l'autre chemin, « Je rédige à la
    main ».

    La courbe :
      · le STRESS (0 à 4,7 s) : une coupe par temps, les mots qui frappent
        (le soir, les devis à retaper, la TVA, les gars, les papiers, 20
        minutes), puis les mêmes mots qui reviennent au demi-temps, puis au
        quart de temps, la caméra qui tremble de plus en plus ; un noir ;
      · « 30 » claque, le téléphone claque, ENTIER, et il le reste : chaque
        pilier arrive sur un temps avec un mot énorme au-dessus (RÉDIGEZ. OU
        DICTEZ. DEVIS. PRÊT. LE CLIENT. PRÉVENU. PLANNING. LES GARS. SANS
        VOUS APPELER. FACTURE. LA TVA. TAUX PAR TAUX. À DÉCLARER.), la
        caméra saute par crans dans l'écran et en ressort d'un coup ; même
        tempo qu'au début, mais une seule chose à la fois : c'est ça, le
        calme ;
      · le temps rendu, en chiffres : « 20 minutes » barré, « 30 secondes. »
        (docs/AGENT.md §1) ; puis « Le soir. » revient, et cette fois le
        téléphone est posé, éteint ;
      · la signature.

    Tout ce qui est dans le téléphone est une capture de l'application servie
    (film-D-contenu.js). Aucun prix.
  */
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#06070a}
  #scene{position:absolute;inset:0;overflow:hidden;background:#06070a}
  #fond{position:absolute;inset:0;z-index:0}
  #monde{position:absolute;left:0;top:0}
  .carte{position:absolute;left:0;right:0;top:0;height:1920px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 60px;text-align:center;opacity:0;will-change:transform,opacity}
  .carte .masse{font:400 300px/.9 'Film Masse';text-transform:uppercase;letter-spacing:-.01em}
  .carte .masse.deux{font-size:230px}
  #flash .masse{font-size:210px}
  #vingt{font-size:175px;white-space:nowrap}
  .carte .etroit{font:700 64px/1.1 'Film Etroit';text-transform:uppercase;letter-spacing:.08em;margin-top:30px}
  .noir{color:#f3efe6} .encre{color:#1c1c1a} .or{color:#C9A15E}
  #trente{position:absolute;left:0;right:0;top:30px;text-align:center;font:400 560px/.85 'Film Masse';color:#C9A15E;opacity:0;will-change:transform,opacity;letter-spacing:-.04em}
  #secondes{position:absolute;left:0;right:0;top:1640px;text-align:center;font:400 190px/1 'Film Masse';color:#f3efe6;opacity:0;will-change:transform,opacity}
  /* Les mots des piliers : la bande du haut (deux lignes au plus), la bande du bas (une ou deux lignes, plus petites). */
  .haut{position:absolute;left:0;right:0;top:0;height:400px;padding-top:34px;z-index:45;background:linear-gradient(180deg,rgba(6,7,10,.94) 0%,rgba(6,7,10,.9) 72%,rgba(6,7,10,0) 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;font:400 185px/.9 'Film Masse';text-transform:uppercase;letter-spacing:-.01em;opacity:0;will-change:transform,opacity}
  .bas{position:absolute;left:0;right:0;top:1580px;height:340px;padding-bottom:20px;z-index:45;background:linear-gradient(0deg,rgba(6,7,10,.94) 0%,rgba(6,7,10,.9) 72%,rgba(6,7,10,0) 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;font:400 150px/.9 'Film Masse';text-transform:uppercase;letter-spacing:-.01em;opacity:0;will-change:transform,opacity}
  #dictee{position:absolute;left:0;right:0;top:0;height:400px;padding-top:40px;z-index:45;background:linear-gradient(180deg,rgba(6,7,10,.94) 0%,rgba(6,7,10,.9) 72%,rgba(6,7,10,0) 100%);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 22px;padding:0 60px;font:400 74px/1.05 'Film Masse';text-transform:uppercase;color:#f3efe6;opacity:0}
  #dictee span{display:inline-block;will-change:transform,opacity}
  #barre{position:absolute;left:0;top:0;height:14px;background:#C9A15E;transform-origin:0 50%;opacity:0}
  #eclair{position:absolute;inset:0;background:#fff;opacity:0;z-index:70;pointer-events:none}
  #signature{position:absolute;left:0;right:0;top:0;height:1920px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 80px}
  #atlas{font:500 300px/1 'Film Editorial';color:#f3efe6;letter-spacing:-.02em;will-change:transform,opacity}
  #devise{font:italic 500 58px/1.25 'Film Editorial';color:rgba(243,239,230,.88);margin-top:44px}
  #essai{font:500 30px/1 'Film Sans';letter-spacing:.44em;text-transform:uppercase;color:#C9A15E;margin-top:90px}
</style>
</head>
<body>
<div id="scene">
  <div id="fond"></div>
  <div id="monde">
    <div id="lueur"></div>
    <div class="carte" id="c0"><p class="masse noir">Le soir.</p></div>
    <div class="carte" id="c1"><p class="masse encre">Les devis</p><p class="etroit encre">à retaper.</p></div>
    <div class="carte" id="c2"><p class="masse or">La TVA.</p></div>
    <div class="carte" id="c3"><p class="masse noir">Les gars</p><p class="etroit noir">qui appellent.</p></div>
    <div class="carte" id="c4"><p class="masse encre">Les papiers.</p></div>
    <div class="carte" id="c5"><p class="masse or deux">20 minutes</p><p class="etroit noir">de bureau après chaque visite de chantier.</p></div>
    <div class="carte" id="flash"><p class="masse deux"></p></div>
    <div class="carte" id="cVingt"><p class="masse encre" id="vingt">20 minutes</p><div id="barre"></div></div>
    <div class="carte" id="cTrente"><p class="masse or deux">30 secondes.</p></div>
    <div class="carte" id="cSoir"><p class="masse noir">Le soir.</p></div>
    <p id="trente">30</p>
    <p id="secondes">secondes.</p>
    <div id="objets"></div>
    <div id="signature"><p id="atlas">Atlas</p><p id="devise">Du devis dicté à la facture.</p><p id="essai">Essai gratuit 15 jours</p></div>
  </div>
  <div id="dictee"></div>
  <p class="haut" id="mHaut"></p>
  <p class="bas" id="mBas"></p>
  <div id="eclair"></div>
  <div id="etalonnage"></div>
  <div id="vignette"></div>
</div>
<script src="moteur-D.js"></script>
<script src="film-D-contenu.js"></script>
<script>
  const M = window.MoteurD, C = window.ContenuD;
  const { entre, mix, cles, lisse, sortie, sortieForte, expo, coup, borne, entreeSortie, $ } = M;
  const BPM = 128, TEMPS = 60 / BPM;
  // L'instant du temps n, calé sur une image : une coupe entre deux
  // sous-images de l'obturateur rend une image grise (vu sur la direction).
  const b = n => Math.round(n * TEMPS * 60) / 60;
  // Une coupe : la valeur ne bouge pas, puis saute. C'est la caméra de ce film.
  const saut = x => (x >= 1 ? 1 : 0);

  // ─── le découpage, sur les temps ────────────────────────────────────────
  const COUPES = [
    [0, 1, '#06070a', 'c0'], [1, 2, '#f5f3ee', 'c1'], [2, 3, '#2f3b2f', 'c2'],
    [3, 4, '#06070a', 'c3'], [4, 5, '#f5f3ee', 'c4'], [5, 7, '#2f3b2f', 'c5'],
  ];
  const FLASHES = [];
  { const mots = ['Retaper.', 'La TVA.', 'Les gars.', 'Les papiers.'];
    const fonds = [['#06070a', '#f3efe6'], ['#f5f3ee', '#1c1c1a'], ['#2f3b2f', '#C9A15E']];
    let k = 0;
    for (let n = 7; n < 9; n += .5) { FLASHES.push([b(n), b(n + .5), ...fonds[k % 3], mots[k % 4]]); k++; }
    for (let n = 9; n < 10; n += .25) { FLASHES.push([b(n), b(n + .25), ...fonds[k % 3], mots[k % 4]]); k++; }
  }
  const T_NOIR = b(10);
  const T_TEL = b(11);           // « 30 » et le téléphone claquent
  const T_SECONDES = b(12);
  const T_SAUT = b(13);          // trois crans vers « Créer un devis »
  const T_CREER = b(14);
  const T_FICHE = T_CREER + .15;
  const T_FICHE_ENTIERE = b(15); // la fiche, entière : le micro ET « Je rédige à la main »
  const T_REDIGE = b(16);        // « RÉDIGEZ. » : l'éditeur de lignes s'ouvre
  const T_EDITEUR = T_REDIGE + .15;
  const T_RETOUR = b(18);        // « OU DICTEZ. » : la fiche, deux crans vers le micro
  const T_MICRO = b(19);
  const T_DICTEE = b(20);        // les mots dictés, au quart de temps, dans la bande du haut
  const T_TRANSCRIT = b(25);     // la transcription, entière
  const T_FILE = b(26);          // le filé : la ligne du devis claque en bas
  const T_DEVIS = b(27);
  const T_PRET = b(28);
  const T_CLIENT = b(30);        // « LE CLIENT. »
  const T_DATE = b(31);
  const T_ACCEPTE = b(32);
  const T_NOTE = T_ACCEPTE + .15;
  const T_PREVENU = b(34);       // « PRÉVENU. » : votre accueil
  const T_VOL = b(36);           // la carte s'envole
  const T_PLANNING = b(37);      // elle se pose : « PLANNING. »
  const T_GARS = b(40);          // « LES GARS. » : le planning de Julien
  const T_OUVRE = b(41);
  const T_FICHE_G = T_OUVRE + .15;
  const T_ADRESSE = b(43);       // « L'ADRESSE. »
  const T_TRAVAUX = b(45);       // « LES TRAVAUX. »
  const T_SANS = b(47);          // « SANS VOUS APPELER. »
  const T_SOIR = b(50);          // « FACTURE. »
  const T_FACTURE = b(51);
  const T_FACT_GL = T_FACTURE + .15;
  const T_REPREND = b(52);       // « REPREND LE DEVIS. »
  const T_TOTAUX = b(54);
  const T_LA_TVA = b(55);        // « LA TVA. »
  const T_TVA = b(56);           // la ligne devient la table du PDF
  const T_TAUX = b(57);          // « TAUX PAR TAUX. »
  const T_DECLARE = b(59);       // la table devient « Ma TVA à déclarer »
  const T_A_DECLARER = b(60);    // « À DÉCLARER. »
  const T_NOIR_2 = b(63);        // un noir, un silence
  const T_VINGT = b(64);         // « 20 minutes », barré
  const T_TRENTE = b(66);        // « 30 secondes. »
  const T_SOIR_2 = b(68);        // « Le soir. » : le téléphone posé, éteint
  const T_SIGN = b(71);
  const T_DEVISE = b(73);
  const T_ESSAI = b(75);
  const DUREE = b(79);

  const scene = M.creerScene();
  const matiere = M.creerMatiere();
  const tel = M.creerTelephone({ parent: $('objets'), teinte: 'graphite', ecrans: C.ECRANS });
  const BANDES = C.PRISES.map((_, i) => {
    const img = new Image(); img.src = `dictee/bande-${i}.jpg`; img.alt = '';
    img.style.cssText = `position:absolute;left:0;top:${600 * M.K}px;width:620px;z-index:1500;opacity:0`;
    tel.ecran.appendChild(img); return img;
  });
  // Le téléphone ENTIER, un peu plus petit que dans le récit : la bande du
  // haut porte les mots, celle du bas aussi. 424 px en haut, 1616 en bas.
  const TEL_Y = 1020, ECHELLE = .86;

  const D = C.DEFILEMENTS, P = C.POINTS, R = C.REGARDS, Z = C.ZONES;
  const ECRANS = [
    ['accueil-avant', T_TEL - .1, T_FICHE + .5, 'net'],
    ['fiche-reconnue', T_FICHE, T_EDITEUR + .5, 'monte'],
    ['devis-redige', T_EDITEUR, T_RETOUR, 'glisse'],
    ['fiche-reconnue', T_RETOUR, T_MICRO + .5, 'net'],
    ['enregistre', T_MICRO + .12, T_TRANSCRIT + .3, 'net'],
    ['transcription', T_TRANSCRIT - .1, T_CLIENT, 'glisse'],
    ['client-date', T_CLIENT, T_NOTE + .5, 'net'],
    ['client-accepte', T_NOTE, T_PREVENU, 'glisse'],
    ['accueil', T_PREVENU, T_VOL + .9, 'net'],
    ['planning', T_VOL + .35, T_GARS, 'glisse', [[0, D.planning]]],
    ['planning-salarie', T_GARS, T_FICHE_G + .5, 'net'],
    ['fiche-salarie', T_FICHE_G, T_SOIR, 'monte', [[T_FICHE_G, D.ficheAuPlanning], [T_ADRESSE - .3, D.ficheAuPlanning], [T_ADRESSE, D.ficheAdresse, entreeSortie], [T_TRAVAUX - .3, D.ficheAdresse], [T_TRAVAUX, D.ficheTravaux, entreeSortie]]],
    ['facture-avant', T_SOIR, T_FACT_GL + .5, 'net'],
    ['facture', T_FACT_GL, T_DECLARE + .3, 'glisse', [[T_TOTAUX - .3, 0], [T_TOTAUX, D.factureTotaux, entreeSortie]]],
    ['termines', T_DECLARE - .3, T_NOIR_2, 'glisse'],
  ];
  const APPUIS = [
    [T_CREER, ...P.creerUnDevis], [T_REDIGE, ...P.jeRedige], [T_MICRO, ...P.micro],
    [T_DATE, ...P.leMardi13], [T_ACCEPTE, ...P.jAccepte],
    [T_OUVRE, ...P.chantierDeJulien], [T_FACTURE, ...P.creerLaFacture],
  ];
  const REPERES = [[T_FICHE_ENTIERE + .1, T_REDIGE - .05, ...C.REPERES.jeRedige], [T_RETOUR + .1, T_MICRO - .05, ...C.REPERES.micro]];

  // Les mots des piliers : [instant, fin, texte, couleur, bande]
  const MOTS_PILIERS = [
    [T_REDIGE, T_RETOUR, 'Rédigez.', '#f3efe6', 'haut'],
    [T_RETOUR, T_DICTEE, 'Ou dictez.', '#C9A15E', 'haut'],
    [T_DEVIS, T_PRET, 'Devis.', '#C9A15E', 'haut'],
    [T_PRET, T_CLIENT, 'Prêt.', '#f3efe6', 'haut'],
    [T_CLIENT, T_ACCEPTE + .6, 'Le client.', '#f3efe6', 'haut'],
    [T_PREVENU, T_VOL, 'Prévenu.', '#C9A15E', 'haut'],
    [T_PLANNING, T_GARS, 'Planning.', '#f3efe6', 'haut'],
    [T_GARS, T_ADRESSE, 'Les gars.', '#C9A15E', 'haut'],
    [T_ADRESSE + .3, T_TRAVAUX, "L'adresse.", '#f3efe6', 'bas'],
    [T_TRAVAUX + .3, T_SANS, 'Les travaux.', '#f3efe6', 'bas'],
    [T_SANS, T_SOIR, 'Sans vous appeler.', '#C9A15E', 'haut'],
    [T_SOIR, T_REPREND, 'Facture.', '#f3efe6', 'haut'],
    [T_REPREND, T_LA_TVA, 'Reprend le devis.', '#f3efe6', 'haut'],
    [T_LA_TVA, T_TAUX, 'La TVA.', '#C9A15E', 'bas'],
    [T_TAUX, T_A_DECLARER, 'Taux par taux.', '#C9A15E', 'bas'],
    [T_A_DECLARER, T_NOIR_2, 'À déclarer.', '#f3efe6', 'bas'],
  ];
  const MOTS = [];
  { let k = 0;
    for (const brut of C.DICTEE.split(' ')) {
      if (brut === ':') continue;
      MOTS.push([T_DICTEE + k * TEMPS / 4, brut.replace(/[,:.]$/, '')]); k++;
    } }
  const dictee = $('dictee');
  dictee.innerHTML = MOTS.map(([, m]) => `<span>${m}</span>`).join('');
  const spansMots = [...dictee.querySelectorAll('span')];

  const cartes = COUPES.map(c => $(c[3]));
  const motsCartes = cartes.map(c => M.decouper(c.querySelector('.masse'), 'mots'));
  const flash = $('flash'), flashMot = flash.querySelector('.masse');
  const motsVingt = M.decouper($('vingt'), 'mots');
  const motsTrente = M.decouper($('cTrente').querySelector('.masse'), 'mots');
  const motsSoir = M.decouper($('cSoir').querySelector('.masse'), 'mots');
  const lettresAtlas = M.decouper($('atlas'), 'lettres');
  const motsDevise = M.decouper($('devise'), 'mots');
  const essai = $('essai');

  const ligne = M.creerMorceau({ parent: $('objets'), de: Z.ligneDuDevis, vers: Z.ligneDuDevis });
  const raccordPlanning = M.creerMorceau({ parent: $('objets'), de: Z.notification, vers: Z.cartePlanning });
  const raccordTva = M.creerMorceau({ parent: $('objets'), de: Z.ligneTva, vers: Z.tableTva });
  const raccordDeclare = M.creerMorceau({ parent: $('objets'), de: Z.tableTva, vers: Z.carteTva });
  const centreZone = (z, defile = 0) => ({ x: (z.zone[0] + z.zone[2] / 2) / 3, y: (z.zone[1] + z.zone[3] / 2) / 3 - defile });
  const largeurZone = z => z.zone[2] / 3 * M.K * tel.pose.echelle;

  // ─── la carte des temps forts ───────────────────────────────────────────
  window.SONS = [
    ...COUPES.map(c => [b(c[0]), 'coup']),
    ...FLASHES.map(f => [f[0], f[1] - f[0] > TEMPS / 3 ? 'coup' : 'touche']),
    [b(7), 'nappe-monte'], [T_NOIR, 'coup'],
    [T_TEL, 'coup'], [T_TEL + .05, 'telephone-entre'], [T_SECONDES, 'coup'],
    [T_SAUT, 'glisse'], [T_SAUT + TEMPS / 3, 'glisse'], [T_SAUT + 2 * TEMPS / 3, 'glisse'],
    [T_CREER, 'appui'], [T_FICHE, 'glisse'], [T_FICHE_ENTIERE, 'glisse'], [T_FICHE_ENTIERE + .1, 'repere'],
    [T_REDIGE, 'coup'], [T_REDIGE, 'appui'], [T_EDITEUR, 'glisse'], [T_RETOUR, 'coup'], [T_RETOUR + .1, 'repere'], [T_RETOUR + TEMPS / 2, 'glisse'],
    [T_MICRO, 'appui'], [T_MICRO + .1, 'micro'],
    ...MOTS.map(([t]) => [t, 'touche']),
    [T_TRANSCRIT, 'glisse'], [T_FILE, 'barre'], [T_DEVIS, 'coup'], [T_PRET, 'coup'], [T_PRET + .05, 'total'],
    [T_CLIENT, 'coup'], [T_DATE, 'appui'], [T_ACCEPTE, 'appui'], [T_NOTE, 'glisse'], [T_NOTE + .2, 'accepte'],
    [T_PREVENU, 'coup'], [T_PREVENU + .05, 'notification'], [T_VOL, 'feuille-entre'], [T_PLANNING, 'coup'], [T_PLANNING + .1, 'total'],
    [T_GARS, 'coup'], [T_OUVRE, 'appui'], [T_FICHE_G, 'glisse'], [T_ADRESSE, 'glisse'], [T_ADRESSE + .3, 'coup'], [T_TRAVAUX, 'glisse'], [T_TRAVAUX + .3, 'coup'], [T_SANS, 'coup'], [T_SANS + .05, 'accepte'],
    [T_SOIR, 'coup'], [T_FACTURE, 'appui'], [T_FACT_GL, 'glisse'], [T_REPREND, 'coup'], [T_TOTAUX, 'glisse'], [T_LA_TVA, 'coup'],
    [T_TVA, 'feuille-entre'], [T_TAUX, 'coup'], [T_DECLARE - .2, 'glisse'], [T_DECLARE + .45, 'repere'], [T_A_DECLARER, 'coup'], [T_A_DECLARER + .05, 'total'],
    [T_NOIR_2, 'coup'], [T_VINGT, 'coup'], [T_VINGT + TEMPS / 2, 'barre'], [T_TRENTE, 'coup'], [T_TRENTE + .05, 'accepte'], [T_SOIR_2, 'coup'], [T_SOIR_2 + .3, 'telephone-sort'],
    [T_SIGN, 'coup'], [T_SIGN + .05, 'final'],
  ].sort((a, b) => a[0] - b[0]);
  window.MUSIQUE = {
    style: 'nerveuse', bpm: BPM, tonalite: 'D', duree: DUREE,
    sections: [
      { de: 0, bpm: BPM, accord: 'Bm', couches: ['pulsation'] },
      { de: b(7), bpm: BPM, accord: 'Bm', couches: ['pulsation', 'charley'] },
      { de: T_NOIR, bpm: BPM, accord: 'Bm', couches: ['silence'] },
      { de: T_TEL, bpm: BPM, accord: 'D', couches: ['pulsation', 'charley'] },
      { de: T_DICTEE, bpm: BPM, accord: 'G', couches: ['pulsation', 'charley', 'arpege'] },
      { de: T_DEVIS, bpm: BPM, accord: 'D', couches: ['nappe', 'pulsation'] },
      { de: T_CLIENT, bpm: BPM, accord: 'A', couches: ['nappe', 'pulsation', 'charley'] },
      { de: T_PLANNING, bpm: BPM, accord: 'D', couches: ['nappe', 'pulsation', 'arpege'] },
      { de: T_GARS, bpm: BPM, accord: 'Bm', couches: ['nappe', 'pulsation', 'charley'] },
      { de: T_SANS, bpm: BPM, accord: 'G', couches: ['nappe', 'pulsation', 'arpege'] },
      { de: T_SOIR, bpm: BPM, accord: 'D', couches: ['nappe', 'pulsation', 'charley', 'arpege'] },
      { de: T_NOIR_2, bpm: BPM, accord: 'D', couches: ['silence'] },
      { de: T_VINGT, bpm: BPM, accord: 'Bm', couches: ['pulsation'] },
      { de: T_TRENTE, bpm: BPM, accord: 'D', couches: ['nappe', 'pulsation'] },
      { de: T_SOIR_2, bpm: BPM, accord: 'D', couches: ['nappe'] },
      { de: T_SIGN - TEMPS / 2, bpm: BPM, accord: 'D', couches: ['silence'] },
      { de: T_SIGN, bpm: BPM, accord: 'D', couches: ['nappe', 'finale'] },
    ],
  };

  const fond = $('fond'), eclair = $('eclair'), mHaut = $('mHaut'), mBas = $('mBas'), barre = $('barre');

  // ─── la caméra : des sauts, jamais des glissés ──────────────────────────
  // Un regard : [instant, zoom, point, courbe]. Avec `saut`, la caméra reste
  // où elle est jusqu'à l'instant, puis y est d'un coup. Trois regards à un
  // tiers de temps d'écart font les trois crans.
  const W = (x, y) => () => ({ x, y });
  const A = (x, y, dy = 0) => () => { const p = tel.pointDeLAppli(x, y); return { x: p.x, y: p.y + dy }; };
  const ENTIER = W(540, 1000);
  const crans = (t0, zooms, points) => zooms.map((z, k) => [t0 + k * TEMPS / 3, z, points[k], saut]);
  const REGARDS = [
    [0, 1.0, ENTIER],
    ...crans(T_SAUT, [1.25, 1.55, 1.9], [A(195, 300), A(230, 240), A(...P.creerUnDevis)]),
    [T_FICHE_ENTIERE, 1.0, ENTIER, saut],
    [T_EDITEUR + TEMPS / 2, 1.25, A(195, 520), saut],
    [T_RETOUR, 1.0, ENTIER, saut],
    ...crans(T_RETOUR + TEMPS / 2, [1.3, 1.9], [A(195, 600), A(...P.micro)]),
    [T_MICRO + .25, 2.5, A(...P.micro), saut],
    [T_DICTEE, 1.0, ENTIER, saut],
    [T_TRANSCRIT, 1.0, ENTIER],
    [T_TRANSCRIT + TEMPS / 2, 1.25, A(...R.transcription, 20), saut],
    [T_FILE, 1.25, A(...R.transcription, 20)],
    [T_DEVIS, 1.0, ENTIER, saut],
    [T_CLIENT, 1.0, ENTIER],
    ...crans(T_DATE - TEMPS / 3, [1.5], [A(120, 360)]),
    [T_ACCEPTE, 1.4, A(195, 440), saut],
    [T_NOTE + TEMPS / 2, 1.0, ENTIER, saut],
    [T_PREVENU + TEMPS, 1.5, A(...R.notification), saut],
    [T_VOL + .3, 1.0, W(540, 940), saut],
    [T_PLANNING + TEMPS / 2, 1.3, A(...R.cartePlanning), saut],
    [T_PLANNING + 2 * TEMPS, 1.0, ENTIER, saut],
    [T_OUVRE + TEMPS, 1.0, ENTIER],
    [T_ADRESSE + TEMPS / 2, 1.6, A(...R.boutonsDeLaFiche), saut],
    [T_TRAVAUX + TEMPS / 2, 1.5, A(...R.lignesDesTravaux), saut],
    [T_SANS, 1.0, ENTIER, saut],
    [T_TOTAUX + TEMPS / 2, 1.5, A(...R.ligneTva), saut],
    [T_TVA + .3, 1.0, W(540, 980), saut],
    [T_DECLARE + TEMPS, 1.4, A(...R.carteTva), saut],
    [T_A_DECLARER + TEMPS, 1.0, ENTIER, saut],
    [T_NOIR_2, 1.0, W(540, 960), saut],
  ];
  // Les coups : à chaque mot qui frappe, la caméra encaisse.
  const COUPS = [...MOTS_PILIERS.map(m => m[0]), T_TEL, T_SECONDES, T_VINGT, T_TRENTE, T_SOIR_2, T_SIGN].sort((a, b) => a - b);

  function rendre(t) {
    const stress = t < T_TEL;
    const coupe = COUPES.find(c => t >= b(c[0]) && t < b(c[1]));
    const fl = FLASHES.find(f => t >= f[0] && t < f[1]);
    const noirFinal = t >= T_NOIR_2;
    const fondCoupe = stress ? (coupe ? coupe[2] : fl ? fl[2] : '#06070a')
      : t >= T_VINGT && t < T_TRENTE ? '#f5f3ee' : t >= T_TRENTE && t < T_SOIR_2 ? '#2f3b2f' : '#06070a';
    fond.style.background = fondCoupe;

    // ── le stress : les cartes frappent, puis reviennent de plus en plus vite
    COUPES.forEach((c, k) => {
      const el = cartes[k];
      const de = b(c[0]), a = b(c[1]);
      const visible = t >= de && t < a;
      el.style.opacity = visible ? '1' : '0';
      if (!visible) return;
      M.animer(motsCartes[k], t, { debut: de, pas: .04, duree: .22, mode: 'coup' });
      const sous = el.querySelector('.etroit');
      if (sous) { const p = sortie(entre(t, de + .12, de + .3)); sous.style.opacity = String(p); sous.style.transform = `translateY(${18 * (1 - p)}px)`; }
      el.style.transform = `translateX(${mix(0, -26, (t - de) / (a - de))}px)`;
    });
    flash.style.opacity = fl ? '1' : '0';
    if (fl) {
      flashMot.textContent = fl[4]; flashMot.style.color = fl[3];
      const p = coup(entre(t, fl[0], fl[0] + .1));
      flash.style.transform = `scale(${mix(1.22, 1, p)}) rotate(${FLASHES.indexOf(fl) % 2 ? 1.5 : -1.5}deg)`;
    }

    // ── « 30 » et « secondes. » : derrière le téléphone, puis sous lui
    const p30 = coup(entre(t, T_TEL, T_TEL + .28));
    $('trente').style.opacity = String(t >= T_TEL && t < T_SAUT + .3 ? 1 : 0);
    $('trente').style.transform = `scale(${mix(1.5, 1, p30)}) translateY(${mix(60, 0, p30)}px)`;
    const ps = coup(entre(t, T_SECONDES, T_SECONDES + .25));
    $('secondes').style.opacity = String(t >= T_SECONDES && t < T_SAUT + .6 ? 1 : 0);
    $('secondes').style.transform = `translateY(${mix(120, 0, ps)}px) scale(${mix(1.3, 1, ps)})`;

    // ── le téléphone : il claque, entier, et le reste jusqu'au noir ; posé à la fin
    const entreeTel = expo(entre(t, T_TEL, T_TEL + .34));
    const client = (t >= T_CLIENT && t < T_PREVENU) ? 1 : 0;
    const face = Math.max(
      t >= T_VOL - .3 && t < T_PLANNING + .6 ? 1 : 0,
      t >= T_TVA - .3 && t < T_TVA + .5 ? 1 : 0,
      t >= T_DECLARE - .3 && t < T_A_DECLARER + .6 ? 1 : 0,
    );
    const vol = lisse(entre(t, T_VOL, T_VOL + .2)) * (1 - lisse(entre(t, T_PLANNING - .25, T_PLANNING)));
    const tva = lisse(entre(t, T_TVA, T_TVA + .3)) * (1 - lisse(entre(t, T_DECLARE - .3, T_DECLARE)));
    const pose = t >= T_SOIR_2;
    tel.poser(pose ? {
      x: 540, y: 1180, rx: 62, ry: -6, rz: -14, echelle: .72, hauteurSol: 10, lumiere: 20, force: .9, allume: 0,
      opacite: t < T_SIGN ? 1 : 0,
    } : {
      x: mix(1700, 540, entreeTel), y: TEL_Y + 60 * vol + 120 * tva,
      rx: mix(-6, 3, entreeTel) * (1 - face), ry: (mix(48, -9, entreeTel) + 22 * client) * (1 - face), rz: (mix(-16, -4, entreeTel) + 6 * client) * (1 - face * .7),
      echelle: ECHELLE * mix(1, .96, vol) * mix(1, .92, tva), hauteurSol: 120, lumiere: 150, force: 1, allume: 1,
      opacite: t >= T_TEL && !noirFinal ? 1 : 0, flou: 1.5 * vol + 2.5 * tva,
      balaye: t > T_TEL + .1 && t < T_TEL + .7 ? (t - T_TEL - .1) / .6 : null,
    });
    tel.poserEcrans(t, ECRANS);
    tel.poserAppui(t, APPUIS);
    tel.poserRepere(t, REPERES);
    const ecoule = (t - (T_MICRO + .15)) * 1000;
    let vue = -1;
    if (t >= T_MICRO + .15 && t < T_TRANSCRIT) C.PRISES.forEach((ms, k) => { if (ms <= ecoule) vue = k; });
    BANDES.forEach((bd, k) => { bd.style.opacity = k === vue ? '1' : '0'; });

    // ── la caméra : un coup à chaque coupe du stress, des sauts ensuite, un filé une fois
    let zoom = 1, cx = 540, cy = 960, rz = 0;
    if (stress) {
      const de = coupe ? b(coupe[0]) : fl ? fl[0] : T_NOIR;
      const punch = expo(entre(t, de, de + (fl ? .12 : .3)));
      const force = fl ? .2 : .14;
      zoom = t < T_NOIR ? mix(1 + force, 1, punch) : 1;
      rz = t < T_NOIR ? mix((Math.round(de * 60) % 2 ? 1.6 : -1.6) * (fl ? 1.6 : 1), 0, punch) : 0;
    } else {
      zoom = cles(t, REGARDS.map(r => [r[0], r[1], r[3]]));
      cx = cles(t, REGARDS.map(r => [r[0], r[2]().x, r[3]]));
      cy = cles(t, REGARDS.map(r => [r[0], r[2]().y, r[3]]));
      const dernier = COUPS.filter(c => c <= t).pop();
      if (dernier !== undefined) zoom *= mix(1.06, 1, expo(entre(t, dernier, dernier + .3)));
      if (t >= T_TEL && t < T_SAUT) zoom *= mix(1.1, 1, expo(entre(t, T_TEL, T_TEL + .3)));
      if (t >= T_FILE && t < T_FILE + .4) cx += 900 * Math.sin(entre(t, T_FILE, T_FILE + .4) * Math.PI);
    }
    scene.poser({ x: cx, y: cy, zoom, rz, secousse: stress ? 1.6 * entre(t, b(6), T_NOIR) : (noirFinal ? 0 : .6), t });
    const vitesseFile = t >= T_FILE && t < T_FILE + .4 ? Math.sin(entre(t, T_FILE, T_FILE + .4) * Math.PI) : 0;
    $('monde').style.filter = vitesseFile > .05 ? `blur(${10 * vitesseFile}px)` : 'none';

    // ── les mots dictés, au quart de temps, en masse, dans la bande du haut
    const dictVisible = t >= T_DICTEE && t < T_TRANSCRIT;
    dictee.style.opacity = dictVisible ? '1' : '0';
    if (dictVisible) {
      spansMots.forEach((sp, k) => {
        const p = coup(entre(t, MOTS[k][0], MOTS[k][0] + .18));
        sp.style.opacity = String(t >= MOTS[k][0] ? 1 : 0);
        sp.style.transform = `scale(${mix(1.6, 1, p)})`;
        sp.style.color = /chêne|élagage|Élagage/.test(MOTS[k][1]) ? '#C9A15E' : '#f3efe6';
      });
    }

    // ── les mots des piliers : chacun frappe sur son temps, dans sa bande
    for (const [el, bande] of [[mHaut, 'haut'], [mBas, 'bas']]) {
      const m = MOTS_PILIERS.find(x => x[4] === bande && t >= x[0] && t < x[1]);
      el.style.opacity = m ? '1' : '0';
      if (!m) continue;
      el.textContent = m[2]; el.style.color = m[3];
      const p = coup(entre(t, m[0], m[0] + .22));
      el.style.transform = `scale(${mix(1.5, 1, p)}) rotate(${mix(-3, 0, p)}deg)`;
    }

    // ── la ligne du devis claque en bas après le filé ; « Devis. » puis « Prêt. »
    const pl = coup(entre(t, T_FILE + .3, T_FILE + .5));
    ligne.poser({ x: 540, y: 1730, largeur: 1040, rz: -2, p: 1, opacite: t >= T_FILE + .3 && t < T_CLIENT ? 1 : 0, ombre: .8 });
    ligne.el.style.transform += ` scale(${mix(1.3, 1, pl)})`;

    // ── raccord : la carte « devis accepté » s'envole et se pose sur le planning
    {
      const monte = entreeSortie(entre(t, T_VOL, T_VOL + .25));
      const descend = entreeSortie(entre(t, T_VOL + .25, T_PLANNING));
      const dep = centreZone(Z.notification), arr = centreZone(Z.cartePlanning, D.planning);
      const pDep = tel.pointDeLAppli(dep.x, dep.y), pArr = tel.pointDeLAppli(arr.x, arr.y);
      const apex = { x: 540, y: 760 };
      const enHaut = t >= T_VOL + .25;
      raccordPlanning.poser({
        x: enHaut ? mix(apex.x, pArr.x, descend) : mix(pDep.x, apex.x, monte),
        y: enHaut ? mix(apex.y, pArr.y, descend) : mix(pDep.y, apex.y, monte),
        largeur: enHaut ? mix(900, largeurZone(Z.cartePlanning), descend) : mix(largeurZone(Z.notification), 900, monte),
        rx: enHaut ? mix(10, 0, descend) : mix(0, 10, monte),
        p: entre(t, T_VOL + .1, T_PLANNING - .1),
        opacite: t >= T_VOL && t < T_PLANNING + .03 ? 1 : 0,
        ombre: monte * (1 - descend),
      });
    }
    // ── raccord : la ligne de TVA devient la table du PDF, qui devient « Ma TVA à déclarer »
    {
      const a1 = entreeSortie(entre(t, T_TVA, T_TVA + .4));
      const dep = centreZone(Z.ligneTva, D.factureTotaux);
      const pDep = tel.pointDeLAppli(dep.x, dep.y);
      raccordTva.poser({
        x: mix(pDep.x, 540, a1), y: mix(pDep.y, 240, a1), largeur: mix(largeurZone(Z.ligneTva), 900, a1), rx: mix(0, 6, a1),
        p: entre(t, T_TVA + .1, T_TVA + .35), opacite: t >= T_TVA && t < T_DECLARE ? 1 : 0, ombre: a1,
      });
      const b1 = entreeSortie(entre(t, T_DECLARE, T_DECLARE + .45));
      const arr = centreZone(Z.carteTva);
      const pArr = tel.pointDeLAppli(arr.x, arr.y);
      raccordDeclare.poser({
        x: mix(540, pArr.x, b1), y: mix(240, pArr.y, b1), largeur: mix(900, largeurZone(Z.carteTva), b1), rx: mix(6, 0, b1),
        p: entre(t, T_DECLARE + .05, T_DECLARE + .35), opacite: t >= T_DECLARE && t < T_DECLARE + .48 ? 1 : 0, ombre: 1 - b1,
      });
    }

    // ── le temps rendu : « 20 minutes » barré, « 30 secondes. », « Le soir. »
    const cVingt = $('cVingt'), cTrente = $('cTrente'), cSoir = $('cSoir');
    cVingt.style.opacity = t >= T_VINGT && t < T_TRENTE ? '1' : '0';
    M.animer(motsVingt, t, { debut: T_VINGT, pas: .05, duree: .22, mode: 'coup' });
    // La barre qui raye : elle traverse le mot d'un trait, sur un demi-temps.
    const pb = sortieForte(entre(t, T_VINGT + TEMPS / 2, T_VINGT + TEMPS));
    const boite = $('vingt').getBoundingClientRect ? $('vingt') : null;
    if (boite) {
      barre.style.opacity = t >= T_VINGT + TEMPS / 2 ? '1' : '0';
      barre.style.left = `${boite.offsetLeft - 20}px`; barre.style.top = `${boite.offsetTop + boite.offsetHeight * .52}px`;
      barre.style.width = `${(boite.offsetWidth + 40) * pb}px`;
    }
    cTrente.style.opacity = t >= T_TRENTE && t < T_SOIR_2 ? '1' : '0';
    M.animer(motsTrente, t, { debut: T_TRENTE, pas: .05, duree: .22, mode: 'coup' });
    cSoir.style.opacity = t >= T_SOIR_2 && t < T_SIGN ? '1' : '0';
    M.animer(motsSoir, t, { debut: T_SOIR_2, pas: .05, duree: .22, mode: 'coup' });
    // « Le soir. » glisse vers le haut pour laisser le téléphone posé dessous
    cSoir.style.transform = `translateY(${mix(0, -480, lisse(entre(t, T_SOIR_2 + .1, T_SOIR_2 + .5)))}px)`;

    // ── la signature : « Atlas » claque, puis les lettres se posent
    const pa = coup(entre(t, T_SIGN, T_SIGN + .25));
    $('atlas').style.transform = `scale(${mix(1.5, 1, pa)})`;
    M.animer(lettresAtlas, t, { debut: T_SIGN, pas: .03, duree: .3, mode: 'flou' });
    M.animer(motsDevise, t, { debut: T_DEVISE, pas: .08, duree: .5, mode: 'monte', decalage: 22 });
    const pe = sortie(entre(t, T_ESSAI, T_ESSAI + .6));
    essai.style.opacity = String(pe); essai.style.letterSpacing = `${mix(.7, .44, pe)}em`;

    // ── l'éclair : deux images blanches sur les coups les plus forts
    eclair.style.opacity = String((t >= T_TEL && t < T_TEL + 2 / 60) ? .75 : (t >= T_DEVIS && t < T_DEVIS + 2 / 60) || (t >= T_SIGN && t < T_SIGN + 2 / 60) ? .6 : 0);

    matiere.poser(t, {
      vignetteForce: fondCoupe === '#f5f3ee' ? .22 : .45,
      lueurX: 540, lueurY: pose ? 1100 : 1000, lueurForce: t >= T_TEL && !noirFinal ? .22 : (pose ? .18 : 0), lueurCouleur: pose ? '255,160,80' : '201,161,94',
      teinte: 'rgba(47,59,47,.12)', teinte2: 'rgba(201,161,94,.1)',
    });
  }

  M.demarrer({ duree: DUREE, rendre, pret: Promise.all(BANDES.map(i => i.decode().catch(() => {}))) });
</script>
