    .encaissez-plan img {
      position: absolute;

      object-fit: cover;

  </style>

  <div id="root" data-composition-id="encaissez" data-width="1080" data-height="1920">
    <div id="encaissez-sol"></div>

    <div id="encaissez-t1" class="encaissez-titre clip" data-start="0.25" data-duration="3.45" data-track-index="1">
      <div id="encaissez-t1-i">
        <div class="encaissez-l">La <b>facture</b> reprend</div>
        <div class="encaissez-l">le devis.</div>
      </div>

    <div id="encaissez-t2" class="encaissez-titre clip" data-start="4.2" data-duration="2.15" data-track-index="1">
      <div id="encaissez-t2-i">
        <div class="encaissez-l">La <b>TVA</b> du mois,</div>
        <div class="encaissez-l">déjà calculée.</div>
      </div>
    </div>

    <div id="encaissez-t3" class="encaissez-titre clip" data-start="6.45" data-duration="2.25" data-track-index="1">
      <div id="encaissez-t3-i">
        <div class="encaissez-l">Pour votre <b>comptable</b>,</div>
        <div class="encaissez-l">tout est justifié.</div>

    <div id="encaissez-scene" data-layout-allow-overflow>
      <div id="encaissez-tel">
        <div class="encaissez-ecran">
          <div class="encaissez-plan">
            <!-- La dernière image du planning, tenue le temps du fondu. -->
            <video id="encaissez-film-planning" class="clip" data-start="0" data-duration="0.35" data-media-start="8.44" data-playback-rate="0.1" data-track-index="2" muted playsinline src="assets/films/planning.mp4"></video>
          </div>
          <div class="encaissez-plan" id="encaissez-plan-facture">
            <video id="encaissez-film-facture" class="clip" data-start="0.05" data-duration="3.65" data-media-start="3.6" data-playback-rate="1.3" data-track-index="3" muted playsinline src="assets/films/facture.mp4"></video>
          </div>
          <div class="encaissez-plan" id="encaissez-plan-termines">
            <img id="encaissez-vue-termines" class="clip" data-start="3.5" data-duration="5.2" data-track-index="4" src="assets/films/termines.png" alt="" />

  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Où poser le téléphone pour qu'un point de l'écran de l'appli (en points
      // de l'appli, 390 de large) tombe à un endroit du cadre, à une échelle.
      const TEL = { x: 83, y: 568, bord: 22, k: 870 / 390 };
      const viser = (appX, appY, echelle, cadreX, cadreY) => ({
        scale: echelle,
        x: cadreX - TEL.x - (TEL.bord + TEL.k * appX) * echelle,
        y: cadreY - TEL.y - (TEL.bord + TEL.k * appY) * echelle,
      });
      const REPOS = { scale: 1, x: 0, y: 0 };
      // Les deux cartes de l'écran Terminés, en points de l'appli. À cette
      // échelle une carte tient la largeur du cadre, et la ligne des mots
      // tombe entre le titre de l'écran et le haut des cartes.
      const CARTE_TVA = viser(108, 172, 2.45, 540, 953);
      const CARTE_COMPTABLE = viser(282, 172, 2.45, 540, 953);
      const apparait = (cible, a) =>
        tl.fromTo(
          `${cible} .encaissez-l`,
          { opacity: 0, filter: "blur(12px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.1, ease: "power2.out" },
          a
        );
      const s_efface = (cible, a) =>
        tl.fromTo(cible, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(12px)", duration: 0.16, ease: "power2.in" }, a);
      gsap.set("#encaissez-tel", { transformOrigin: "0px 0px" });

      // Le chantier est fait : la sauge tombe au vert nuit, le téléphone reste.
      tl.fromTo("#encaissez-sol", { backgroundColor: "#e4ebda" }, { backgroundColor: "#0e2a1b", duration: 0.45, ease: "power2.inOut" }, 0);
      tl.fromTo("#encaissez-tel", { backgroundColor: "#12261b" }, { backgroundColor: "#2c4838", duration: 0.45, ease: "power2.inOut" }, 0);
      tl.fromTo("#encaissez-plan-facture", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 0.05);
      apparait("#encaissez-t1-i", 0.3);
      s_efface("#encaissez-t1-i", 3.5);

      // La facture est partie : l'écran Terminés, d'abord en entier, puis le
      // gros plan sur la carte de la TVA.
      tl.fromTo("#encaissez-plan-termines", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 3.5);
      tl.fromTo("#encaissez-tel", REPOS, { ...CARTE_TVA, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 4.05);
      apparait("#encaissez-t2-i", 4.25);
      s_efface("#encaissez-t2-i", 6.17);

      // Puis la caméra glisse jusqu'à sa voisine, celle du comptable.
      tl.fromTo("#encaissez-tel", CARTE_TVA, { ...CARTE_COMPTABLE, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 6.15);
      apparait("#encaissez-t3-i", 6.5);
      s_efface("#encaissez-t3-i", 8.42);

      // Tout est rangé : l'écran redescend sous le cadre.
      tl.fromTo(
        "#encaissez-tel",
        CARTE_COMPTABLE,
        { ...CARTE_COMPTABLE, y: CARTE_COMPTABLE.y + 1500, duration: 0.42, ease: "power3.in", immediateRender: false },
        8.27
      );
      window.__timelines["encaissez"] = tl;
    })();
  </script>
