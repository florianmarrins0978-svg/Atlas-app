<template>
  <style>
    @font-face {
      font-family: "Instrument Serif";
      src: url("assets/fonts/instrument-serif.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Instrument Serif";
      src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--sol-nuit, #0e2a1b);
    }
    .corvees-bloc {
      position: absolute;
      left: 72px;
      width: 960px;
      font-family: "Instrument Serif", serif;
      font-size: 104px;
      line-height: 1;
      letter-spacing: -0.015em;
      color: var(--sur-nuit, #f3efe3);
    }
    #corvees-b1 {
      top: 288px;
    }
    #corvees-b2 {
      top: 544px;
    }
    #corvees-b3 {
      top: 800px;
    }
    .corvees-ligne {
      position: relative;
      display: table;
      white-space: nowrap;
    }
    /* Le trait qui barre : celui de l'or, tiré de gauche à droite. */
    .corvees-trait {
      position: absolute;
      left: -8px;
      right: -8px;
      top: 55%;
      height: 9px;
      border-radius: 5px;
      background: var(--or-clair, #f0b43c);
    }
    #corvees-reponse {
      position: absolute;
      left: 72px;
      top: 1076px;
      width: 960px;
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 128px;
      line-height: 1;
      letter-spacing: -0.015em;
      color: var(--or-clair, #f0b43c);
      white-space: nowrap;
    }
    .corvees-mot {
      display: inline-block;
    }
  </style>

  <div id="root" data-composition-id="corvees" data-width="1080" data-height="1920">
    <div id="corvees-b1" class="corvees-bloc clip" data-start="0" data-duration="6.5" data-track-index="1">
      <div class="corvees-contenu" id="corvees-c1">
        <div class="corvees-ligne"><span>Les devis</span><i class="corvees-trait"></i></div>
        <div class="corvees-ligne"><span>retapés le soir.</span><i class="corvees-trait"></i></div>
      </div>
    </div>
    <div id="corvees-b2" class="corvees-bloc clip" data-start="1.2" data-duration="5.3" data-track-index="2">
      <div class="corvees-contenu" id="corvees-c2">
        <div class="corvees-ligne"><span>Les clients qui</span><i class="corvees-trait"></i></div>
        <div class="corvees-ligne"><span>ne répondent pas.</span><i class="corvees-trait"></i></div>
      </div>
    </div>
    <div id="corvees-b3" class="corvees-bloc clip" data-start="2.4" data-duration="4.1" data-track-index="3">
      <div class="corvees-contenu" id="corvees-c3">
        <div class="corvees-ligne"><span>La TVA calculée</span><i class="corvees-trait"></i></div>
        <div class="corvees-ligne"><span>à la fin du mois.</span><i class="corvees-trait"></i></div>
      </div>
    </div>
    <div id="corvees-reponse" class="clip" data-start="3.7" data-duration="2.8" data-track-index="4">
      <span class="corvees-mot">Atlas</span>
      <span class="corvees-mot">s’en</span>
      <span class="corvees-mot">occupe.</span>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const arrive = (bloc, a) =>
        tl.fromTo(
          `${bloc} .corvees-ligne span`,
          { opacity: 0, filter: "blur(12px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.13, ease: "power2.out" },
          a
        );
      tl.set(".corvees-trait", { scaleX: 0, transformOrigin: "0% 50%" }, 0);

      // Une corvée à la fois ; la précédente recule pour laisser lire la suivante.
      arrive("#corvees-c1", 0.1);
      arrive("#corvees-c2", 1.3);
      tl.fromTo("#corvees-c1", { opacity: 1 }, { opacity: 0.5, duration: 0.3, ease: "power2.inOut" }, 1.3);
      arrive("#corvees-c3", 2.5);
      tl.fromTo("#corvees-c2", { opacity: 1 }, { opacity: 0.5, duration: 0.3, ease: "power2.inOut" }, 2.5);

      // La réponse, puis les trois corvées barrées l'une après l'autre.
      tl.fromTo(
        ".corvees-mot",
        { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.09, ease: "power2.out" },
        3.8
      );
      ["#corvees-c1", "#corvees-c2", "#corvees-c3"].forEach((bloc, i) => {
        const a = 4.2 + i * 0.26;
        tl.fromTo(
          `${bloc} .corvees-trait`,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.3, stagger: 0.08, ease: "power3.out" },
          a
        );
        // Les deux premières ont déjà reculé à 0,5 ; la troisième est encore pleine.
        tl.fromTo(bloc, { opacity: i < 2 ? 0.5 : 1 }, { opacity: 0.42, duration: 0.3, ease: "power2.inOut" }, a + 0.1);
      });
      window.__timelines["corvees"] = tl;
    })();
  </script>
</template>
