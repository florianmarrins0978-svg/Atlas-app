  <div id="root" data-composition-id="dictez" data-width="1080" data-height="1920">

    <div id="dictez-ligne-b" class="dictez-ligne clip" data-start="6" data-duration="4.6" data-track-index="2">

    <div id="dictez-scene" data-layout-allow-overflow>

          <video id="dictez-film-micro" class="clip" data-start="2.1" data-duration="3.9" data-media-start="1.45" data-playback-rate="1.6" data-track-index="4" muted playsinline src="assets/films/micro.mp4"></video>
        </div>
        <div class="dictez-plan" id="dictez-plan-3">
          <video id="dictez-film-devis" class="clip" data-start="5.8" data-duration="4.8" data-media-start="1.1" data-playback-rate="1.1" data-track-index="5" muted playsinline src="assets/films/devis.mp4"></video>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const REPOS = { scale: 1, x: 0, y: 0 };
      // La caméra avance en gardant le haut du téléphone à sa place : plus
      // haut, il passerait sur les mots ; plus bas, le geste tomberait sous
      // l'habillage d'Instagram (rien d'utile sous 1248).
      const AVANCE = { scale: 1.1, x: -(914 * 0.1) / 2, y: 0 };
      // Le micro vit au bas de la fiche, là où le pouce le trouve : pour le
      // filmer, la caméra va le chercher et le monte au milieu du cadre.
      const TEL = { x: 83, y: 568, bord: 22, k: 870 / 390 };
      const viser = (appX, appY, echelle, cadreX, cadreY) => ({
        scale: echelle,
        x: cadreX - TEL.x - (TEL.bord + TEL.k * appX) * echelle,
        y: cadreY - TEL.y - (TEL.bord + TEL.k * appY) * echelle,
      });
      const MICRO = viser(195, 466, 1.15, 540, 1010);
      gsap.set("#dictez-tel", { transformOrigin: "0px 0px" });

      // Le sol sauge monte et recouvre le vert nuit ; le téléphone monte avec lui.
      tl.fromTo(
        "#dictez-sol",
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.inOut" },
        0
      );
      tl.fromTo("#dictez-tel", { y: 1500, scale: 1, x: 0 }, { y: 0, duration: 0.7, ease: "expo.out" }, 0.08);

      // Le mot du chapitre, puis sa ligne.
      tl.fromTo(
        "#dictez-mot-i",
        { opacity: 0, filter: "blur(14px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" },
        0.3
      );
      tl.fromTo(
        "#dictez-ligne-a-i",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" },
        0.5
      );
      tl.fromTo(
        "#dictez-ligne-a-i",
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(10px)", duration: 0.16, ease: "power2.in", immediateRender: false },
        2.3
      );

      // La fiche remplie prend la place de la fiche vide ; la caméra avance
      // vers le micro, puis tient pendant que le chrono tourne.
      tl.fromTo("#dictez-plan-2", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.inOut" }, 2.4);
      tl.fromTo("#dictez-tel", REPOS, { ...MICRO, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 2.15);

      // La phrase dictée, au rythme d'une voix.
      tl.fromTo(
        ".dictez-dit",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.24, ease: "power2.out" },
        2.7
      );
      tl.fromTo(
        "#dictez-dite-i",
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", immediateRender: false },
        5.8
      );

      // Le devis : la caméra recule, la ligne dictée est là, à son prix.
      tl.fromTo("#dictez-plan-3", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.inOut" }, 5.9);
      tl.fromTo(
        "#dictez-tel",
        MICRO,
        { ...REPOS, duration: 0.55, ease: "power2.inOut", immediateRender: false },
        5.7
      );
      tl.fromTo(
        "#dictez-ligne-b-i",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" },
        6.1
      );

      // Le total : la caméra avance dessus, tient, puis revient à sa place
      // pour que le chapitre suivant reprenne le téléphone là où il est.
      tl.fromTo("#dictez-tel", REPOS, { ...AVANCE, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 8.9);
      tl.fromTo(
        "#dictez-tel",
        AVANCE,
        { ...REPOS, duration: 0.4, ease: "power2.inOut", immediateRender: false },
        10.18
      );
      tl.fromTo(
        ["#dictez-mot-i", "#dictez-ligne-b-i"],
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(12px)", duration: 0.2, ease: "power2.in", immediateRender: false },
        10.38
      );
      window.__timelines["dictez"] = tl;
    })();
  </script>
