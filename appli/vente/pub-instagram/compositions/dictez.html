  <div id="root" data-composition-id="dictez" data-width="1080" data-height="1920">

          <!-- L'accueil, tenu le temps de le voir, puis « Créer un devis » et
               la fiche client qui monte, à la vitesse de l'appli. -->
          <div class="dictez-plan">

          <!-- La fiche remplie, le pouce qui descend jusqu'au micro, la dictée. -->

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Où poser le téléphone pour qu'un point de l'écran de l'appli (en points
      // de l'appli, 390 de large) tombe à un endroit du cadre, à une échelle.
      const TEL = { x: 83, y: 568, bord: 22, k: 870 / 390 };
      const viser = (appX, appY, echelle, cadreX, cadreY) => ({
        scale: echelle,
        x: cadreX - TEL.x - (TEL.bord + TEL.k * appX) * echelle,
        y: cadreY - TEL.y - (TEL.bord + TEL.k * appY) * echelle,
      });
      const REPOS = { scale: 1, x: 0, y: 0 };
      // Le micro vit au bas de la fiche, là où le pouce le trouve, donc sous
      // l'habillage d'Instagram : la caméra va le chercher.
      const MICRO = viser(195, 466, 1.15, 540, 1010);
      // Sur le total, la caméra avance en gardant le haut du téléphone à sa place.
      const AVANCE = { scale: 1.1, x: -(914 * 0.1) / 2, y: 0 };
      gsap.set("#dictez-tel", { transformOrigin: "0px 0px" });

      const apparait = (cible, a) =>
        tl.fromTo(
          `${cible} .dictez-l`,
          { opacity: 0, filter: "blur(12px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.1, ease: "power2.out" },
          a
        );
      const s_efface = (cible, a) =>
        tl.fromTo(cible, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(12px)", duration: 0.16, ease: "power2.in", immediateRender: false }, a);

      // Le sol sauge monte et recouvre l'accroche ; le téléphone monte avec
      // lui, l'accueil de l'appli dedans.
      tl.fromTo(
        "#dictez-sol",
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" },
        0
      );
      tl.fromTo("#dictez-tel", { ...REPOS, y: 1500 }, { ...REPOS, duration: 0.7, ease: "expo.out" }, 0.06);
      apparait("#dictez-t1-i", 0.55);

      // La fiche est remplie (un fondu de trois images), puis le pouce
      // descend jusqu'au micro : la caméra le suit et le monte au milieu.
      tl.fromTo("#dictez-plan-micro", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.inOut" }, 3.04);
      tl.fromTo("#dictez-tel", REPOS, { ...MICRO, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 3.25);
      s_efface("#dictez-t1-i", 3.88);

      // La phrase dictée, au rythme d'une voix, pendant que le chrono tourne.
      tl.fromTo(
        ".dictez-dit",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.2, ease: "power2.out" },
        4.1
      );
      s_efface("#dictez-dite-i", 7.56);

      // « Envoyer » : la caméra recule, le devis prend la place de la fiche au
      // plus vite du mouvement.
      tl.fromTo("#dictez-tel", MICRO, { ...REPOS, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 7.56);
      tl.fromTo("#dictez-plan-devis", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.inOut" }, 7.78);
      apparait("#dictez-t2-i", 7.95);

      // Le total : la caméra avance dessus et y reste, le plan suivant
      // reprend le téléphone là où il est.
      tl.fromTo("#dictez-tel", REPOS, { ...AVANCE, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 10.55);
      s_efface("#dictez-t2-i", 11.87);
      window.__timelines["dictez"] = tl;
    })();
  </script>
