<template>
  <style>
    @font-face {
      font-family: "Instrument Serif";
      src: url("assets/fonts/instrument-serif.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Instrument Serif";
      src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--sol-sauge, #e4ebda);
    }
    /* Une phrase par plan, en grand : ce que l'appli fait pour lui. */
    .dictez-titre {
      position: absolute;
      left: 72px;
      top: 290px;
      width: 950px;
      font-family: "Instrument Serif", serif;
      font-size: 118px;
      line-height: 1;
      letter-spacing: -0.015em;
      color: var(--encre, #12261b);
      white-space: nowrap;
    }
    .dictez-titre b {
      font-weight: 400;
      color: var(--or, #95600f);
    }
    #dictez-dite {
      position: absolute;
      left: 76px;
      top: 332px;
      width: 960px;
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 66px;
      line-height: 1.08;
      color: var(--encre, #12261b);
    }
    .dictez-dit {
      display: inline-block;
    }
    /* La scène du téléphone commence sous les mots : quand la caméra avance et
       que le téléphone monte, il passe sous cette ligne au lieu de les couvrir. */
    #dictez-scene {
      position: absolute;
      left: 0;
      top: 548px;
      width: 1080px;
      height: 1372px;
      overflow: hidden;
    }
    /* Le téléphone : une coque encre, l'écran de l'appli dedans. Il monte du
       bas du cadre, son pied reste sous le bord. */
    #dictez-tel {
      position: absolute;
      left: 83px;
      top: 20px;
      width: 914px;
      height: 1382px;
      border-radius: 100px;
      background: #12261b;
      box-shadow:
        0 50px 110px rgba(18, 38, 27, 0.26),
        inset 0 0 0 2px rgba(243, 239, 227, 0.1);
    }
    .dictez-ecran {
      position: absolute;
      left: 22px;
      top: 22px;
      width: 870px;
      height: 1338px;
      border-radius: 78px;
      overflow: hidden;
      background: #f4f2ed;
    }
    .dictez-plan {
      position: absolute;
      inset: 0;
    }
    .dictez-plan video {
      position: absolute;
      left: 0;
      top: 0;
      width: 870px;
      height: 1338px;
      object-fit: cover;
    }
  </style>

  <div id="root" data-composition-id="dictez" data-width="1080" data-height="1920">
    <!-- Dès la première image : pour qui, et quoi. -->
    <div id="dictez-t1" class="dictez-titre clip" data-start="0" data-duration="1.5" data-track-index="1">
      <div id="dictez-t1-i">
        <div class="dictez-l">Artisans,</div>
        <div class="dictez-l"><b id="dictez-or">dictez</b> vos devis.</div>
      </div>
    </div>

    <div id="dictez-dite" class="clip" data-start="1.45" data-duration="2.7" data-track-index="1">
      <div id="dictez-dite-i">
        <span class="dictez-dit">«&nbsp;On</span>
        <span class="dictez-dit">arrache</span>
        <span class="dictez-dit">l’ancienne</span>
        <span class="dictez-dit">haie</span><br />
        <span class="dictez-dit">de</span>
        <span class="dictez-dit">thuyas</span>
        <span class="dictez-dit">sur</span>
        <span class="dictez-dit">douze</span>
        <span class="dictez-dit">mètres.&nbsp;»</span>
      </div>
    </div>

    <div id="dictez-t2" class="dictez-titre clip" data-start="4.25" data-duration="4.15" data-track-index="1">
      <div id="dictez-t2-i">
        <div class="dictez-l"><b>Cause</b> écrit le devis,</div>
        <div class="dictez-l">avec vos prix.</div>
      </div>
    </div>

    <div id="dictez-scene" data-layout-allow-overflow>
      <div id="dictez-tel">
        <div class="dictez-ecran">
          <div class="dictez-plan" id="dictez-plan-micro">
            <video id="dictez-film-micro" class="clip" data-start="0" data-duration="4.2" data-media-start="1.6" data-playback-rate="1.45" data-track-index="2" muted playsinline src="assets/films/micro.mp4"></video>
          </div>
          <div class="dictez-plan" id="dictez-plan-devis">
            <video id="dictez-film-devis" class="clip" data-start="4.05" data-duration="4.35" data-media-start="1.3" data-playback-rate="1.18" data-track-index="3" muted playsinline src="assets/films/devis.mp4"></video>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Où poser le téléphone pour qu'un point de l'écran de l'appli (en points
      // de l'appli, 390 de large) tombe à un endroit du cadre, à une échelle.
      const TEL = { x: 83, y: 568, bord: 22, k: 870 / 390 };
      const viser = (appX, appY, echelle, cadreX, cadreY) => ({
        scale: echelle,
        x: cadreX - TEL.x - (TEL.bord + TEL.k * appX) * echelle,
        y: cadreY - TEL.y - (TEL.bord + TEL.k * appY) * echelle,
      });
      const REPOS = { scale: 1, x: 0, y: 0 };
      // Le micro vit au bas de la fiche, là où le pouce le trouve, donc sous
      // l'habillage d'Instagram : le film s'ouvre la caméra déjà dessus.
      const MICRO = viser(195, 466, 1.15, 540, 1010);
      // Sur le total, la caméra avance en gardant le haut du téléphone à sa place.
      const AVANCE = { scale: 1.1, x: -(914 * 0.1) / 2, y: 0 };
      gsap.set("#dictez-tel", { transformOrigin: "0px 0px" });

      // Première image : le titre est là, le micro aussi. L'or va à « dictez »,
      // et c'est l'appli qui bouge la première (l'appui, le chrono).
      tl.fromTo("#dictez-tel", MICRO, { ...MICRO, duration: 0.01 }, 0);
      tl.fromTo("#dictez-or", { color: "#12261b" }, { color: "#95600f", duration: 0.3, ease: "power2.inOut" }, 0.25);
      tl.fromTo(
        "#dictez-t1-i",
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(12px)", duration: 0.14, ease: "power2.in" },
        1.34
      );

      // La phrase dictée, au rythme d'une voix, pendant que le chrono tourne.
      tl.fromTo(
        ".dictez-dit",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.2, ease: "power2.out" },
        1.5
      );
      tl.fromTo(
        "#dictez-dite-i",
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(10px)", duration: 0.16, ease: "power2.in", immediateRender: false },
        3.96
      );

      // « Envoyer » : la caméra recule, le devis prend la place de la fiche au
      // plus vite du mouvement.
      tl.fromTo("#dictez-tel", MICRO, { ...REPOS, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 3.92);
      tl.fromTo("#dictez-plan-devis", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.inOut" }, 4.14);
      tl.fromTo(
        "#dictez-t2-i .dictez-l",
        { opacity: 0, filter: "blur(12px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.1, ease: "power2.out" },
        4.3
      );

      // Le total : la caméra avance dessus et y reste, le plan suivant
      // reprend le téléphone là où il est.
      tl.fromTo("#dictez-tel", REPOS, { ...AVANCE, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 6.9);
      tl.fromTo(
        "#dictez-t2-i",
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(12px)", duration: 0.16, ease: "power2.in" },
        8.22
      );
      window.__timelines["dictez"] = tl;
    })();
  </script>
</template>
