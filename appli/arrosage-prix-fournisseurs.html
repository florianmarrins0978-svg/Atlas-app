<!--
  MAQUETTE, RIEN N'EST CODÉ (CLAUDE.md §3 bis). Sa demande du 18 octobre 2026 :
  « une petite case où je puisse intégrer les devis de mes fournisseurs, par
  exemple Aqua Plus ou France Bonhomme, et il me met à chaque fois les prix à
  côté des pièces. Le jour où je fais mon plan, il me fait un montant total, à
  titre indicatif parce que les prix peuvent changer, mais au moins je sais à
  peu près où je vais. »

  CE SONT DES PRIX D'ACHAT, PAS SES PRIX DE VENTE. Réglages > Tarifs tient déjà
  ses prix de vente (ImportTarifs.tsx) ; ceux-ci restent à part, par
  fournisseur, avec la date du devis lu. Les mélanger ferait partir un prix
  d'achat sur le devis d'un client.

  AUCUN PRIX N'EST INVENTÉ ICI (CLAUDE.md §4, docs/AGENT.md §3) : les cases de
  prix sont vides. Dans l'outil, elles se remplissent avec ce que l'IA lit sur
  le devis du fournisseur (comme lire-ticket.ts), et RIEN n'est enregistré
  avant son appui, comme ImportTarifs. Ici, on tape quelques prix pour voir le
  total se faire.

  LA LISTE DU PLAN est celle que le calcul rend pour le jardin de la planche du
  plan (engendrer-planche-prix-fournisseurs.mjs), rien d'écrit à la main.
-->

  var LIGNES = [{"cle":"te-25-25-25","ref":"OPL704025","nom":"Plasson Té 90° 25×25×25","q":4,"u":"u"},{"cle":"clarinette-3v","ref":"ODU3010103","nom":"Dura Collecteur M x F x 3 sorties 1\"","q":1,"u":"u"},{"cle":"union","ref":"ODU329010","nom":"Dura Manchon union 1\" FF","q":5,"u":"u"},{"cle":"electrovanne-100dv","ref":"REV100DVM9V","nom":"Rain Bird Électrovanne 100 DV 1\" MM 9V","q":3,"u":"u"},{"cle":"raccord-male25","ref":"OPL70202526","nom":"Plasson Raccord mâle 25 x 1\"","q":5,"u":"u"},{"cle":"coude-ff","ref":"ODU306010","nom":"Dura Coude 1\" FF","q":1,"u":"u"},{"cle":"coude-mf","ref":"ODU306009","nom":"Dura Coude 90° taraudé/fileté MF 1\"","q":1,"u":"u"},{"cle":"mamelon","ref":"ODU8303131","nom":"Dura Mamelon réduit fileté MM 1\"-3/4\"","q":4,"u":"u"},{"cle":"vanne-purge","ref":"BVA932","nom":"Dura Vanne avec vis de purge 3/4\"","q":1,"u":"u"},{"cle":"regard-rg17106","ref":"RG17106","nom":"Dura Regard jumbo RG17106","q":1,"u":"u"},{"cle":"prog-4","ref":null,"nom":"Solem Programmateur BL-IP 4 stations 9V","q":1,"u":"u"},{"cle":"pile-9v","ref":"ELD60481","nom":"Pile alcaline 9V","q":1,"u":"u"},{"cle":"connexion","ref":"ELD550077","nom":"Connexion étanche","q":8,"u":"u"},{"cle":"electrovanne-100dv-ff","ref":"REV100DV9V","nom":"Rain Bird Électrovanne 100 DV 1\" FF 9V","q":1,"u":"u"},{"cle":"regulateur-ff34","ref":null,"nom":"Dura Régulateur de pression FF 3/4\"","q":1,"u":"u"},{"cle":"mamelon-droit-1","ref":"ODU8303","nom":"Dura Mamelon fileté MM 1\"","q":1,"u":"u"},{"cle":"RBT639","ref":"RBT639","nom":"Rain Bird Tuyères 6-VAN, par 25","q":7,"u":"u"},{"cle":"UGGCBL23050","ref":"UGGCBL23050","nom":"tube Ø16mm 2l/h esp.33cm autorégulé, couronne de 50 m","q":2,"u":"u"},{"cle":"RA3504","ref":"RA3504","nom":"Turbine 3504, un seul modèle réglable 40°-360°, livré avec 6 buses","q":13,"u":"u"},{"cle":"RT1804","ref":"RT1804","nom":"Tuyère 1800, escamotable 10 cm","q":7,"u":"u"},{"cle":"pebd16","ref":null,"nom":"PEBD rigide Ø16 (tube de reprise)","q":40,"u":"ml"},{"cle":"MID   var $ = function (id) { return document.getElementById(id); };
  var texte = function (s) { var e = document.createElement("span"); e.textContent = s == null ? "" : String(s); return e.innerHTML; };
  var CHARTES = [["origine","Origine"],["brume","Brume"],["pierre","Pierre"],["beurre","Beurre"],["moka","Moka"],["prune","Prune"],["sylve","Sylve"],["nuit","Nuit"]];
  CHARTES.forEach(function (c) { var o = document.createElement("option"); o.value = c[0]; o.textContent = c[1]; $("charte").appendChild(o); });
  $("charte").onchange = function () { document.body.dataset.charte = this.value; };

  var euros = function (n) { return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €"; };
  var lirePrix = function (s) { var n = Number(String(s).replace(/\s/g, "").replace(",", ".")); return s !== "" && n >= 0 && isFinite(n) ? n : null; };
  var aujourdhui = new Date().toLocaleDateString("fr-FR");
  var vignette = function (cle) { var f = PHOTOS[cle]; return f ? '<span class="vignette"><img src="arrosage-photos/' + texte(f) + '" alt=""></span>' : '<span class="vignette vide"></span>'; };

  // fournisseurs : { nom, date du devis, prix par pièce (HT, à l'unité ou au mètre) }
  var fournisseurs = [{ nom: "Aqua Plus", date: null, prix: {} }, { nom: "France Bonhomme", date: null, prix: {} }];
  var vue = "moins";      // le fournisseur dont on lit les prix, ou « le moins cher »
  var lecture = null;     // le fournisseur dont on lit un devis

  function dessinerFournisseurs() {
    $("fournisseurs").innerHTML = fournisseurs.map(function (f, i) {
      var n = Object.keys(f.prix).length;
      return '<div class="fournisseur"><div class="tete"><b>' + texte(f.nom) + "</b><small>" + (f.date ? n + " prix, devis du " + f.date : "Aucun devis") + "</small></div>" +
        // Le devis se prend en photo, ou se choisit (photo ou PDF) : sa demande du 18 octobre 2026.
        '<div class="sources"><label class="source principale"><input type="file" accept="image/*" capture="environment" data-devis="' + i + '">' + (f.date ? "Nouveau devis en photo" : "Prendre le devis en photo") + "</label>" +
        '<label class="source"><input type="file" accept="image/*,application/pdf" data-devis="' + i + '">Choisir une photo ou un PDF</label></div></div>';
    }).join("");
    var chips = [["moins", "Le moins cher"]].concat(fournisseurs.map(function (f, i) { return [String(i), f.nom]; }));
    $("choix-fournisseur").innerHTML = chips.map(function (c) { return '<button type="button" data-vue="' + c[0] + '" aria-pressed="' + (vue === c[0]) + '">' + texte(c[1]) + "</button>"; }).join("");
  }

  // Le prix d'une pièce dans la vue choisie : celui du fournisseur, ou le plus bas des deux.
  function prixDe(cle) {
    if (vue !== "moins") { var f = fournisseurs[Number(vue)]; return f.prix[cle] != null ? { p: f.prix[cle], de: f } : null; }
    var mieux = null;
    fournisseurs.forEach(function (f) { if (f.prix[cle] != null && (!mieux || f.prix[cle] < mieux.p)) mieux = { p: f.prix[cle], de: f }; });
    return mieux;
  }

  function dessinerPlan() {
    var total = 0, sans = 0, dates = {};
    $("liste").innerHTML = LIGNES.map(function (l) {
      var x = prixDe(l.cle);
      var q = l.u === "ml" ? String(l.q).replace(".", ",") + " m" : l.q + "x";
      if (x) { total += x.p * l.q; dates[x.de.nom] = x.de.date; } else sans++;
      return '<div class="ligne">' + vignette(l.cle) + '<span class="n">' + texte(l.nom) + "<small>" + q + "</small></span>" +
        (x ? '<span class="prix">' + euros(x.p * l.q) + "<small>" + (vue === "moins" ? texte(x.de.nom) : euros(x.p) + (l.u === "ml" ? " le m" : " pièce")) + "</small></span>" : '<span class="prix sans">pas de prix</span>') + "</div>";
    }).join("");
    var chiffrees = LIGNES.length - sans;
    $("total").innerHTML = "<small>Total indicatif, hors taxes</small>" + '<span class="m">' + euros(total) + "</span>" +
      "<small>" + (chiffrees ? Object.keys(dates).map(function (n) { return "Prix " + n + " du " + dates[n]; }).join(". ") + ". Ils ont pu changer." : "Aucun prix encore.") + "</small>";
    $("manque").textContent = sans ? sans + " pièce" + (sans > 1 ? "s" : "") + " sans prix sur " + LIGNES.length + ", le total ne les compte pas." : "";
  }

  function ouvrirDevis(i) {
    lecture = i;
    var f = fournisseurs[i];
    // Les pièces de CE plan, pas son catalogue : sa remarque du 19 octobre 2026 sur
    // Point P. Tous ses prix chez ce fournisseur vivent dans Réglages, sur sa fiche.
    $("feuille-titre").textContent = "Ce plan chez " + f.nom;
    $("feuille-sous").textContent = "Les " + LIGNES.length + " pièces de ce plan, lues sur son devis. Tous vos prix chez " + f.nom + " sont dans Réglages, sur sa fiche. Rien n’est enregistré avant votre appui.";
    $("lu").innerHTML = LIGNES.map(function (l, k) {
      var v = f.prix[l.cle];
      return '<div class="ligne">' + vignette(l.cle) + '<span class="n">' + texte(l.nom) + (l.ref ? "<small>" + texte(l.ref) + "</small>" : "") + "</span>" +
        '<input inputmode="decimal" data-lu="' + k + '" placeholder="Prix HT" aria-label="Prix ' + texte(l.nom) + '" value="' + (v != null ? String(v).replace(".", ",") : "") + '"></div>';
    }).join("");
    $("feuille").hidden = false;
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.vue) { vue = b.dataset.vue; dessinerFournisseurs(); dessinerPlan(); return; }
    if (b.id === "fermer") { $("feuille").hidden = true; return; }
    if (b.id === "enregistrer") {
      var f = fournisseurs[lecture];
      document.querySelectorAll("[data-lu]").forEach(function (inp) {
        var p = lirePrix(inp.value), cle = LIGNES[Number(inp.dataset.lu)].cle;
        if (p === null) delete f.prix[cle]; else f.prix[cle] = p;
      });
      f.date = aujourdhui;
      $("feuille").hidden = true; dessinerFournisseurs(); dessinerPlan(); return;
    }
    if (b.id === "ajouter-fournisseur") {
      var nom = $("nom-fournisseur").value.trim();
      if (!nom) return;
      fournisseurs.push({ nom: nom, date: null, prix: {} }); $("nom-fournisseur").value = "";
      dessinerFournisseurs(); return;
    }
  });

  // La photo ou le fichier choisi : la planche ne le lit pas ; dans l'outil, l'IA le lit.
  document.addEventListener("change", function (e) {
    var i = e.target.dataset && e.target.dataset.devis;
    if (i === undefined || !e.target.files[0]) return;
    e.target.value = "";
    ouvrirDevis(Number(i));
  });

  dessinerFournisseurs();
  dessinerPlan();
})();
</script>
