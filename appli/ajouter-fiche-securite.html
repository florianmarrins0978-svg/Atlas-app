<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajouter sur la fiche de sécurité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --etabli:#e6e3dc; --etabli-carte:#faf9f5; --etabli-trait:rgba(28,28,26,.12);
    --etabli-encre:#1c1c1a; --etabli-doux:#4a4a44; --etabli-gris:#77726a; --etabli-or:#8b6835;
    --serif:"Playfair Display",ui-serif,Georgia,serif;
    --sans:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;

    --cream:#f5f3ee; --card:#faf9f5; --ink:#1c1c1a; --inkSoft:#4a4a44; --muted:#8a8578;
    --rust:#2f3b2f; --rustTint:#ece9e1; --plein:#7d9a6d; --surPlein:#faf9f5;
    --pleinVoile:rgba(125,154,109,.16); --vertPale:#b9c6b4;
    --or:#B98B47; --orTexte:#8b6835; --line:rgba(28,28,26,.12); --lineSoft:rgba(28,28,26,.07);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--etabli)}
  body{font-family:var(--sans);color:var(--etabli-encre);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}

  .page{max-width:1240px;margin:0 auto;padding:30px 16px 90px}
  .surtitre{font:600 11.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--etabli-or);margin:0 0 10px}
  h1{font:600 30px/1.15 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
  .chapeau{max-width:680px;color:var(--etabli-doux);font-size:15.5px;line-height:1.6;margin:0 0 22px}

  .tel{width:390px;max-width:100%;border-radius:26px;overflow:hidden;
       box-shadow:0 1px 2px rgba(20,18,14,.16),0 14px 34px rgba(20,18,14,.14);background:var(--cream)}
  .ecran{height:680px;display:flex;flex-direction:column;background:var(--cream);color:var(--ink)}
  .corps{flex:1;overflow-y:auto;padding:14px 16px 24px}

  .entete{display:flex;align-items:center;gap:6px;padding:8px 10px 0;min-height:58px}
  .retour{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--rust);background:none;border:0}
  .quoi{flex:1;min-width:0;line-height:1.15}
  .quoi b{display:block;font:400 17px/1.15 var(--serif)}
  .quoi span{display:block;margin-top:1px;font-size:12px;color:var(--muted)}
  .etape{flex:none;font-size:12.5px;font-weight:600;color:var(--orTexte)}
  .avancee{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 16px 0}
  .avancee i{display:block;height:3px;border-radius:2px;background:var(--line)}
  .avancee i.fait{background:var(--or)} .avancee i.ici{background:var(--rust)}

  h2{font:400 24px/1.15 var(--serif);margin:0 0 4px}
  .bloc{margin-top:16px;border-top:1px solid var(--lineSoft);padding-top:14px}
  .bloc.premier{margin-top:8px;border-top:0;padding-top:0}
  .titreBloc{margin:0 0 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;line-height:1}
  .explication{margin:-2px 0 12px;font-size:14px;line-height:1.45;color:var(--inkSoft)}
  .aide{margin:0 0 10px;font-size:12.5px;line-height:1.45;color:var(--muted)}
  .aide.haut{margin-top:12px}
  .aide b{color:var(--inkSoft);font-weight:600}
  .vigilance{margin:8px 0;padding-left:12px;border-left:2px solid var(--or);font-size:13.5px;line-height:1.45;color:var(--inkSoft)}
  .vigilance b{margin-right:4px;font-weight:600;color:var(--orTexte)}

  .groupe{display:flex;flex-wrap:wrap;gap:6px}
  .pastille{display:inline-flex;min-height:44px;align-items:center;gap:7px;border:0;border-radius:999px;
            padding:8px 14px 8px 12px;text-align:left;font-size:14px;line-height:1.2;color:var(--ink);
            background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  .pastille .rond{width:18px;height:18px;flex:none;border-radius:999px;display:grid;place-items:center;
                  box-shadow:inset 0 0 0 1.5px var(--vertPale);color:transparent}
  .pastille.cochee{background:var(--pleinVoile);box-shadow:inset 0 0 0 1.5px var(--plein)}
  .pastille.cochee .rond{background:var(--plein);box-shadow:none;color:var(--surPlein)}
  .ajouter{display:inline-flex;min-height:44px;align-items:center;gap:6px;border:0;border-radius:999px;
           padding:8px 14px 8px 10px;font-size:14px;background:var(--pleinVoile);color:var(--rust);
           box-shadow:inset 0 0 0 1px var(--vertPale)}
  .saisie{margin-top:8px;display:flex;gap:8px;width:100%;flex-basis:100%}
  .saisie input{flex:1;min-width:0;min-height:46px;border:0;border-radius:10px;padding:10px 12px;font:16px var(--sans);
                background:var(--card);box-shadow:inset 0 0 0 1px var(--or);color:var(--ink);caret-color:var(--or);outline:none}
  .saisie button{min-height:46px;border:0;border-radius:999px;padding:0 18px;font:15px var(--serif);background:var(--plein);color:var(--surPlein)}

  .pied{padding:10px 16px 14px;background:linear-gradient(to top,var(--cream) 68%,rgba(245,243,238,0))}
  .vert{display:flex;margin:0 auto;min-height:46px;align-items:center;justify-content:center;border:0;border-radius:999px;
        padding:0 26px;font:15.5px var(--serif);background:var(--plein);color:var(--surPlein)}
  .basNav{display:flex;justify-content:space-around;padding:12px 8px 15px;border-top:1px solid var(--line);background:var(--cream)}
  .basNav span{font:500 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .basNav .actif{color:var(--ink)}

  .temoin{width:390px;max-width:100%;margin-top:16px;background:var(--etabli-carte);border-radius:16px;padding:14px 16px;
          box-shadow:inset 0 0 0 1px var(--etabli-trait)}
  .temoin .t{display:flex;justify-content:space-between;align-items:center;font:600 11px/1 var(--sans);letter-spacing:.14em;
             text-transform:uppercase;color:var(--etabli-or);margin-bottom:10px}
  .attente{font:500 11.5px/1.3 var(--sans);letter-spacing:0;text-transform:none;color:var(--etabli-gris)}
  .temoin h3{margin:10px 0 4px;font:600 12.5px/1.3 var(--sans);color:var(--etabli-doux)}
  .temoin ul{margin:0;padding:0 0 0 18px;font-size:13.5px;line-height:1.55;color:var(--etabli-doux)}
  .temoin .rien{margin:0;font-size:13.5px;color:var(--etabli-gris);font-style:italic}
  .flash{animation:flash 1.2s ease-out}
  @keyframes flash{from{background:#efe3cc}to{background:var(--etabli-carte)}}
  .recommencer{margin-top:12px;border:0;border-radius:999px;padding:11px 17px;font:600 12.5px/1 var(--sans);
               background:var(--etabli-encre);color:var(--etabli-carte)}
</style>
</head>
<body>
<main class="page">
  <p class="surtitre">Fiche de sécurité</p>
  <h1>Ajouter un mot à la fiche</h1>
  <p class="chapeau">Appuyez sur Ajouter, écrivez un mot ou rien, puis regardez ce qui s'enregistre.</p>

  <div class="tel"><div class="ecran">
    <div id="haut"></div>
    <div class="corps" id="corps"></div>
    <div class="pied" id="pied"></div>
    <div class="basNav"><span>Accueil</span><span class="actif">Planning</span><span>Clients</span><span>Devis</span></div>
  </div></div>

  <div class="temoin" id="temoin">
    <div class="t"><span>Enregistré</span><span class="attente" id="attente"></span></div>
    <div id="liste"></div>
  </div>
  <button class="recommencer" type="button" id="recommencer">Recommencer</button>
</main>

<script>
const LIBELLES = {
  travaux: ["Éhoupage","Élagage de formation","Élagage d’entretien","Haubanage","Démontage avec rétention","Démontage sans rétention","Abattage directionnel","Abattage non directionnel","Ébranchage","Billonnage","Broyage","Évacuation des rémanents","Rognage / essouchage"],
  coupe: ["Tronçonneuse élagueuse","Tronçonneuse abatteuse","Lamier d’élagage","Scie sur perche","Sécateur"],
  autresMateriels: ["Broyeur","Essoucheuse / Rogneuse","Treuil / Câble","Mini chargeur","Souffleur"]
};
const NOMS = { travaux: "Travaux", coupe: "Matériels de coupe", autresMateriels: "Matériels autres" };
const EXEMPLES = { travaux: "Exemple : taille de réduction" };

let contenu, envoye, memoire, enCours, mot, etape, minuterie;

function vide(){ return { coches:{}, ajouts:{} }; }
function copie(c){ return JSON.parse(JSON.stringify(c)); }
function liste(c,f){ return [...LIBELLES[f], ...(c.ajouts[f] || [])]; }
function estCoche(c,f,l){ return (c.coches[f] || []).includes(l); }
function cocher(c,f,l){
  const avant = c.coches[f] || [];
  const apres = avant.includes(l) ? avant.filter(x => x !== l) : [...avant, l];
  return { ...c, coches: { ...c.coches, [f]: apres } };
}
function ajouter(c,f,m){
  const propre = m.trim();
  if (!propre) return c;
  const deja = liste(c,f).includes(propre);
  const ajouts = deja ? c.ajouts : { ...c.ajouts, [f]: [...(c.ajouts[f] || []), propre] };
  const suivant = { ...c, ajouts };
  return estCoche(suivant,f,propre) ? suivant : cocher(suivant,f,propre);
}

function depart(){
  clearTimeout(minuterie);
  contenu = vide(); envoye = vide(); memoire = { ajouts:{} };
  enCours = null; mot = ""; etape = 2;
  dessiner(); temoin(false);
}

function changer(nouveau){
  contenu = nouveau;
  clearTimeout(minuterie);
  if (JSON.stringify(contenu) !== JSON.stringify(envoye)) {
    document.getElementById("attente").textContent = "part dans 2 secondes";
    minuterie = setTimeout(enregistrer, 2000);
  }
  dessiner();
}
function enregistrer(){
  clearTimeout(minuterie);
  const neuf = JSON.stringify(contenu) !== JSON.stringify(envoye);
  envoye = copie(contenu);
  memoire = { ajouts: copie(contenu.ajouts) };
  temoin(neuf);
}

const coche = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8.4 6.3 11.7 13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const plus = '<svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
const chevron = '<svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M12.5 4 6.5 10l6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function echapper(s){ return s.replace(/[&<>"]/g, x => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[x]); }

function groupe(f){
  let h = '<div class="groupe">';
  liste(contenu,f).forEach((l,i) => {
    const c = estCoche(contenu,f,l);
    h += `<button type="button" class="pastille${c ? " cochee" : ""}" data-f="${f}" data-i="${i}"><span class="rond">${coche}</span><span>${echapper(l)}</span></button>`;
  });
  if (enCours === f) {
    h += `<div class="saisie"><input type="text" autocomplete="off" id="mot" value="${echapper(mot)}" placeholder="${EXEMPLES[f] || "Exemple : camion-grue"}"><button type="button" id="valider">Ajouter</button></div>`;
  } else {
    h += `<button type="button" class="ajouter" data-ajouter="${f}">${plus} Ajouter</button>`;
  }
  return h + "</div>";
}

function dessiner(){
  const barres = [1,2,3,4,5,6].map(n => `<i class="${n < etape ? "fait" : n === etape ? "ici" : ""}"></i>`).join("");
  document.getElementById("haut").innerHTML =
    `<div class="entete"><button class="retour" type="button" aria-label="Retour" id="retour">${chevron}</button>
     <span class="quoi"><b>Fiche de sécurité</b><span>Élagage des tilleuls, Mme Garnier</span></span>
     <span class="etape">${etape} sur 6</span></div><div class="avancee">${barres}</div>`;
  const corps = document.getElementById("corps");
  if (etape === 2) {
    corps.innerHTML = `<h2>Les travaux</h2>
      <div class="bloc premier"><p class="titreBloc">Travaux à réaliser</p>
        <p class="explication">Cochez ce que vous allez faire aujourd’hui sur ce chantier.</p>
        <p class="aide">Le devis dit : <b>Élagage de trois tilleuls, évacuation des déchets verts</b>.</p>
        ${groupe("travaux")}
        <p class="vigilance"><b>Point de vigilance</b>Moyens de prévention mis en œuvre, EPI appropriés à l’activité et aux travailleurs…</p>
      </div>
      <div class="bloc"><p class="titreBloc">Matériels</p>
        <p class="explication">Cochez le matériel que vous allez utiliser sur ce chantier.</p>
        <p class="aide haut">Matériels de coupe</p>
        <p class="vigilance"><b>Point de vigilance</b>Distance de sécurité à respecter vis-à-vis des matériels</p>
        ${groupe("coupe")}
        <p class="aide haut">Matériels autres</p>
        ${groupe("autresMateriels")}
        <p class="aide haut">Ce que vous ajoutez reste pour vos prochaines fiches.</p>
      </div>`;
  } else {
    corps.innerHTML = `<h2>Le terrain</h2><p class="explication" style="margin-top:12px">Suite de la fiche. Revenez avec la flèche en haut à gauche.</p>`;
  }
  document.getElementById("pied").innerHTML = `<button class="vert" type="button" id="suivant">Suivant</button>`;

  corps.querySelectorAll(".pastille").forEach(b => b.onclick = () => {
    const f = b.dataset.f; changer(cocher(contenu, f, liste(contenu,f)[+b.dataset.i]));
  });
  corps.querySelectorAll("[data-ajouter]").forEach(b => b.onclick = () => { enCours = b.dataset.ajouter; mot = ""; dessiner(); });
  const champ = document.getElementById("mot");
  if (champ) {
    champ.focus({ preventScroll: true });
    champ.oninput = e => { mot = e.target.value; };
    champ.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); valider(); } };
    document.getElementById("valider").onclick = valider;
  }
  document.getElementById("suivant").onclick = () => {
    if (etape === 2) { enregistrer(); mot = ""; etape = 3; dessiner(); document.getElementById("corps").scrollTop = 0; }
    else enregistrer();
  };
  document.getElementById("retour").onclick = () => {
    if (etape === 3) { etape = 2; mot = ""; dessiner(); }
  };
}
function valider(){
  const f = enCours; enCours = null;
  const m = mot; mot = "";
  changer(ajouter(contenu, f, m));
}

function temoin(flash){
  document.getElementById("attente").textContent = "";
  let h = "";
  const familles = Object.keys(LIBELLES);
  const cochees = familles.flatMap(f => (envoye.coches[f] || []).map(l => l));
  const ajoutes = familles.flatMap(f => (envoye.ajouts[f] || []).map(l => `${l} (${NOMS[f].toLowerCase()})`));
  const garde = familles.flatMap(f => (memoire.ajouts[f] || []));
  if (!cochees.length && !ajoutes.length) h = '<p class="rien">Rien pour l’instant.</p>';
  if (ajoutes.length) h += "<h3>Vos mots, sur cette fiche</h3><ul>" + ajoutes.map(x => `<li>${echapper(x)}</li>`).join("") + "</ul>";
  if (cochees.length) h += "<h3>Cases cochées</h3><ul>" + cochees.map(x => `<li>${echapper(x)}</li>`).join("") + "</ul>";
  if (garde.length) h += "<h3>Repris sur vos prochaines fiches</h3><ul>" + garde.map(x => `<li>${echapper(x)}</li>`).join("") + "</ul>";
  document.getElementById("liste").innerHTML = h;
  const t = document.getElementById("temoin");
  if (flash) { t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash"); }
}

document.getElementById("recommencer").onclick = depart;
depart();
</script>
</body>
</html>
