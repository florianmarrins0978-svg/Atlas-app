# Environnement d'essai complet, prêt à l'emploi (GitHub Codespaces ou
# Dev Containers en local).
#
# Reprend les services de `docker-compose.yml` à la racine — mêmes images,
# mêmes rôles PostgreSQL restreints — et y ajoute le conteneur qui fait
# tourner l'application. C'est ce qui permet d'ouvrir l'application entière
# depuis un téléphone, sans installer quoi que ce soit ni ouvrir de compte
# chez qui que ce soit.
#
# Les mots de passe sont ceux du développement local, en clair et versionnés :
# ces services ne sont joignables que depuis l'intérieur du conteneur, jamais
# depuis l'extérieur. Y mettre de vrais secrets donnerait l'illusion d'une
# sécurité que ce montage n'a pas — et n'a pas à avoir.

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://atlas_app:atlas_app_dev_pw@postgres:5432/atlas_dev
      DATABASE_ADMIN_URL: postgresql://atlas_owner:atlas_owner_dev_pw@postgres:5432/atlas_dev
      DATABASE_SUPER_URL: postgresql://postgres:postgres_dev_pw@postgres:5432/atlas_dev
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: essai-local-non-utilise-en-production-0000
      CRON_SECRET: essai-local-cron-secret-0000000000
      # --- IA -------------------------------------------------------------
      #
      # **Ce bloc porte deux correctifs du 6 août 2026, et il ne faut défaire
      # ni l'un ni l'autre.**
      #
      # Le premier : un secret d'espace de travail existe côté hôte, pas à
      # l'intérieur d'un conteneur décrit par docker-compose. La liste ci-
      # dessous est explicite, et **ce qui n'y figure pas n'existe pas** — c'est
      # déjà ce qui avait coûté une demi-journée avec `CODESPACE_NAME` (voir
      # plus bas). D'où le repli `:-` : un secret posé dans Codespaces
      # (Settings → Codespaces → Repository secrets) traverse jusqu'ici.
      #
      # Le second : `LLM_PROVIDER` valait `dev` **en dur**, puis par défaut.
      # Le patron avait posé ses clés et son application restait déterministe,
      # parce qu'il fallait AUSSI nommer le fournisseur — deux fois de suite,
      # c'est là qu'il s'est arrêté. Ces deux lignes restent donc VIDES : la
      # présence d'une clé décide (`src/server/env.ts`), et les renseigner ne
      # sert qu'à forcer un choix contraire — typiquement `LLM_PROVIDER=dev`
      # pour couper l'IA sans retirer les clés.
      #
      # Une variable vide vaut une variable absente (`optionnel()`) : sans clé,
      # rien ne sort, et c'est l'état par défaut du banc d'essai — aucune donnée
      # d'essai envoyée à un prestataire qui ne figure dans aucun contrat
      # (docs/A-FAIRE.md §1).
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Marque un conteneur construit APRÈS le correctif du 6 août 2026. Sa
      # présence signifie : « ce que tu lis dans les deux lignes de fournisseur
      # a été voulu ». Son absence signale un espace plus ancien, où `dev` était
      # écrit en dur — et où `reglage-ia.sh` neutralise donc ce réglage figé
      # plutôt que d'exiger une reconstruction introuvable sur un téléphone.
      ATLAS_CONTENEUR: "2"
      STORAGE_PROVIDER: local
      # L'installation des dépendances télécharge sinon les navigateurs de
      # Playwright — plusieurs centaines de mégaoctets et quelques minutes, pour
      # des suites de tests dont on n'a pas l'usage ici. Celui qui voudrait les
      # jouer dans cet environnement lance `npx playwright install chromium`.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Reprises de l'environnement de Codespaces, qui n'entre PAS tout seul
      # dans un conteneur décrit par docker-compose : la liste ci-dessus est
      # explicite, et ce qui n'y figure pas n'existe pas à l'intérieur.
      #
      # Leur absence a coûté une demi-journée : sans `CODESPACE_NAME`,
      # `allowedOrigins` restait vide (next.config.ts) et Next.js refusait
      # toute action serveur — donc la connexion elle-même, avec pour seul
      # message « Invalid Server Actions request. ». L'application démarrait
      # parfaitement ; elle refusait simplement d'ouvrir sa porte.
      #
      # `npm run essai` s'en sert aussi pour annoncer l'adresse exacte à ouvrir.
      # Autorise le middleware à aligner l'hôte vu par Next.js sur l'origine du
      # navigateur (src/middleware.ts). Sans cela, la connexion est refusée
      # derrière le proxy de Codespaces. Posée ICI et nulle part ailleurs :
      # aucune configuration de production ne la contient.
      ATLAS_BANC_ESSAI: "1"
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_pw
      POSTGRES_DB: atlas_dev
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
      - ../docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  atlas-pgdata:
