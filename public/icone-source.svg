<!--
  Icône PROVISOIRE d'Atlas, en attendant un vrai logo.

  Un « A » bâti comme un chevron de charpente, sur le fond crème de
  l'application. Volontairement simple : une icône provisoire qui chercherait à
  bien faire donne l'illusion d'une décision prise, et personne ne la remplace
  jamais.

  Source unique : les fichiers PNG du dossier public/icones/ sont RÉGÉNÉRÉS
  depuis ce fichier par `npm run icones`. Ne pas les retoucher à la main.

  Pour changer le logo : remplacer ce fichier, relancer `npm run icones`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#F6F1E6"/>
  <!-- Le chevron : deux jambages et leur entrait, comme une ferme de toit. -->
  <path d="M256 108 L392 404" fill="none" stroke="#C0621F" stroke-width="44" stroke-linecap="round"/>
  <path d="M256 108 L120 404" fill="none" stroke="#C0621F" stroke-width="44" stroke-linecap="round"/>
  <path d="M178 300 L334 300" fill="none" stroke="#C0621F" stroke-width="40" stroke-linecap="round"/>
</svg>
