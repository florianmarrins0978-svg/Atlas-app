<!--
  Icône de Cause : le « C » de la serif des devis, en vert pin sur crème, et le
  point d'or des titres du site. Son choix du 18 novembre 2026 : « je prends la
  C de la première planche » (appli/icone-de-cause.html).

  Le « C » est un contour, pas du texte : il a été relevé par fontkit dans
  src/server/pdf/polices/atlas-archive-serif. Aucune police n'est donc
  nécessaire pour le rendre, et `npm run icones` donne la même image sur
  n'importe quelle machine.

  LE DESSIN TIENT DANS LE CERCLE CENTRAL DE 80 % (rayon 204,8 sur 512) : c'est
  ce qu'Android garde quand il découpe l'icône en rond. Le point d'or s'y arrête
  à 183 du centre. C'est pour cela que l'icône d'Android est rendue sans marge
  (`scripts/generer-icones.mjs`) : réduire encore rapetisserait le C. Un dessin
  qui déborderait de ce cercle serait rogné sur Android.

  Source unique : les PNG de public/icones/ et src/app/favicon.ico sont
  RÉGÉNÉRÉS depuis ce fichier par `npm run icones`. Ne pas les retoucher à la main.
-->
