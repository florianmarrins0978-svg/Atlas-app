<!doctype html>
<!--
  Maquette — remplacer « Nouveau chantier » par « Créer un devis ».

  Demande du patron le 17 août 2026, sur l'écran d'accueil des chantiers.
  On MONTRE avant de toucher à src/ (CLAUDE.md §3 bis). Rien d'autre ne change :
  même mise en page, même rond, même geste. Seuls les mots du bouton changent.
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --cream: #f5f3ee;
    --card: #faf9f5;
    --ink: #1c1c1a;
    --inkSoft: #4a4a44;
    --muted: #8a8578;
    --or: #B98B47;
    --pine: #2f3b2f;
    --line: rgba(28,28,26,0.12);
    --display: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --body: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); font-family: var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .ecran { width: 390px; min-height: 844px; margin: 0 auto; display: flex; flex-direction: column; }
  .contenu { flex: 1; padding: 26px; }

  .atlas { text-align: center; font-size: 13px; letter-spacing: 0.34em; color: var(--ink); font-weight: 600; padding-top: 6px; }

  .bonjour { color: var(--or); font-size: 12px; letter-spacing: 0.2em; font-weight: 600; margin-top: 48px; }
  .titre-rang { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 10px; }
  h1 { font-family: var(--display); font-size: 46px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; }
  .bulle { width: 56px; height: 56px; border-radius: 9999px; background: var(--pine); display: grid; place-items: center; flex-shrink: 0; margin-top: 6px; }
  .bulle svg { width: 24px; height: 24px; }

  .encours-haut { color: var(--muted); font-size: 13px; letter-spacing: 0.18em; margin-top: 22px; }
  .clients { color: var(--or); font-size: 13px; letter-spacing: 0.18em; font-weight: 600; margin-top: 12px; }

  .filet { height: 1px; background: var(--line); margin: 26px 0 0; }

  .geste { display: flex; align-items: center; justify-content: center; gap: 13px; padding: 24px 0 2px; }
  .mot { font-size: 13px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; color: var(--ink); }
  .rond { position: relative; width: 42px; height: 42px; border-radius: 9999px; display: grid; place-items: center; border: 1px solid var(--line); }
  .rond .plus { position: relative; width: 15px; height: 15px; }
  .rond .plus::before, .rond .plus::after { content: ""; position: absolute; background: var(--or); }
  .rond .plus::before { left: 7px; top: 0; width: 1.5px; height: 15px; }
  .rond .plus::after { top: 7px; left: 0; height: 1.5px; width: 15px; }

  .ligne-encours { display: flex; align-items: baseline; justify-content: space-between; margin-top: 34px; }
  .ligne-encours .g { color: var(--muted); font-size: 13px; letter-spacing: 0.18em; }
  .ligne-encours .d { color: var(--muted); font-size: 13px; letter-spacing: 0.18em; }

  .vide { color: var(--inkSoft); font-size: 17px; line-height: 1.5; margin-top: 28px; max-width: 30ch; }

  nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 26px 26px; border-top: 1px solid var(--line); }
  nav span { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
  nav .actif { color: var(--ink); position: relative; }
  nav .actif::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; background: var(--or); }
</style>
</head>
<body>
  <div class="ecran">
    <div class="contenu">
      <div class="atlas">ATLAS</div>

      <div class="bonjour">BONJOUR COMPTE</div>
      <div class="titre-rang">
        <h1>Vos chantiers</h1>
        <div class="bulle" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f5f3ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.6-.8L3 21l1.9-5.4A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/>
          </svg>
        </div>
      </div>
      <div class="encours-haut">ZÉRO EN COURS</div>
      <div class="clients">VOS CLIENTS ›</div>

      <div class="filet"></div>

      <div class="geste">
        <span class="mot">Créer un devis</span>
        <span class="rond"><span class="plus"></span></span>
      </div>

      <div class="ligne-encours"><span class="g">EN COURS</span><span class="d">ZÉRO</span></div>

      <p class="vide">Aucun chantier pour l'instant. Créez votre premier chantier pour commencer.</p>
    </div>

    <nav>
      <span class="actif">CHANTIERS</span>
      <span>PLANNING</span>
      <span>TERMINÉS</span>
      <span>PAYSAGE</span>
      <span>RÉGLAGES</span>
    </nav>
  </div>
</body>
</html>
