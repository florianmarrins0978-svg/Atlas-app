name: Publication de l'appli sur GitHub Pages

# Publie le contenu de `appli/` (les écrans copiés depuis Arborea, sans le site
# vitrine) à la racine du site projet : https://<compte>.github.io/Atlas-app/
#
# L'application Next.js à la racine du dépôt n'est pas concernée : elle a besoin
# d'un serveur (base de données, routes API) et ne peut pas être servie par
# Pages, qui est purement statique.
#
# La batterie de tests est un préalable au déploiement, conformément à
# `appli/tests/README.md` (« à lancer avant chaque mise en ligne ») : si un test
# échoue, rien n'est publié et la version en ligne reste celle d'avant.

on:
  push:
    branches: [main]
    paths:
      - "appli/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: appli/package-lock.json

      - name: Installer les dépendances
        working-directory: appli
        run: npm ci

      - name: Installer le navigateur Playwright
        working-directory: appli
        run: npx playwright install --with-deps chromium

      # Les écrans sont des fichiers statiques : un serveur de fichiers suffit,
      # et c'est exactement ce que GitHub Pages fera en production. Le serveur
      # est démarré et arrêté dans la même étape que les tests, pour qu'aucun
      # processus ne survive à un échec.
      - name: Tests de bout en bout
        working-directory: appli
        run: |
          set -e
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          SERVEUR=$!
          trap 'kill $SERVEUR 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/app.html >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/app.html >/dev/null
          BASE_URL=http://127.0.0.1:8080 npm run test:e2e
          # **Les suites de l'arrosage gardent le calcul, pas les écrans.** Elles
          # étaient jouées à la main jusqu'au 18 août — et ce jour-là, un morceau
          # de calcul resté dans `arrosage.html` a mis la liste des pièces à zéro
          # sur la page du croquis sans qu'aucune suite jouée en ligne ne le
          # voie. Une suite qui ne barre pas la publication ne barre rien.
          BASE_URL=http://127.0.0.1:8080 npm run test:arrosage
          BASE_URL=http://127.0.0.1:8080 npm run test:croquis

  deploy:
    name: Déploiement
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Seul `appli/` est publié : le reste du dépôt (code serveur Next.js,
      # migrations, scripts d'exploitation) n'a rien à faire sur un site public.
      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: appli

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Vérification de ce qui est RÉELLEMENT servi au public, une fois la
  # publication faite. Le job « tests » ci-dessus exerce les fichiers du dépôt
  # avant qu'ils partent ; celui-ci exerce le site en ligne, à son adresse
  # publique, tel qu'un artisan l'ouvrira depuis son téléphone. Les deux ne
  # prouvent pas la même chose : entre les deux se glissent le découpage de
  # l'artefact, la propagation, le chemin de sous-dossier /Atlas-app/ et le
  # passage en HTTPS.
  #
  # C'est aussi ce qui rend la vérification autonome : le résultat de ce job se
  # lit par l'API GitHub, sans dépendre d'un accès direct au site.
  verification:
    name: Vérification du site en ligne
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: appli/package-lock.json

      - name: Installer les dépendances
        working-directory: appli
        run: npm ci

      - name: Installer le navigateur Playwright
        working-directory: appli
        run: npx playwright install --with-deps chromium

      # La toute première publication, et parfois les suivantes, mettent un
      # moment à se propager. On attend une vraie réponse plutôt que d'échouer
      # sur un site simplement pas encore prêt.
      - name: Attendre que le site réponde
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          BASE="${PAGE_URL%/}"
          echo "Adresse publiée : $BASE"
          for tentative in $(seq 1 40); do
            if curl -sfL --max-time 10 "$BASE/app.html" >/dev/null; then
              echo "Le site répond après $tentative tentative(s)."
              exit 0
            fi
            sleep 15
          done
          echo "Le site n'a pas répondu après 10 minutes."
          exit 1

      # Chaque écran doit être servi, pas seulement l'accueil : une erreur de
      # chemin ou un fichier oublié dans l'artefact ne se voit pas autrement.
      - name: Vérifier que chaque écran est servi
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          BASE="${PAGE_URL%/}"
          # `essais.html` est L'ADRESSE QU'ON LUI DONNE : si elle ne répond pas,
          # tout le reste est inutile. Ajoutée le 18 août 2026 après qu'il a
          # écrit « quand je fais pour cliquer, je ne peux pas cliquer » — une
          # adresse transmise sans preuve qu'elle répond n'est pas une adresse.
          #
          # **LA LISTE SE DÉDUIT D'`essais.html`, elle ne se tient plus à la
          # main.** Le 20 août 2026, deux pages liées depuis l'entrée du patron
          # n'y figuraient pas — dont `moins-de-mots.html`, écrite la veille
          # pour sa plainte « trop de mots ». Une liste tenue à la main
          # s'oublie à chaque page neuve, et l'oubli ne se voit pas : le flux
          # passe au vert en ayant vérifié les autres. Ce qu'on lui donne à
          # cliquer est donc exactement ce qu'on vérifie.
          LIES=$(grep -o 'href="[^"#:]*\.\(html\|js\)"' appli/essais.html \
                 | sed 's/href="//; s/"$//' | sort -u)
          echo "Pages liées depuis essais.html :"; echo "$LIES"
          # Ceux-là ne sont liés de nulle part et doivent répondre quand même :
          # la racine du site, l'entrée elle-même, et les deux scripts que les
          # pages chargent.
          #
          # `deux-boutons-devis.html` et `en-cours-le-chiffre.html` ont quitté
          # cette liste le 20 août : elles sont désormais LIÉES depuis
          # `essais.html`, donc déduites comme les autres. C'était la condition
          # écrite ici la veille — le patron peut les ouvrir depuis la seule
          # adresse qu'on lui ait donnée.
          #
          # `arrosage-simple.html` s'y ajoute pour une raison différente, et
          # voulue : le patron a demandé le 20 août de **ne plus la mettre dans
          # `essais.html`** — *« arrête de me le mettre dans Atlas app essai »*.
          # Elle se donne par son adresse directe. Sans cette ligne, la liste
          # déduite ne la verrait pas, et on lui transmettrait une adresse dont
          # rien ne prouve qu'elle répond.
          # `arrosage-plan.html` rejoint la liste le 21 août, pour la même
          # raison : elle se donne par son adresse directe, pas depuis
          # `essais.html`. Sans cette ligne, on lui transmettrait une adresse
          # dont rien ne prouve qu'elle répond — c'est déjà arrivé, et c'est LUI
          # qui avait fait le test.
          for f in index.html essais.html nav.js arrosage-catalogue.js \
                   arrosage-simple.html arrosage-plan.html $LIES; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/$f")
            echo "$code  $f"
            [ "$code" = "200" ] || { echo "Écran manquant ou en erreur : $f"; exit 1; }
          done

      # La racine ne doit pas tomber sur une page vide : le site vitrine n'étant
      # pas repris, elle doit mener à l'accueil de l'appli.
      - name: Vérifier que la racine mène à l'appli
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          BASE="${PAGE_URL%/}"
          racine=$(curl -sfL --max-time 20 "$BASE/")
          echo "$racine" | grep -q 'app\.html' || {
            echo "La racine ne renvoie pas vers app.html."; exit 1; }
          echo "La racine pointe bien vers l'accueil de l'appli."

      # Le point d'orgue : toute la batterie rejouée contre le site public.
      - name: Batterie de tests contre le site en ligne
        working-directory: appli
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          BASE_URL="${PAGE_URL%/}" npm run test:e2e
