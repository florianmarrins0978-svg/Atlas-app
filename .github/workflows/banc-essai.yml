name: Banc d'essai

# Monte l'espace de travail complet et s'en sert, comme le ferait le patron.
#
# Pourquoi ce workflow existe : l'environnement de développement de l'agent n'a
# ni démon Docker, ni GitHub CLI. Le banc d'essai y est donc invérifiable — et
# il a été livré trois fois de suite avec un défaut que seul le patron
# rencontrait : un script manquant, une application pas encore prête, un port
# fermé. À chaque fois, c'est lui qui a fait le test.
#
# Ce qui ne peut pas être éprouvé là où on développe doit l'être ailleurs, par
# une machine. C'est la même réponse que pour le site publié, que le workflow
# `pages.yml` vérifie à son adresse réelle.

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "docker/init/**"
      - "scripts/essai.mjs"
      - "scripts/banc.mjs"
      - "scripts/verifier-connexion.mjs"
      # **La connexion est éprouvée ici, donc son code doit déclencher ce
      # contrôle.** Le 12 août 2026, deux correctifs de connexion sont partis
      # sur `main` sans que ce workflow ne s'en aperçoive : ses déclencheurs ne
      # regardaient que l'outillage du banc, jamais ce qui laisse entrer.
      - "src/app/login/**"
      - "src/server/rate-limit/**"
      - "src/auth.ts"
      - "src/server/db/seed.ts"
      - "drizzle/**"
      - "package.json"
      - ".github/workflows/banc-essai.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - "docker/init/**"
      - "scripts/essai.mjs"
      - "scripts/banc.mjs"
      - "scripts/verifier-connexion.mjs"
      # **La connexion est éprouvée ici, donc son code doit déclencher ce
      # contrôle.** Le 12 août 2026, deux correctifs de connexion sont partis
      # sur `main` sans que ce workflow ne s'en aperçoive : ses déclencheurs ne
      # regardaient que l'outillage du banc, jamais ce qui laisse entrer.
      - "src/app/login/**"
      - "src/server/rate-limit/**"
      - "src/auth.ts"
      - "src/server/db/seed.ts"
      - "drizzle/**"
      - "package.json"
      - ".github/workflows/banc-essai.yml"
  # Déclenchable à la main : utile après une panne signalée par le patron.
  workflow_dispatch:

jobs:
  monter-et-utiliser:
    name: Monter le banc d'essai et s'en servir
    runs-on: ubuntu-latest
    # Généreux : la première construction télécharge les images, installe les
    # dépendances, applique dix-neuf migrations et compile le premier écran.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Construit l'espace de travail à partir de .devcontainer/, services
      # compris — PostgreSQL avec ses rôles restreints, Redis — puis joue
      # `preparer.sh`, exactement comme à la création d'un Codespace.
      - name: Monter l'espace et l'éprouver
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          # **Le navigateur d'essai s'installe ICI, pas dans l'image.**
          #
          # Le contrôle du banc se connecte désormais pour de vrai, dans un vrai
          # navigateur, avec une origine étrangère — c'est la seule façon de voir
          # le « Invalid Server Actions request. » qui a coûté une demi-journée au
          # patron, et la seule qui aurait vu qu'il ne pouvait pas se connecter le
          # 12 août. Playwright manquait au conteneur : `TODO.md` le signalait
          # depuis le 9 août.
          #
          # Posé dans la commande plutôt que dans l'image, pour que l'espace du
          # patron ne porte pas trois cents mégaoctets de navigateur dont il ne
          # se sert jamais. La machine de GitHub, elle, les paie une fois par
          # exécution.
          runCmd: bash -lc "npx playwright install --with-deps chromium && bash .devcontainer/verifier.sh"
