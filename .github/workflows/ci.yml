name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lancement à la main, sur n'importe quelle branche.
  #
  # Pourquoi : une *pull request* ouverte par un agent ne déclenche PAS les
  # workflows — GitHub refuse de chaîner un événement produit par un jeton
  # d'automatisation. Constaté sur la PR #19, restée sans la moindre exécution
  # alors que les autres PR du dépôt étaient vertes. La batterie ne tournait donc
  # nulle part, et « c'est la CI qui vérifiera » était faux.
  #
  # Correction du 2026-08-05 : cette ligne affirmait que PostgreSQL et Redis ne
  # pouvaient pas tourner chez l'agent. C'était faux — seul Docker manque, les
  # binaires sont installés, et `scripts/monter-base-locale.sh` monte le tout.
  # Les suites base peuvent donc être jouées AVANT de livrer. La CI reste
  # nécessaire pour ce qui n'est vraiment pas joignable d'ici (voir
  # ARCHITECTURE.md §15 et §17).
  #
  # Onglet Actions → CI → « Run workflow » → choisir la branche.
  workflow_dispatch:
    inputs:
      branche:
        description: "Pour mémoire — la branche se choisit dans le menu au-dessus"
        required: false
        default: ""

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_pw
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # test-rate-limit-redis-real.ts vérifie la limitation de débit contre un
      # vrai Redis : la production l'exige (env.ts refuse un repli en mémoire),
      # la CI doit donc en fournir un.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_pw@localhost:5432/atlas_test
      AUTH_SECRET: ci-secret-not-a-real-production-value-000000000000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # La documentation de reprise (CLAUDE.md §2) n'a de valeur que si ses
      # chemins existent encore. Un fichier renommé sans elle envoie le lecteur
      # suivant vers une porte fermée — et c'est précisément quelqu'un qui
      # arrive sans contexte.
      - name: Vérifier la mémoire du dépôt
        run: npm run verifier:memoire

      - name: Bootstrap PostgreSQL CI
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          psql -h localhost -p 5432 -v ON_ERROR_STOP=1 -U postgres -d atlas_test -f scripts/bootstrap-postgres-ci.sql

      - name: Vérifier les rôles Postgres
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          set -e
          psql -h localhost -p 5432 -X -A -t -U postgres -d atlas_test -c "SELECT rolname, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb, rolcanlogin FROM pg_roles WHERE rolname IN ('postgres','atlas_owner','atlas_app');"
          INVALID_ROLES=$(psql -h localhost -p 5432 -X -A -t -U postgres -d atlas_test -c "SELECT rolname FROM pg_roles WHERE rolname IN ('atlas_owner','atlas_app') AND (rolsuper OR rolbypassrls);")
          if [ -n "$INVALID_ROLES" ]; then
            echo "Erreur : rôle PostgreSQL trop privilégié : $INVALID_ROLES"
            exit 1
          fi
          echo "Rôles PostgreSQL applicatifs correctement restreints."

      - name: Appliquer les migrations
        env:
          DATABASE_URL: postgresql://atlas_owner:atlas_owner_ci_pw@localhost:5432/atlas_test
        run: npm run db:migrate

      - name: Vérifier l'état RLS
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          set -e
          psql -h localhost -p 5432 -X -A -U postgres -d atlas_test -c "SELECT n.nspname, c.relname, c.relrowsecurity, c.relforcerowsecurity, pg_get_userbyid(c.relowner) AS owner FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' ORDER BY c.relname;"

      # Les suites tournent en atlas_app — rôle applicatif, soumis à RLS et sans
      # TRUNCATE — pour que les tests « fail-closed » et NOBYPASSRLS aient un
      # sens. Seul le nettoyage entre suites, opération de banc d'essai, emprunte
      # le rôle propriétaire via DATABASE_ADMIN_URL (cf. scripts/_test-db.ts).
      - name: Suite de tests (base de données)
        env:
          DATABASE_URL: postgresql://atlas_app:atlas_app_ci_pw@localhost:5432/atlas_test
          DATABASE_ADMIN_URL: postgresql://atlas_owner:atlas_owner_ci_pw@localhost:5432/atlas_test
          # **Posé le 8 août 2026, et ce n'est pas une formalité.** `CLAUDE.md`
          # §5 demande cette variable pour jouer la batterie en local ; cette
          # étape, elle, ne la posait pas. La CI ne jouait donc PAS ce que le
          # dépôt dit de jouer — et l'écart cachait un défaut réel : avec Redis,
          # une suite laissait une connexion ouverte et le processus ne rendait
          # jamais la main. En local la batterie s'arrêtait pour toujours, sans
          # un mot ; en CI tout était vert. Les deux se jouent désormais dans
          # les mêmes conditions.
          REDIS_URL: redis://localhost:6379
        run: npm test

      - name: Build de production (vérification structurelle)
        env:
          STORAGE_PROVIDER: s3
          STORAGE_S3_BUCKET: ci-placeholder-bucket
          STORAGE_S3_ACCESS_KEY_ID: ci-placeholder-key
          STORAGE_S3_SECRET_ACCESS_KEY: ci-placeholder-secret
          CRON_SECRET: ci-placeholder-cron-secret-0000000000
          # env.ts refuse tout repli en mémoire pour la limitation de débit en
          # production : le build collecte les données de page et instancie donc
          # cette configuration. On pointe le service Redis du job.
          REDIS_URL: redis://localhost:6379
          # Même raison que REDIS_URL ci-dessus : env.ts refuse en production
          # l'IA simulée, un fournisseur inconnu, ou un fournisseur privé de sa
          # clé — et le build instancie cette configuration. Ces valeurs ne
          # servent qu'à la faire passer ; aucun appel réseau n'a lieu pendant
          # un build.
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
          TRANSCRIPTION_PROVIDER: openai
          OPENAI_API_KEY: ci-placeholder-openai-key
          NODE_ENV: production
        run: npm run build

      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        env:
          # Sans CRON_SECRET, la route de purge répond 503 (« non configuré »)
          # au lieu de 401 : test-cron-purge.ts vérifie précisément le rejet
          # d'un appel non authentifié, ce qui suppose un secret configuré.
          CRON_SECRET: ci-placeholder-cron-secret-0000000000
          # Adosse la limitation de débit à Redis plutôt qu'à la mémoire du
          # serveur, pour que le runner puisse remettre à zéro le compteur de
          # connexion entre deux suites (cf. scripts/run-e2e-tests.ts).
          REDIS_URL: redis://localhost:6379
        run: npm run test:e2e

      # Se connecte pour de vrai, DEPUIS UNE ORIGINE ÉTRANGÈRE.
      #
      # Pourquoi une étape de plus alors que les suites de bout en bout
      # existent : elles interrogent toutes `127.0.0.1`, où l'en-tête Origin
      # et l'hôte coïncident. Or Next.js refuse une action serveur quand ils
      # diffèrent — ce qui est le cas derrière le proxy de Codespaces, et
      # seulement là. Le patron s'est retrouvé devant « Invalid Server Actions
      # request. » à la connexion, une demi-journée durant, alors que toutes
      # les suites étaient vertes.
      #
      # CODESPACE_NAME n'est délibérément PAS défini : c'est l'état exact de
      # son conteneur. Si la connexion passe quand même, c'est qu'elle ne
      # dépend plus de cette variable.
      - name: Se connecter réellement, derrière un proxy
        env:
          CRON_SECRET: ci-placeholder-cron-secret-0000000000
          REDIS_URL: redis://localhost:6379
        run: |
          # Les suites précédentes vident la base : le compte de démonstration
          # doit être recréé, sinon l'échec accuserait l'origine alors que
          # c'est le compte qui manque.
          npx tsx src/server/db/seed.ts
          npm run essai > /tmp/essai-connexion.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:3000/api/health/live && break
            sleep 2
          done
          node scripts/verifier-connexion.mjs || {
            echo "--- journal du serveur ---"
            tail -40 /tmp/essai-connexion.log
            exit 1
          }

  # ───────────────────────────────────────────────────────────────────────────
  # La fiche d'état part-elle vraiment ?
  #
  # **Séparé du reste, et c'est délibéré.** Cette épreuve n'a besoin ni de
  # PostgreSQL, ni de Redis, ni d'un navigateur : la coller au travail ci-dessus
  # la ferait attendre huit minutes pour vingt secondes de vérification, et un
  # échec de la base la ferait passer pour cassée à son tour.
  #
  # Elle vit ici parce qu'elle NE PEUT PAS tourner chez l'agent : le jeton que
  # sa machine expose est un substitut de son mandataire réseau, et GitHub le
  # refuse. C'est le déplacement que `CLAUDE.md` §5 prescrit — ce qui n'est pas
  # joignable d'ici s'éprouve là où il l'est.
  #
  # Ce qu'elle aurait attrapé : le 12 août 2026, le patron a redémarré son
  # espace deux fois pour une fiche qui ne pouvait pas partir.
  fiche-etat:
    runs-on: ubuntu-latest
    permissions:
      # Le strict nécessaire : ouvrir, modifier et refermer une fiche jetable.
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: La publication de la fiche d'état fonctionne de bout en bout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eprouver-publication-fiche.mjs
