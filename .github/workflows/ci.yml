name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_pw
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_pw@localhost:5432/atlas_test
      AUTH_SECRET: ci-secret-not-a-real-production-value-000000000000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Bootstrap PostgreSQL CI
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          psql -h localhost -p 5432 -v ON_ERROR_STOP=1 -U postgres -d atlas_test -f scripts/bootstrap-postgres-ci.sql

      - name: Vérifier les rôles Postgres
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          set -e
          psql -h localhost -p 5432 -X -A -t -U postgres -d atlas_test -c "SELECT rolname, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb, rolcanlogin FROM pg_roles WHERE rolname IN ('postgres','atlas_owner','atlas_app');"
          INVALID_ROLES=$(psql -h localhost -p 5432 -X -A -t -U postgres -d atlas_test -c "SELECT rolname FROM pg_roles WHERE rolname IN ('atlas_owner','atlas_app') AND (rolsuper OR rolbypassrls);")
          if [ -n "$INVALID_ROLES" ]; then
            echo "Erreur : rôle PostgreSQL trop privilégié : $INVALID_ROLES"
            exit 1
          fi
          echo "Rôles PostgreSQL applicatifs correctement restreints."

      - name: Appliquer les migrations
        env:
          DATABASE_URL: postgresql://atlas_owner:atlas_owner_ci_pw@localhost:5432/atlas_test
        run: npm run db:migrate

      - name: Vérifier l'état RLS
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          set -e
          psql -h localhost -p 5432 -X -A -U postgres -d atlas_test -c "SELECT n.nspname, c.relname, c.relrowsecurity, c.relforcerowsecurity, pg_get_userbyid(c.relowner) AS owner FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' ORDER BY c.relname;"

      - name: Diagnostic privilèges atlas_app
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          set -e
          echo '=== current_user/session_user (postgres) ==='
          psql -h localhost -p 5432 -U postgres -d atlas_test -c "SELECT current_user, session_user;"
          echo '=== current_user/session_user (atlas_owner) ==='
          PGPASSWORD=atlas_owner_ci_pw psql -h localhost -p 5432 -U atlas_owner -d atlas_test -c "SELECT current_user, session_user;"
          echo '=== current_user/session_user (atlas_app) ==='
          PGPASSWORD=atlas_app_ci_pw psql -h localhost -p 5432 -U atlas_app -d atlas_test -c "SELECT current_user, session_user;"
          echo '=== has_table_privilege for atlas_app ==='
          psql -h localhost -p 5432 -U postgres -d atlas_test -c "SELECT c.relname, pg_get_userbyid(c.relowner) AS owner, has_table_privilege('atlas_app', c.oid, 'SELECT') AS can_select, has_table_privilege('atlas_app', c.oid, 'INSERT') AS can_insert, has_table_privilege('atlas_app', c.oid, 'UPDATE') AS can_update, has_table_privilege('atlas_app', c.oid, 'DELETE') AS can_delete FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname IN ('lignes_devis','fragments_documents','propositions_ia') ORDER BY c.relname;"
          echo '=== relacl raw data ==='
          psql -h localhost -p 5432 -U postgres -d atlas_test -c "SELECT c.relname, pg_get_userbyid(c.relowner) AS owner, c.relacl FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname IN ('lignes_devis','fragments_documents','propositions_ia') ORDER BY c.relname;"
          echo '=== information_schema.role_table_grants ==='
          psql -h localhost -p 5432 -U postgres -d atlas_test -c "SELECT grantee, table_name, privilege_type FROM information_schema.role_table_grants WHERE grantee = 'atlas_app' AND table_name IN ('lignes_devis','fragments_documents','propositions_ia') ORDER BY table_name, privilege_type;"
          echo '=== pg_default_acl ==='
          psql -h localhost -p 5432 -U postgres -d atlas_test -c "SELECT defaclrole::regrole AS owner_role, defaclnamespace::regnamespace AS schema_name, defaclobjtype, defaclacl FROM pg_default_acl ORDER BY 1, 2, 3;"
          echo '=== atlas_app simple selects ==='
          PGPASSWORD=atlas_app_ci_pw psql -h localhost -p 5432 -U atlas_app -d atlas_test -c "SELECT current_user; SELECT count(*) FROM lignes_devis; SELECT count(*) FROM fragments_documents; SELECT count(*) FROM propositions_ia;"

      - name: Suite de tests (base de données)
        env:
          DATABASE_URL: postgresql://atlas_app:atlas_app_ci_pw@localhost:5432/atlas_test
        run: npm test

      - name: Build de production (vérification structurelle)
        env:
          STORAGE_PROVIDER: s3
          STORAGE_S3_BUCKET: ci-placeholder-bucket
          STORAGE_S3_ACCESS_KEY_ID: ci-placeholder-key
          STORAGE_S3_SECRET_ACCESS_KEY: ci-placeholder-secret
          CRON_SECRET: ci-placeholder-cron-secret-0000000000
          NODE_ENV: production
        run: npm run build

      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e
