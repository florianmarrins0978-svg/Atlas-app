name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_pw
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # test-rate-limit-redis-real.ts vérifie la limitation de débit contre un
      # vrai Redis : la production l'exige (env.ts refuse un repli en mémoire),
      # la CI doit donc en fournir un.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_pw@localhost:5432/atlas_test
      AUTH_SECRET: ci-secret-not-a-real-production-value-000000000000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # La documentation de reprise (CLAUDE.md §2) n'a de valeur que si ses
      # chemins existent encore. Un fichier renommé sans elle envoie le lecteur
      # suivant vers une porte fermée — et c'est précisément quelqu'un qui
      # arrive sans contexte.
      - name: Vérifier la mémoire du dépôt
        run: npm run verifier:memoire

      - name: Bootstrap PostgreSQL CI
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          psql -h localhost -p 5432 -v ON_ERROR_STOP=1 -U postgres -d atlas_test -f scripts/bootstrap-postgres-ci.sql

      - name: Vérifier les rôles Postgres
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          set -e
          psql -h localhost -p 5432 -X -A -t -U postgres -d atlas_test -c "SELECT rolname, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb, rolcanlogin FROM pg_roles WHERE rolname IN ('postgres','atlas_owner','atlas_app');"
          INVALID_ROLES=$(psql -h localhost -p 5432 -X -A -t -U postgres -d atlas_test -c "SELECT rolname FROM pg_roles WHERE rolname IN ('atlas_owner','atlas_app') AND (rolsuper OR rolbypassrls);")
          if [ -n "$INVALID_ROLES" ]; then
            echo "Erreur : rôle PostgreSQL trop privilégié : $INVALID_ROLES"
            exit 1
          fi
          echo "Rôles PostgreSQL applicatifs correctement restreints."

      - name: Appliquer les migrations
        env:
          DATABASE_URL: postgresql://atlas_owner:atlas_owner_ci_pw@localhost:5432/atlas_test
        run: npm run db:migrate

      - name: Vérifier l'état RLS
        env:
          PGPASSWORD: postgres_ci_pw
        run: |
          set -e
          psql -h localhost -p 5432 -X -A -U postgres -d atlas_test -c "SELECT n.nspname, c.relname, c.relrowsecurity, c.relforcerowsecurity, pg_get_userbyid(c.relowner) AS owner FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' ORDER BY c.relname;"

      # Les suites tournent en atlas_app — rôle applicatif, soumis à RLS et sans
      # TRUNCATE — pour que les tests « fail-closed » et NOBYPASSRLS aient un
      # sens. Seul le nettoyage entre suites, opération de banc d'essai, emprunte
      # le rôle propriétaire via DATABASE_ADMIN_URL (cf. scripts/_test-db.ts).
      - name: Suite de tests (base de données)
        env:
          DATABASE_URL: postgresql://atlas_app:atlas_app_ci_pw@localhost:5432/atlas_test
          DATABASE_ADMIN_URL: postgresql://atlas_owner:atlas_owner_ci_pw@localhost:5432/atlas_test
        run: npm test

      - name: Build de production (vérification structurelle)
        env:
          STORAGE_PROVIDER: s3
          STORAGE_S3_BUCKET: ci-placeholder-bucket
          STORAGE_S3_ACCESS_KEY_ID: ci-placeholder-key
          STORAGE_S3_SECRET_ACCESS_KEY: ci-placeholder-secret
          CRON_SECRET: ci-placeholder-cron-secret-0000000000
          # env.ts refuse tout repli en mémoire pour la limitation de débit en
          # production : le build collecte les données de page et instancie donc
          # cette configuration. On pointe le service Redis du job.
          REDIS_URL: redis://localhost:6379
          NODE_ENV: production
        run: npm run build

      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        env:
          # Sans CRON_SECRET, la route de purge répond 503 (« non configuré »)
          # au lieu de 401 : test-cron-purge.ts vérifie précisément le rejet
          # d'un appel non authentifié, ce qui suppose un secret configuré.
          CRON_SECRET: ci-placeholder-cron-secret-0000000000
          # Adosse la limitation de débit à Redis plutôt qu'à la mémoire du
          # serveur, pour que le runner puisse remettre à zéro le compteur de
          # connexion entre deux suites (cf. scripts/run-e2e-tests.ts).
          REDIS_URL: redis://localhost:6379
        run: npm run test:e2e
